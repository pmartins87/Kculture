name: all3-v25a-shadow-prefix-state-basin

# DORMANT TEMPLATE. Activate only if V24B audit returns
# V24B_NOT_DISTILLABLE_COMPACTLY.

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install complete pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35627972979
          name: all3-v23a-immutable-source-snapshot
          path: artifacts/v23a-snapshot
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35627972979
          name: all3-v23-config
          path: artifacts/v23-config
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35632311093
          name: all3-v23b-fallback-domain-upper-bound
          path: artifacts/v23b-binding
      - name: Run V25A shard
        run: |
          mkdir -p artifacts/v25a
          python tools/all3_v25a_shadow_prefix_basin_shard.py \
            --hard-config artifacts/v23-config/V23B_HARD_CONFIG.json \
            --v23b-aggregate artifacts/v23b-binding/v23b-final/ALL3_V23B_IMMUTABLE_SNAPSHOT_DOMAIN_UPPER_BOUND.json \
            --snapshot-dir artifacts/v23a-snapshot \
            --shard-index ${{ matrix.shard_index }} \
            --num-shards 4 \
            --out artifacts/v25a/V25A_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25a-shard-${{ matrix.shard_index }}
          path: artifacts/v25a/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v25a-shard-*
          path: artifacts/v25a-shards
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35627972979
          name: all3-v23-config
          path: artifacts/v23-config
      - name: Aggregate V25A
        run: |
          mkdir -p artifacts/v25a-final
          python tools/aggregate_all3_v25a_shadow_prefix_basin.py \
            --input-dir artifacts/v25a-shards \
            --hard-config artifacts/v23-config/V23B_HARD_CONFIG.json \
            --cluster-map artifacts/v23-config/V23_FUNCTIONAL_CLUSTERS.json \
            --out artifacts/v25a-final/ALL3_V25A_SHADOW_PREFIX_STATE_BASIN.json
      - uses: actions/upload-artifact@v4
        with:
          name: all3-v25a-shadow-prefix-state-basin
          path: artifacts/v25a-final/*.json
          retention-days: 30
          if-no-files-found: error
