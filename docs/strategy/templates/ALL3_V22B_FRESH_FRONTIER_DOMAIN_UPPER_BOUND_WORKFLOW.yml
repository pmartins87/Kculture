name: all3-v22b-fresh-frontier-domain-upper-bound

# DORMANT TEMPLATE — DO NOT PLACE UNDER .github/workflows/ UNTIL
# binding V22A returns V22A_FRESH_FRONTIER_HARD_POPULATION_READY.

'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v22b-fresh-frontier-domain-upper-bound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy

      - name: Syntax
        run: |
          python -m py_compile tools/all3_v22b_domain_upper_bound_shard.py
          python -m py_compile tools/aggregate_all3_v22b_domain_upper_bound.py

      - name: Run V22B shard
        run: |
          mkdir -p artifacts/v22b
          python tools/all3_v22b_domain_upper_bound_shard.py             --hard-config configs/all3_v22b_hard_contexts.json             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v22b/V22B_SHARD_${{ matrix.shard_index }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22b-shard-${{ matrix.shard_index }}
          path: artifacts/v22b/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: v22b-shard-*
          path: artifacts/v22b-shards
          merge-multiple: false

      - name: Aggregate V22B
        run: |
          mkdir -p artifacts/v22b-aggregate
          python tools/aggregate_all3_v22b_domain_upper_bound.py             --input-dir artifacts/v22b-shards             --hard-config configs/all3_v22b_hard_contexts.json             --out artifacts/v22b-aggregate/ALL3_V22B_FRESH_FRONTIER_DOMAIN_UPPER_BOUND.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v22b-fresh-frontier-domain-upper-bound
          path: artifacts/v22b-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
