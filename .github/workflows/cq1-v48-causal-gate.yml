name: cq1-v48-causal-gate
'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/cq1_v48_causal_gate.py
      - name: Run fresh O-CQ1 V48 causal gate
        run: |
          mkdir -p artifacts/cq1-v48-causal
          python tools/cq1_v48_causal_gate.py \
            --out artifacts/cq1-v48-causal/CQ1_V48_CAUSAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cq1-v48-causal
          path: artifacts/cq1-v48-causal/*.json
          retention-days: 30
          if-no-files-found: warn
