name: v48-market-temporal-localization-v4d
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/v48-market-temporal-localization-v4d.yml'
      - 'tools/v48_market_temporal_localization_v4d_shard.py'
      - 'tools/aggregate_v48_market_temporal_localization_v4d.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        seed: [74101,74102,74103,74104,74105,74106]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/v48_market_temporal_localization_v4d_shard.py
      - name: Run localization shard
        run: |
          mkdir -p artifacts/v4d-shard
          python tools/v48_market_temporal_localization_v4d_shard.py \
            --seed ${{ matrix.seed }} \
            --out artifacts/v4d-shard/V48_V4D_${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4d-shard-${{ matrix.seed }}
          path: artifacts/v4d-shard/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v4d-shard-*
          path: artifacts/v4d-shards
          merge-multiple: false
      - name: Aggregate
        run: |
          mkdir -p artifacts/v4d-aggregate
          python tools/aggregate_v48_market_temporal_localization_v4d.py \
            --input-dir artifacts/v4d-shards \
            --out artifacts/v4d-aggregate/V48_V4D_TEMPORAL_LOCALIZATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v48-market-temporal-localization-v4d
          path: artifacts/v4d-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
