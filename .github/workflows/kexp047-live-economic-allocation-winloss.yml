name: kexp047-live-economic-allocation-winloss

on:
  push:
    paths:
      - .github/workflows/kexp047-live-economic-allocation-winloss.yml
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Verify frozen tool
        run: test "$(git rev-parse HEAD:tools/live_economic_allocation_winloss.py)" = "32951de780fb2502b8398f738ce5c74e5e11c4d8"
      - name: Build winner-vs-loser economic radar
        run: python tools/live_economic_allocation_winloss.py --top 20 --output artifacts/kexp047/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp047-live-economic-allocation-winloss
          path: artifacts/kexp047/report.json
