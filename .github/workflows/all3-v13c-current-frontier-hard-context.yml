name: all3-v13c-current-frontier-hard-context
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v13c-current-frontier-hard-context.yml'
      - 'tools/all3_v13c_current_frontier_hard_context.py'
      - 'configs/all3_v13c_current_frontier_representatives.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/all3_v13c_current_frontier_hard_context.py
      - name: Run V13C hard-context census
        run: |
          mkdir -p artifacts/v13c
          python tools/all3_v13c_current_frontier_hard_context.py             --config configs/all3_v13c_current_frontier_representatives.json             --out artifacts/v13c/ALL3_V13C_CURRENT_FRONTIER_HARD_CONTEXT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v13c-current-frontier-hard-context
          path: artifacts/v13c/*.json
          retention-days: 30
          if-no-files-found: warn
