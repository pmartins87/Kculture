name: o-lq1-v48-causal-gate
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/o-lq1-v48-causal-gate.yml'
      - 'tools/first_party_late_queue_sanitation_causal_gate.py'
      - 'tools/cq2_projected_queue_dev_matrix.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/first_party_late_queue_sanitation_causal_gate.py
          python -m py_compile tools/cq2_projected_queue_dev_matrix.py
      - name: Run fresh O-LQ1 V48 causal gate
        run: |
          mkdir -p artifacts/o-lq1-v48-causal
          python tools/first_party_late_queue_sanitation_causal_gate.py \
            --out artifacts/o-lq1-v48-causal/O_LQ1_V48_CAUSAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o-lq1-v48-causal
          path: artifacts/o-lq1-v48-causal/*.json
          retention-days: 30
          if-no-files-found: warn
