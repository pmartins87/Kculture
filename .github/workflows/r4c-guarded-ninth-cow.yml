name: r4c-guarded-ninth-cow

on:
  workflow_dispatch:

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen environment
        run: python -m pip install -r requirements.txt

      - name: Fetch hash-pinned public agents
        run: python tools/fetch_public_opponents.py

      - name: R4A control versus Seyamalam V21
        run: >-
          python tools/run_tournament.py
          --candidate file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --opponents file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --seed-partition development
          --limit-seeds 8
          --output-root artifacts/r4c/control

      - name: R4C versus Seyamalam V21
        run: >-
          python tools/run_tournament.py
          --candidate file:candidates/r4c_ninth_cow.py:agent
          --opponents file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --seed-partition development
          --limit-seeds 8
          --output-root artifacts/r4c/candidate_vs_seyamalam

      - name: R4C direct versus R4A
        run: >-
          python tools/run_tournament.py
          --candidate file:candidates/r4c_ninth_cow.py:agent
          --opponents file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --seed-partition development
          --limit-seeds 8
          --output-root artifacts/r4c/candidate_vs_r4a

      - name: Preserve R4C evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4c-guarded-ninth-cow
          path: |
            artifacts/public_opponents/fetch_receipt.json
            artifacts/r4c/**/tournament.json
