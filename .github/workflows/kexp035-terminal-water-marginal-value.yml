name: kexp035-terminal-water-marginal-value

on:
  push:
    paths:
      - .github/workflows/kexp035-terminal-water-marginal-value.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen diagnostic and base
        run: |
          test "$(git rev-parse HEAD:tools/audit_terminal_water_marginal_value.py)" = "b2ce97dfb03d755bed60b97dedc3f2fb25259e5b"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Audit terminal WATER marginal value
        run: python tools/audit_terminal_water_marginal_value.py --output artifacts/kexp035/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp035-terminal-water-marginal-value
          path: artifacts/kexp035/**
