name: v28c-v47-status-readonly
# read-only refresh requested 2026-09-22T20:34Z
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/v28c-v47-status-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: kaggriculture
      V47_ID: '56466970'
      ALL3_ID: '56367770'
      ORW1_ID: '56336027'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query current submissions and leaderboard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -U 'kaggle>=2.2.3'
          kaggle competitions submissions "$COMPETITION" -v -q | tee submissions.csv
          kaggle competitions leaderboard "$COMPETITION" --show -v | tee leaderboard.csv || true
          python - <<'PY'
          import csv, io, json, os
          from pathlib import Path
          text=Path("submissions.csv").read_text(encoding="utf-8",errors="replace")
          lines=[x for x in text.splitlines() if x.strip()]
          rows=[]
          for i,line in enumerate(lines):
              if "," not in line: continue
              cand=list(csv.DictReader(io.StringIO("\n".join(lines[i:]))))
              if cand and any(k and "ref" in k.lower() for k in cand[0]):
                  rows=cand; break
          if not rows: raise SystemExit("could not parse submissions")
          def get(row,needle): return next((str(v) for k,v in row.items() if k and needle in k.lower()),"")
          rows=sorted(rows,key=lambda r:get(r,"date"),reverse=True)
          target=next((r for r in rows if get(r,"ref")==os.environ["V47_ID"]),None)
          if target is None: raise SystemExit("V47 submission missing")
          out={
            "v47_submission_id":os.environ["V47_ID"],
            "v47_status":get(target,"status"),
            "v47_public_score":get(target,"publicscore"),
            "v47_date":get(target,"date"),
            "latest_two":[get(r,"ref") for r in rows[:2]],
            "all3_row":next(({"status":get(r,"status"),"public_score":get(r,"publicscore"),"date":get(r,"date")} for r in rows if get(r,"ref")==os.environ["ALL3_ID"]),None),
            "orw1_in_latest_two":os.environ["ORW1_ID"] in [get(r,"ref") for r in rows[:2]]
          }
          Path("v28c_status.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print("V28C_STATUS",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28c-v47-status-readonly
          path: |
            submissions.csv
            leaderboard.csv
            v28c_status.json
          retention-days: 14
          if-no-files-found: warn
