name: FP001 H8 COW3 CARE runtime

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-principles-economy-v1
    paths:
      - 'candidates/fp001_h8_cow3_care_wrapper.py'
      - 'tools/fp001_h8_cow3_care_runtime_test.py'
      - '.github/workflows/fp001-h8-cow3-care-runtime.yml'
      - 'candidates/fp001_h8_multi_animal_module.py'
      - 'requirements.txt'

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Kaggriculture environment
        run: pip install -r requirements.txt
      - name: Run paired COW3 CARE runtime gate
        run: python tools/fp001_h8_cow3_care_runtime_test.py
