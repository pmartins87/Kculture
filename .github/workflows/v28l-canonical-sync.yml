name: v28l-canonical-sync
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v28l-canonical-sync.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
          fetch-depth: 0
      - name: Update canonical sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          marker='## Binding update — 2026-09-23 — V28J/V28K/V28L COMPLETE / PHYSICAL IMITATION CLOSED'
          block='''\n\n## Binding update — 2026-09-23 — V28J/V28K/V28L COMPLETE / PHYSICAL IMITATION CLOSED\n\n**This block supersedes lower current-action sections.**\n\n### V28J — COMPLETE\nWorkflow `35822283032`: mechanics PASS. Decision **`V28J_BOUNDED_LEGAL_HISTORY_RISK_PHENOTYPE_NOT_IDENTIFIABLE`**. Held-out precision 0.5882, recall 1.0, specificity 0.5, balanced accuracy 0.75. Simple classifier-based risk gating on 384–480 is closed without retuning. Result: `docs/strategy/V28J_BOUNDED_LEGAL_HISTORY_RISK_IDENTIFIABILITY_RESULT_2026-09-23.md`.\n\n### V28K — COMPLETE\nWorkflow `35822623519`: mechanics PASS. Decision **`V28K_NO_MIDGAME_WINDOW_WL_HEADROOM`**. MARKET and FULL had zero loss-to-win flips. PHYSICAL had 4 flips across 2 sources but only one seed. Result: `docs/strategy/V28K_MIDGAME_DOMAIN_UPPER_BOUND_RESULT_2026-09-23.md`.\n\n### V28L — COMPLETE\nWorkflow `35827398179`: mechanics PASS, failures 0. Decision **`V28L_NO_ROBUST_PHYSICAL_TEMPORAL_HEADROOM`**. EARLY had 0 loss-to-win flips. PRE_MID and LATE each had 4 flips across 2 sources and both seats with mean score delta +0.060606, but all flips were concentrated in one seed, failing the frozen >=2-seed rule. Result: `docs/strategy/V28L_PHYSICAL_CAUSAL_TEMPORAL_LOCALIZATION_RESULT_2026-09-23.md`.\n\n### Binding route\nV28K+V28L exhaust opponent-action physical imitation across the full episode partition without weakening thresholds. That rescue path is closed. Return to broader first-party mechanism discovery/final competition strategy. Opponent identity/source/rank/SHA remains offline forensic metadata only and is forbidden as a runtime feature.\n\nHosted pair remains exactly V47 `56466970` + ALL3 `56367770`. No Kaggle submission, deletion or reordering is authorized.\n'''
          for fn in ['STATUS.md','ROADMAP.md','HANDOFF.md']:
              p=Path(fn); s=p.read_text()
              if marker not in s:
                  i=s.find('\n'); p.write_text(s[:i+1]+block+s[i+1:])
          p=Path('data/programme_teacher/2026-09-18/OPTION_LIBRARY_V0.json'); d=json.loads(p.read_text())
          d['v28j']={'status':'COMPLETE','workflow':35822283032,'decision':'V28J_BOUNDED_LEGAL_HISTORY_RISK_PHENOTYPE_NOT_IDENTIFIABLE','mechanical_pass':True,'holdout_precision':0.5882352941176471,'holdout_recall':1.0,'holdout_specificity':0.5,'holdout_balanced_accuracy':0.75,'result_doc':'docs/strategy/V28J_BOUNDED_LEGAL_HISTORY_RISK_IDENTIFIABILITY_RESULT_2026-09-23.md'}
          d['v28k']={'status':'COMPLETE','workflow':35822623519,'decision':'V28K_NO_MIDGAME_WINDOW_WL_HEADROOM','mechanical_pass':True,'market_loss_to_win_flips':0,'physical_loss_to_win_flips':4,'physical_flip_sources':2,'physical_flip_seeds':1,'physical_mean_score_delta':0.06060606060606061,'full_loss_to_win_flips':0,'result_doc':'docs/strategy/V28K_MIDGAME_DOMAIN_UPPER_BOUND_RESULT_2026-09-23.md'}
          d['v28l']={'status':'COMPLETE','workflow':35827398179,'decision':'V28L_NO_ROBUST_PHYSICAL_TEMPORAL_HEADROOM','mechanical_pass':True,'failures':0,'selected_window':None,'early_loss_to_win_flips':0,'pre_mid_loss_to_win_flips':4,'pre_mid_flip_sources':2,'pre_mid_flip_seeds':1,'late_loss_to_win_flips':4,'late_flip_sources':2,'late_flip_seeds':1,'result_doc':'docs/strategy/V28L_PHYSICAL_CAUSAL_TEMPORAL_LOCALIZATION_RESULT_2026-09-23.md'}
          d['next_stage']='broader first-party mechanism discovery/final competition strategy; physical imitation closed; preserve exact hosted pair V47 56466970 + ALL3 56367770; no Kaggle mutation'
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'kculture-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add STATUS.md ROADMAP.md HANDOFF.md
          git add -f data/programme_teacher/2026-09-18/OPTION_LIBRARY_V0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Bind V28J V28K V28L results and close physical imitation'
          git push origin HEAD:research/prize-solver-v0
