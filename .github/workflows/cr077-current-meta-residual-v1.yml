name: cr077-current-meta-residual-v1
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr077-current-meta-residual-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install kagglehub numpy scikit-learn
      - name: Compile CR077
        run: python -m py_compile tools/cr077_current_meta_residual.py
      - name: Run state-controlled current-meta residual analysis
        run: |
          python tools/cr077_current_meta_residual.py \
            --top 60 \
            --output artifacts/cr077/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr077-current-meta-residual-v1
          path: |
            artifacts/cr077/summary.json
            artifacts/cr077/summary.md
          retention-days: 30
          if-no-files-found: error
