# Mechanical relaunch only: strategy/gate/config remain frozen.
name: cr036-rank5-component-graft
on:
  push:
    paths:
      - '.github/workflows/cr036-rank5-component-graft.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant_id: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact environment
        run: python -m pip install -r requirements.txt kagglehub 'kaggle>=2.2.3'
      - name: Download CR035 verified source bundle
        uses: actions/download-artifact@v4
        with:
          name: cr035-source-bundle
          path: artifacts/cr035_source_bundle
          run-id: 34016286606
          github-token: ${{ github.token }}
      - name: Syntax check frozen CR036
        run: |
          python -m py_compile tools/cr035_public_regime_selector_shard.py
          python -m py_compile tools/cr036_rank5_component_graft_shard.py
      - name: Run component graft shard
        run: >-
          python tools/cr036_rank5_component_graft_shard.py
          --variant-id ${{ matrix.variant_id }}
          --source-bundle artifacts/cr035_source_bundle/source_bundle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr036-variant-${{ matrix.variant_id }}
          path: artifacts/cr036_rank5_component_graft/shards/variant_*.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: screen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download CR036 variants
        uses: actions/download-artifact@v4
        with:
          pattern: cr036-variant-*
          path: artifacts/cr036_downloaded
          merge-multiple: true
      - name: Syntax check aggregate
        run: python -m py_compile tools/cr036_rank5_component_graft_aggregate.py
      - name: Aggregate frozen gate
        run: python tools/cr036_rank5_component_graft_aggregate.py --input-dir artifacts/cr036_downloaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr036-rank5-component-graft-final
          path: |
            artifacts/cr036_rank5_component_graft/report.json
            artifacts/cr036_rank5_component_graft/summary.json
          if-no-files-found: warn
          retention-days: 30
