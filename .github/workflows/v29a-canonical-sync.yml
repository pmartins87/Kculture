name: V29A canonical sync
on:
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v29a-canonical-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
          fetch-depth: 0
      - name: Record V29A binding closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          block='''\n\n## Binding update — 2026-09-23 — V29A RECURRENT STRUCTURAL DISTILLATION CLOSED\n\n**This block supersedes lower current-action sections.**\n\nBinding workflow: **`35876362346`**. Mechanics PASS; immutable V27C2 data from workflow `35682535729` only; exact frozen 8-epoch GRU-64 structural experiment completed successfully.\n\nDecision: **`V29A_RECURRENT_STRUCTURAL_DISTILLATION_FAIL`**.\n\nFrozen holdout: complete-action parity **0.0712795549**; minimum-source complete-action parity **0.0702364395**; minimum-stage complete-action parity **0.0034722222**; farmer parity **0.7450741771**; hands parity **0.1500927214**; market parity **0.3729717200**; market-slot accuracy **0.9000811312**; unit-sample accuracy **0.6661316014**. `strong_pass=false`; `causal_eligible=false`.\n\nResult: `docs/strategy/V29A_RECURRENT_STRUCTURAL_DISTILLATION_RESULT_2026-09-23.md`.\n\nBinding route: **do not launch V29B**. Do not tune hidden size, epochs, learning rate, loss weights, split or holdout-guided architecture. Close this recurrent structural teacher-distillation family. Protected hosted pair remains exact V47 `56466970` + ALL3 `56367770`; no Kaggle mutation authorized. Next strategic work returns to final-week preservation or a separately preregistered genuinely different architecture.\n'''
          for fn in ['STATUS.md','ROADMAP.md','HANDOFF.md']:
              p=Path(fn); s=p.read_text()
              if 'V29A RECURRENT STRUCTURAL DISTILLATION CLOSED' not in s:
                  first=s.find('\n')
                  s=s[:first+1]+block+s[first+1:]
                  p.write_text(s)
          p=Path('data/programme_teacher/2026-09-18/OPTION_LIBRARY_V0.json')
          d=json.loads(p.read_text())
          d['v29a_recurrent_structural_distillation_2026_09_23']={
            'workflow':35876362346,
            'source_data_workflow':35682535729,
            'mechanical_pass':True,
            'decision':'V29A_RECURRENT_STRUCTURAL_DISTILLATION_FAIL',
            'strong_pass':False,
            'causal_eligible':False,
            'holdout_complete_action_parity':0.07127955493741307,
            'holdout_minimum_source_complete_action_parity':0.0702364394993046,
            'holdout_minimum_stage_complete_action_parity':0.003472222222222222,
            'holdout_farmer_parity':0.7450741770978211,
            'holdout_hands_parity':0.1500927213722763,
            'holdout_market_parity':0.37297171998145573,
            'holdout_market_slot_accuracy':0.9000811312007417,
            'holdout_unit_sample_accuracy':0.6661316014440611,
            'result_doc':'docs/strategy/V29A_RECURRENT_STRUCTURAL_DISTILLATION_RESULT_2026-09-23.md',
            'route':'CLOSE_NO_RETUNING_NO_V29B'
          }
          p.write_text(json.dumps(d,indent=2,sort_keys=False)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md ROADMAP.md HANDOFF.md
          git add -f data/programme_teacher/2026-09-18/OPTION_LIBRARY_V0.json
          git commit -m 'Record binding V29A failure in canonical sources'
          git push origin HEAD:research/prize-solver-v0
