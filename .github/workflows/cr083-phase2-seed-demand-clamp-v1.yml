name: CR083 Phase-2 seed-demand clamp v1
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr083-phase2-seed-demand-clamp-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'kaggle-environments==1.32.7' numpy
      - uses: actions/download-artifact@v4
        with:
          name: cr080-confirmation-packages-v1
          path: source/anchors
          run-id: 34655496708
          github-token: ${{ github.token }}
      - name: Build the single frozen candidate
        run: |
          mkdir -p corpus build
          python tools/cr083_build_seed_demand_clamp.py \
            --base source/anchors/CR071M.tar.gz \
            --output corpus/CR083.tar.gz \
            --manifest build/CANDIDATE_MANIFEST.json
          cp source/anchors/CR071M.tar.gz corpus/CR071M.tar.gz
          cp source/anchors/CR053.tar.gz corpus/CR053.tar.gz
          cp source/anchors/CR061.tar.gz corpus/CR061.tar.gz
          cp source/anchors/CR065.tar.gz corpus/CR065.tar.gz
      - name: Deterministic rebuild
        run: |
          python tools/cr083_build_seed_demand_clamp.py \
            --base source/anchors/CR071M.tar.gz \
            --output build/CR083_REBUILD.tar.gz \
            --manifest build/REBUILD_MANIFEST.json
          cmp corpus/CR083.tar.gz build/CR083_REBUILD.tar.gz
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          a=h('corpus/CR083.tar.gz'); b=h('build/CR083_REBUILD.tar.gz')
          m1=json.loads(Path('build/CANDIDATE_MANIFEST.json').read_text())
          m2=json.loads(Path('build/REBUILD_MANIFEST.json').read_text())
          assert a==b==m1['candidate_sha256']==m2['candidate_sha256'],(a,b,m1,m2)
          assert m1['clamp_start_step']==434 and m1['last_route_switch_step']==433,m1
          assert m1['farmer_hands_modified'] is False and m1['route_switch_modified'] is False,m1
          assert m1['non_seed_market_logic_modified'] is False and m1['seed_quantity_can_increase'] is False,m1
          print('CR083 deterministic frozen hash:',a)
          PY
      - name: Score-blind exact-observation shadow audit
        run: |
          python tools/cr083_seed_clamp_shadow_audit.py \
            --base corpus/CR071M.tar.gz \
            --candidate corpus/CR083.tar.gz \
            --seed-count 2 \
            --output build/SHADOW_AUDIT.json
          python - <<'PY'
          import json
          d=json.load(open('build/SHADOW_AUDIT.json'))
          assert d['pass'] is True,d
          assert d['score_blind'] is True,d
          assert d['seed_units_removed']>0,d
          print('CR083 shadow audit PASS; exercised removals:',d['seed_units_removed_by_crop'])
          PY
      - name: Fresh Gate-A and promotion seed firewall
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from kaggle_exact_runtime import make_seeds
          prior=json.loads(Path('experiments/CR080_MENGFEI_BRIDGE_2026-09-11/seed_firewall.json').read_text())
          masters=[]
          masters.extend(prior.get('earlier_masters_checked',[]))
          if prior.get('master_seed') is not None: masters.append(prior['master_seed'])
          masters.extend([9112080,9112081,9120811,9120812,9120813,9120821,9130830,91308309])
          masters=list(dict.fromkeys(int(x) for x in masters))
          used=set()
          for master in masters: used.update(make_seeds(512,master))
          ga=make_seeds(16,9130831); promo=make_seeds(32,9130832)
          assert not (used & set(ga)), sorted(used & set(ga))
          assert not (used & set(promo)), sorted(used & set(promo))
          assert not (set(ga) & set(promo)), sorted(set(ga)&set(promo))
          Path('corpus/seed_firewall.json').write_text(json.dumps({
              'gate_a_master':9130831,'gate_a_seeds':ga,
              'promotion_master':9130832,'promotion_seeds':promo,
              'earlier_masters':masters,'all_overlaps_zero':True
          },indent=2))
          print('CR083 Phase-2 seed firewall PASS')
          PY
          cp build/CANDIDATE_MANIFEST.json corpus/CANDIDATE_MANIFEST.json
          cp build/SHADOW_AUDIT.json corpus/SHADOW_AUDIT.json
          sha256sum corpus/*.tar.gz > corpus/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cr083-phase2-frozen-packages-v1
          path: corpus/
          retention-days: 30
  gate_a:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pass: ${{ steps.decision.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'kaggle-environments==1.32.7' numpy
      - uses: actions/download-artifact@v4
        with:
          name: cr083-phase2-frozen-packages-v1
          path: corpus
      - name: Frozen fresh direct Gate A
        run: |
          python tools/kaggle_reference_h2h_v2.py \
            --a corpus/CR083.tar.gz --b corpus/CR071M.tar.gz \
            --a-id CR083 --b-id CR071M \
            --seed-count 16 --master-seed 9130831 \
            --output result/direct.json
          python tools/cr083_phase2_gate_a.py --result result/direct.json --output result/gate_a.json
      - id: decision
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('result/gate_a.json'))
          print('pass=' + ('true' if d['pass'] else 'false'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr083-phase2-gate-a-v1
          path: result/
          retention-days: 30
  promotion:
    needs: [prepare, gate_a]
    if: needs.gate_a.outputs.pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {a: CR083, b: CR071M}
          - {a: CR083, b: CR053}
          - {a: CR083, b: CR061}
          - {a: CR083, b: CR065}
          - {a: CR071M, b: CR053}
          - {a: CR071M, b: CR061}
          - {a: CR071M, b: CR065}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'kaggle-environments==1.32.7' numpy
      - uses: actions/download-artifact@v4
        with:
          name: cr083-phase2-frozen-packages-v1
          path: corpus
      - name: Frozen fresh promotion panel
        run: |
          python tools/kaggle_reference_h2h_v2.py \
            --a 'corpus/${{ matrix.a }}.tar.gz' --b 'corpus/${{ matrix.b }}.tar.gz' \
            --a-id '${{ matrix.a }}' --b-id '${{ matrix.b }}' \
            --seed-count 32 --master-seed 9130832 \
            --output 'results/${{ matrix.a }}_vs_${{ matrix.b }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr083-phase2-promo-${{ matrix.a }}-vs-${{ matrix.b }}
          path: results/*.json
          retention-days: 30
  aggregate:
    needs: promotion
    if: always() && needs.promotion.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/download-artifact@v4
        with:
          pattern: cr083-phase2-promo-*
          path: results
          merge-multiple: true
      - run: python tools/cr083_phase2_promotion_gate.py --results results --output summary/gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: cr083-phase2-promotion-gate-v1
          path: summary/
          retention-days: 30
