name: kexp042-live-phase-strategy-atlas

on:
  push:
    paths:
      - .github/workflows/kexp042-live-phase-strategy-atlas.yml
  workflow_dispatch:

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen atlas and base
        run: |
          test "$(git rev-parse HEAD:tools/live_phase_strategy_atlas.py)" = "fe989739d378f4ee25b917429e1b3a4eb4f8d33e"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Build full-game divergence atlas
        run: python tools/live_phase_strategy_atlas.py --top 10 --output artifacts/kexp042/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp042-live-phase-strategy-atlas
          path: artifacts/kexp042/report.json
