name: hosted-known-replay-retry

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  retry:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dataset client
        run: python -m pip install -U kagglehub
      - name: Retry exact 2026-08-27 hosted replay fetch
        id: fetch
        continue-on-error: true
        run: |
          python tools/fetch_known_hosted_replays.py \
            --episode kexp050:100987834 \
            --episode r4b:100996939 \
            --end-date 2026-08-27 \
            --lookback-days 4 \
            --output-dir artifacts/hosted-known
      - name: Analyze when available
        if: ${{ steps.fetch.outcome == 'success' }}
        run: |
          python tools/hosted_replay_loss_analyzer.py \
            artifacts/hosted-known/replays/kexp050_100987834.json \
            --team-substring 'Paulo Martins' \
            --output artifacts/hosted-known/kexp050_analysis.json
          python tools/hosted_replay_loss_analyzer.py \
            artifacts/hosted-known/replays/r4b_100996939.json \
            --team-substring 'Paulo Martins' \
            --output artifacts/hosted-known/r4b_analysis.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: hosted-known-replay-retry
          path: artifacts/hosted-known/**
          if-no-files-found: ignore
