name: kexp050-same-slot-carrot

on:
  push:
    paths:
      - .github/workflows/kexp050-same-slot-carrot.yml
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify identities
        run: |
          test "$(git rev-parse HEAD:candidates/r4d_reallocate_614_carrot.py)" = "61b77be136836328917441cb03f89bc6665c4c27"
          test "$(git rev-parse HEAD:tools/audit_kexp050_execution.py)" = "8199a3ffd8bc2501e0284e9df81c8df81a0575c3"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Mechanical execution audit
        run: python tools/audit_kexp050_execution.py --output artifacts/kexp050/execution/report.json
      - name: Fetch Kaito V27
        run: python tools/fetch_public_kaggle_notebook.py --handle kaitofukami/25-27-strict-future-v27-midgame-meta-reset/versions/4 --filename main.py --sha256 f48c21166eac68d1b05a401f04f94a2eb6154e65415af64893672365ff33c7b8 --output-dir artifacts/kexp050/kaito/opponent --receipt artifacts/kexp050/kaito/receipt.json
      - name: Screen Kaito V27
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_reallocate_614_carrot.py:agent --opponent file:artifacts/kexp050/kaito/opponent/main.py:agent --partition development --output artifacts/kexp050/kaito/report.json
      - name: Fetch Rayk V11
        run: python tools/fetch_public_kaggle_notebook.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/11 --filename main.py --sha256 adc61ab15b3b4016e49efe525f4906e6ae3bbb66c4ff29ab795ae09df9fbaa5f --output-dir artifacts/kexp050/rayk/opponent --receipt artifacts/kexp050/rayk/receipt.json
      - name: Screen Rayk V11
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_reallocate_614_carrot.py:agent --opponent file:artifacts/kexp050/rayk/opponent/main.py:agent --partition development --output artifacts/kexp050/rayk/report.json
      - name: Fetch Andrew V12
        run: python tools/fetch_public_kaggle_notebook.py --handle andrewsokolovsky/kaggriculture-breaking-the-tie/versions/12 --filename main.py --sha256 df4e899ad535754cf2ddbd3c16e48085916b0cd2baa5182a1a2cfc6a856abae5 --output-dir artifacts/kexp050/andrew/opponent --receipt artifacts/kexp050/andrew/receipt.json
      - name: Screen Andrew V12
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_reallocate_614_carrot.py:agent --opponent file:artifacts/kexp050/andrew/opponent/main.py:agent --partition development --output artifacts/kexp050/andrew/report.json
      - name: Development direct vs R4B
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_reallocate_614_carrot.py:agent --opponent file:candidates/r4b_ablation_market_only.py:agent --partition development --output artifacts/kexp050/direct-development/report.json
      - name: Exploratory live-meta direct vs R4B
        run: python tools/run_exploratory_live_meta_direct.py --candidate file:candidates/r4d_reallocate_614_carrot.py:agent --opponent file:candidates/r4b_ablation_market_only.py:agent --output artifacts/kexp050/direct-exploratory/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp050-same-slot-carrot
          path: artifacts/kexp050/**
