name: all3-hosted-exposure-count
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-hosted-exposure-count.yml'

permissions:
  contents: read

jobs:
  exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SID: '56367770'
      COMPETITION: kaggriculture
      DESCRIPTION: PS_ALL3_V1_RW1_TW1_LQ2_204A9ED4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -U 'kaggle>=2.2.3'
      - name: Count current public exposure
        shell: bash
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' | tee snapshot_utc.txt
          kaggle competitions submissions "$COMPETITION" -v -q | tee submissions.csv
          grep -F "$DESCRIPTION" submissions.csv | head -1 | tee all3_row.txt
          kaggle competitions episodes "$SID" -v -q | tee episodes.csv
          python - <<'PY'
          import csv,io,json
          from pathlib import Path
          t=Path("episodes.csv").read_text(encoding="utf-8",errors="replace")
          lines=[x for x in t.splitlines() if x.strip()]
          rows=[]
          for i,line in enumerate(lines):
              if "," not in line: continue
              cand=list(csv.DictReader(io.StringIO("\n".join(lines[i:]))))
              if cand and any(k and str(k).lower() in ("id","episodeid","episode") for k in cand[0]):
                  rows=cand;break
          completed=sum("COMPLETED" in str(r).upper() for r in rows)
          print("ALL3_EXPOSURE",json.dumps({"listed_episodes":len(rows),"completed_rows":completed},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all3-hosted-exposure-count
          path: |
            snapshot_utc.txt
            submissions.csv
            all3_row.txt
            episodes.csv
          retention-days: 30
