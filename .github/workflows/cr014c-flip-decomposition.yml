name: cr014c-flip-decomposition
on:
  push:
    paths:
      - '.github/workflows/cr014c-flip-decomposition.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen R4B dependencies
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:candidates/cr008_adaptive_frontrun.py)" = "8e1c26202c3101c19668bf61edf2ae51d4329d5d"
          test "$(git rev-parse HEAD:candidates/cr011_adaptive_early_order.py)" = "c4f1cb79f3c20b8229ab09e00a6878289cf9648d"
          test "$(git rev-parse HEAD:configs/cr014c_flip_pairs_v1.json)" = "ea1762fd292584f50d73d6251f065a6a590de827"
          test "$(git rev-parse HEAD:tools/cr014c_flip_decomposition.py)" = "e27692c1b27caf66ba19067c2f5b1af5eb970813"
      - name: Fetch exact flip-opponent packages
        run: |
          mkdir -p artifacts/cr014c/opponents
          python tools/fetch_exact_package_main.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/23 --output artifacts/cr014c/opponents/rayk.py --receipt artifacts/cr014c/opponents/rayk.json
          python tools/fetch_exact_package_main.py --handle boatlee/v21-r1-public-state-route-portfolio/versions/2 --output artifacts/cr014c/opponents/boatlee.py --receipt artifacts/cr014c/opponents/boatlee.json
          python tools/fetch_exact_package_main.py --handle tetsutani/read-the-town-build-the-farm-kaggriculture/versions/2 --output artifacts/cr014c/opponents/tetsu.py --receipt artifacts/cr014c/opponents/tetsu.json
      - name: Decompose five W-L flips
        run: |
          python tools/cr014c_flip_decomposition.py \
            --opponent-dir artifacts/cr014c/opponents \
            --output artifacts/cr014c/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr014c-flip-decomposition
          path: artifacts/cr014c/**
