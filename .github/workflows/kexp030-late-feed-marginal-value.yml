name: kexp030-late-feed-marginal-value

on:
  push:
    paths:
      - .github/workflows/kexp030-late-feed-marginal-value.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen diagnostic and base
        run: |
          test "$(git rev-parse HEAD:tools/audit_late_feed_marginal_value.py)" = "9aa2951b7aa315334d5201a5c10eaaa38c6c3292"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Audit late FEED marginal value
        run: python tools/audit_late_feed_marginal_value.py --output artifacts/kexp030/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp030-late-feed-marginal-value
          path: artifacts/kexp030/**
