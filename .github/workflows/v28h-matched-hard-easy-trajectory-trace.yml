name: v28h-matched-hard-easy-trajectory-trace
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/v28h-matched-hard-easy-trajectory-trace.yml'

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned execution runtime
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' numpy
      - uses: actions/download-artifact@v4
        with:
          name: v28f-immutable-snapshot
          path: artifacts/v28f-snapshot
          run-id: 35807910104
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v28f-all3-hedge-complementarity
          path: artifacts/v28f
          run-id: 35807910104
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v28g-all3-residual-hard-core-census
          path: artifacts/v28g
          run-id: 35812527508
          github-token: ${{ github.token }}
      - name: Run matched trajectory trace
        shell: bash
        run: |
          set -euo pipefail
          for k in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY; do unset "$k" || true; done
          python tools/v28h_matched_hard_easy_trace.py             --snapshot-dir artifacts/v28f-snapshot             --v28g artifacts/v28g/V28G_RESIDUAL_HARD_CORE.json             --v28f artifacts/v28f/V28F_ALL3_HEDGE_COMPLEMENTARITY.json             --out artifacts/v28h/V28H_MATCHED_TRACE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28h-matched-hard-easy-trajectory-trace
          path: artifacts/v28h/*.json
          retention-days: 30
          if-no-files-found: warn
