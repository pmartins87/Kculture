name: option-value-v2-league-preflight
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/option-value-v2-league-preflight.yml'
      - 'tools/option_value_v2_league_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/option_value_v2_league_preflight.py
      - name: Preflight diverse league
        run: python tools/option_value_v2_league_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-value-v2-league-preflight
          path: artifacts/option-value-v2-league/**
          retention-days: 30
