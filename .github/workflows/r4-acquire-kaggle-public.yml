name: r4-acquire-kaggle-public

on:
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require Kaggle API token
        shell: bash
        run: |
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "KAGGLE_API_TOKEN secret is not configured."
            echo "Add a Kaggle API token as a GitHub Actions repository secret, then dispatch this workflow again."
            exit 2
          fi

      - name: Install official Kaggle CLI
        run: python -m pip install 'kaggle==2.2.4'

      - name: Pull exact public notebook versions
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          cfg = json.loads(Path('configs/kaggle_public_targets.json').read_text(encoding='utf-8'))
          root = Path('artifacts/kaggle_public')
          root.mkdir(parents=True, exist_ok=True)
          for target in cfg['targets']:
              dest = root / target['id']
              dest.mkdir(parents=True, exist_ok=True)
              print(f"Pulling {target['kernel']} -> {dest}", flush=True)
              subprocess.run([
                  'kaggle', 'kernels', 'pull', target['kernel'],
                  '-p', str(dest), '-m'
              ], check=True)
          PY

      - name: Hash acquisition
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifacts/kaggle_public')
          rows = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  data = p.read_bytes()
                  rows.append({
                      'path': p.as_posix(),
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
          receipt = {'result': 'PASS', 'files': rows}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Preserve exact public sources
        uses: actions/upload-artifact@v4
        with:
          name: r4-kaggle-public-sources
          path: artifacts/kaggle_public/**
