name: cr074-current-meta-probe-v1
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr074-current-meta-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public dataset client
        run: |
          python -m pip install --upgrade pip
          python -m pip install kagglehub
      - name: Compile CR074 probe
        run: python -m py_compile tools/cr074_current_meta_probe.py
      - name: Probe newest official daily episode datasets and current meta
        run: |
          python tools/cr074_current_meta_probe.py \
            --start-date 2026-09-05 \
            --end-date 2026-09-09 \
            --top 30 \
            --submission-id 56124705 \
            --known-episode 107148813 \
            --output-dir artifacts/cr074
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr074-current-meta-probe-v1
          path: |
            artifacts/cr074/summary.json
            artifacts/cr074/summary.md
          retention-days: 30
          if-no-files-found: error
