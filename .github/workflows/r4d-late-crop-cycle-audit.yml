name: r4d-late-crop-cycle-audit

on:
  push:
    paths:
      - ".github/workflows/r4d-late-crop-cycle-audit.yml"
      - "tools/inspect_late_crop_cycles.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen environment
        run: python -m pip install -r requirements.txt
      - name: Fetch hash-pinned public base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen R4B blob
        run: test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Audit late crop cycles
        run: python tools/inspect_late_crop_cycles.py --output artifacts/kexp023/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp023-late-crop-cycle-audit
          path: artifacts/kexp023/report.json
