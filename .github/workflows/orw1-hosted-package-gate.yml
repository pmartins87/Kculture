name: orw1-hosted-package-gate
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/orw1-hosted-package-gate.yml'
      - 'tools/build_ready_wool_hosted_candidate.py'
      - 'tools/ready_wool_package_parity_gate.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Compile packaging tools
        run: |
          python -m py_compile tools/build_ready_wool_hosted_candidate.py
          python -m py_compile tools/ready_wool_package_parity_gate.py
      - name: Build deterministic candidate
        run: |
          mkdir -p artifacts/orw1-hosted-candidate
          python tools/build_ready_wool_hosted_candidate.py             --out-dir artifacts/orw1-hosted-candidate
      - name: Exact action parity smoke
        run: |
          python tools/ready_wool_package_parity_gate.py             --candidate artifacts/orw1-hosted-candidate/KCULTURE_V47_ORW1_ONESHOT_V1.tar.gz             --out artifacts/orw1-hosted-candidate/PACKAGE_PARITY.json
      - name: SHA manifest
        run: |
          cd artifacts/orw1-hosted-candidate
          sha256sum KCULTURE_V47_ORW1_ONESHOT_V1.tar.gz PACKAGE_RECEIPT.json PACKAGE_PARITY.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orw1-hosted-candidate-v1
          path: artifacts/orw1-hosted-candidate/
          retention-days: 30
          if-no-files-found: error
