name: kexp050-package-prep-parity

on:
  push:
    paths:
      - .github/workflows/kexp050-package-prep-parity.yml
  workflow_dispatch:

jobs:
  build-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch hash-pinned COK V8 base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen source and builder identities
        run: |
          test "$(git rev-parse HEAD:candidates/r4d_reallocate_614_carrot.py)" = "61b77be136836328917441cb03f89bc6665c4c27"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:tools/build_kexp050_submission.py)" = "2a83d060231f725094dc461081c9c809d6e2223a"
      - name: Build preparation-only self-contained package
        run: python tools/build_kexp050_submission.py
      - name: Extract package
        run: |
          mkdir -p artifacts/kexp050-package-extract
          tar -xzf artifacts/submissions/kexp050_reallocate614_v1.tar.gz -C artifacts/kexp050-package-extract
      - name: Compare frozen source and packaged main trajectories
        run: >-
          python tools/compare_agent_prefix.py
          --agent-a file:candidates/r4d_reallocate_614_carrot.py:agent
          --agent-b file:artifacts/kexp050-package-extract/main.py:agent
          --seed-partition development
          --limit-seeds 4
          --output artifacts/kexp050-package-parity.json
      - name: Enforce exact action and terminal parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/kexp050-package-parity.json').read_text())
          s=p['summary']
          if s['identical_full_trajectory_actions'] != s['comparisons']:
              raise SystemExit(f"action parity failed: {s}")
          for row in p['rows']:
              if row['agent_a_terminal'] != row['agent_b_terminal']:
                  raise SystemExit(f"terminal parity failed: {row}")
          print('KEXP050_PACKAGE_PREP_PARITY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kexp050-package-prep
          path: |
            artifacts/submissions/kexp050_reallocate614_v1.tar.gz
            artifacts/submissions/kexp050_reallocate614_v1/BUILD_MANIFEST.json
            artifacts/kexp050-package-parity.json
