name: all3-v13c-resolve-rank14-version
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v13c-resolve-rank14-version.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Resolve frozen rank-14 SHA to immutable Kaggle version
        run: |
          python - <<'PY'
          import json, tempfile, time, sys
          from pathlib import Path
          sys.path.insert(0,'.')
          from tools.programme_adaptive_expert_gate import acquire_public_main, sha256_bytes

          ref='tetsutani/demand-preserving-turn-sale-timing'
          expected='1aa3717b3201997a95920c80cf5612c23f78f8716c7b1084b6a345ca4eae7e4f'
          rows=[]
          found=None
          with tempfile.TemporaryDirectory(prefix='v13c-r14-version-') as td:
              root=Path(td)
              for v in range(1,41):
                  handle=f'{ref}/versions/{v}'
                  try:
                      main,receipt=acquire_public_main(handle,root/f'v{v}')
                      h=sha256_bytes(main.read_bytes())
                      row={'version':v,'handle':handle,'sha256':h,'status':'OK','receipt':receipt}
                      rows.append(row)
                      print('V13C_R14_TRY',json.dumps({'version':v,'sha256':h},sort_keys=True),flush=True)
                      if h==expected:
                          found=row
                          break
                  except Exception as exc:
                      msg=f'{type(exc).__name__}: {exc}'
                      rows.append({'version':v,'handle':handle,'status':'ERROR','error':msg})
                      print('V13C_R14_TRY',json.dumps({'version':v,'status':'ERROR','error':msg[:300]},sort_keys=True),flush=True)
                  time.sleep(0.75)
          result={'schema':'kculture-v13c-rank14-version-resolution-v1','ref':ref,'expected_sha256':expected,
                  'found':found,'attempts':rows,'mechanical_pass':found is not None,
                  'strategic_gate_changed':False,'source_population_changed':False,
                  'third_party_code_executed':False}
          Path('rank14-version-resolution.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('V13C_R14_RESULT',json.dumps({'mechanical_pass':found is not None,'found':found},sort_keys=True),flush=True)
          if found is None: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v13c-rank14-version-resolution
          path: rank14-version-resolution.json
          retention-days: 30
          if-no-files-found: warn
