name: o-lq3-stage-a-hard-replay
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/o-lq3-stage-a-hard-replay.yml'
      - 'tools/first_party_lq3_priority_sell_order.py'
      - 'tools/o_lq3_stage_a_hard_replay.py'
      - 'configs/all3_v6_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/first_party_lq3_priority_sell_order.py
          python -m py_compile tools/o_lq3_stage_a_hard_replay.py
      - name: Run Stage A
        run: |
          mkdir -p artifacts/o-lq3-stage-a
          python tools/o_lq3_stage_a_hard_replay.py \
            --config configs/all3_v6_hard_contexts.json \
            --out artifacts/o-lq3-stage-a/O_LQ3_STAGE_A.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o-lq3-stage-a-hard-replay
          path: artifacts/o-lq3-stage-a/*.json
          retention-days: 30
          if-no-files-found: warn
