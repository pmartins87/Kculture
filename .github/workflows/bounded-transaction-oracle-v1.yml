name: bounded-transaction-oracle-v1
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/bounded-transaction-oracle-v1.yml'
      - 'tools/bounded_transaction_oracle_v1.py'
      - 'docs/strategy/BOUNDED_TRANSACTION_ORACLE_GATE_V1_2026-09-18.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax check
        run: python -m py_compile tools/bounded_transaction_oracle_v1.py
      - name: Run oracle headroom gate
        run: |
          mkdir -p artifacts/bounded-transaction-oracle-v1
          python tools/bounded_transaction_oracle_v1.py \
            --out artifacts/bounded-transaction-oracle-v1/BOUNDED_TRANSACTION_ORACLE_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-transaction-oracle-v1
          path: artifacts/bounded-transaction-oracle-v1/*.json
          retention-days: 30
          if-no-files-found: warn
