name: v47-v48-divergence-census-v1
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/v47-v48-divergence-census-v1.yml'
      - 'tools/v47_v48_divergence_census_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/v47_v48_divergence_census_v1.py
      - name: Run fresh V47 V48 divergence census
        run: |
          mkdir -p artifacts/v47-v48-divergence-census-v1
          python tools/v47_v48_divergence_census_v1.py \
            --out artifacts/v47-v48-divergence-census-v1/V47_V48_DIVERGENCE_CENSUS_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v47-v48-divergence-census-v1
          path: artifacts/v47-v48-divergence-census-v1/*.json
          retention-days: 30
          if-no-files-found: warn
