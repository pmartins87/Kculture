name: v44-counterfactual-meta-tree
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v44-counterfactual-meta-tree.yml']
permissions:
  contents: read
  actions: read
jobs:
  features:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U 'kaggle-environments==1.32.7'
      - uses: actions/download-artifact@v4
        with:
          name: v30b-binding-package
          path: v30b
          run-id: 35906418993
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v41-slim-current-corpus
          path: corpus
          run-id: 36737975801
          github-token: ${{ github.token }}
      - name: Extract true V30B counterfactual features
        run: |
          mkdir -p out
          python tools/v44_counterfactual_features.py             --corpus-root corpus             --base-package v30b/V30B_CANDIDATE.tar.gz             --shard ${{ matrix.shard }} --num-shards 6             --output out/features-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v44-features-${{ matrix.shard }}
          path: out/*.json
          retention-days: 3
  train:
    needs: features
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U scikit-learn numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: v42-shard-*
          path: arms
          merge-multiple: true
          run-id: 36738813734
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: v44-features-*
          path: features
          merge-multiple: true
      - name: Train on counterfactual features and untouched temporal holdout
        run: |
          python tools/v44_train_cf_tree.py             --arms-dir arms             --features-dir features             --holdout-per-label 5             --output V44_MODEL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v44-model
          path: V44_MODEL.json
          retention-days: 3
          if-no-files-found: warn
