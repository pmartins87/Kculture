name: Prize Solver state clone probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - 'solver/**'
      - 'tools/prize_solver_clone_probe.py'
      - '.github/workflows/prize-solver-clone-probe.yml'

jobs:
  clone-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe exact mid-game clone
        run: python tools/prize_solver_clone_probe.py
      - name: Upload clone receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prize-solver-clone-probe
          path: PRIZE_SOLVER_CLONE_PROBE.json
          if-no-files-found: warn
