name: v37d2-v30b-deep-telemetry
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v37d2-v30b-deep-telemetry.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install runtime
        run: python -m pip install -U 'kaggle-environments==1.32.7'
      - name: Download V30B
        uses: actions/download-artifact@v4
        with:
          name: v30b-binding-package
          path: v30b
          run-id: 35906418993
          github-token: ${{ github.token }}
      - name: Download Ahmed
        uses: actions/download-artifact@v4
        with:
          name: v36a-final-week-aggressive-candidate-preflight
          path: v36
          run-id: 36286643137
          github-token: ${{ github.token }}
      - name: Deep telemetry
        shell: bash
        run: |
          python - <<'PY'
          import json,tarfile,tempfile
          from pathlib import Path
          from kaggle_environments import make
          from kaggle_environments.agent import get_last_callable
          def load(pkg,root):
            with tarfile.open(pkg,"r:*") as tf:tf.extractall(root)
            p=Path(root)/"main.py";return get_last_callable(p.read_text(),path=str(p.resolve()))
          with tempfile.TemporaryDirectory() as a,tempfile.TemporaryDirectory() as b:
            A=load(Path("v30b/V30B_CANDIDATE.tar.gz"),a);B=load(Path("v36/AHMED_V45_ORIGINAL.tar.gz"),b)
            env=make("kaggriculture",configuration={"episodeSteps":720,"seed":81502},debug=False)
            env.run([A,B]);rep=env.toJSON()
            g=A.__globals__;raw={}
            for k,v in sorted(g.items()):
              if (k.endswith("_REPORT") or k.endswith("_STATS")) and isinstance(v,dict):
                nz={kk:vv for kk,vv in v.items() if vv not in (0,0.0,False,None,"",[],{})}
                if nz:raw[k]=nz
            Path("V30B_DEEP_TELEMETRY.json").write_text(json.dumps(raw,indent=2,sort_keys=True,default=str)+"\n")
            print("REWARDS",rep.get("rewards"))
            print("V30B_DEEP",json.dumps(raw,sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v37d2-v30b-deep-telemetry
          path: V30B_DEEP_TELEMETRY.json
          retention-days: 7
