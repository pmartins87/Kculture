name: kexp029-late-crop-decision-surface

on:
  push:
    paths:
      - .github/workflows/kexp029-late-crop-decision-surface.yml
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install kagglehub
      - name: Verify frozen diagnostic
        run: test "$(git rev-parse HEAD:tools/late_crop_decision_surface.py)" = "295e8100fb8e5fed385bc420f8733b15e57d82c6"
      - name: Mine late crop decision surface
        run: python tools/late_crop_decision_surface.py --top 20 --output artifacts/kexp029/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp029-late-crop-decision-surface
          path: artifacts/kexp029/**
