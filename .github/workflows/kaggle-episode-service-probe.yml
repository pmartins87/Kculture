name: kaggle-episode-service-probe
on:
  push:
    paths:
      - 'tools/probe_kaggle_episode_service.py'
      - '.github/workflows/kaggle-episode-service-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tiny client dependency
        run: python -m pip install requests
      - name: Probe official EpisodeService surface
        run: python tools/probe_kaggle_episode_service.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-episode-service-probe
          path: artifacts/episode-service-probe/**
