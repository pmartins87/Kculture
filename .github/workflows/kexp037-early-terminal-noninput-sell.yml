name: kexp037-early-terminal-noninput-sell

on:
  push:
    paths:
      - .github/workflows/kexp037-early-terminal-noninput-sell.yml
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify candidate identity
        run: |
          test "$(git rev-parse HEAD:candidates/r4d_early_terminal_noninput_sell.py)" = "222e9c1de9bab043780af4a1f10bf8cd2f0c210f"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Fetch Kaito V27
        run: python tools/fetch_public_kaggle_notebook.py --handle kaitofukami/25-27-strict-future-v27-midgame-meta-reset/versions/4 --filename main.py --sha256 f48c21166eac68d1b05a401f04f94a2eb6154e65415af64893672365ff33c7b8 --output-dir artifacts/kexp037/kaito/opponent --receipt artifacts/kexp037/kaito/receipt.json
      - name: Screen Kaito V27
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_early_terminal_noninput_sell.py:agent --opponent file:artifacts/kexp037/kaito/opponent/main.py:agent --partition development --output artifacts/kexp037/kaito/report.json
      - name: Fetch Rayk V11
        run: python tools/fetch_public_kaggle_notebook.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/11 --filename main.py --sha256 adc61ab15b3b4016e49efe525f4906e6ae3bbb66c4ff29ab795ae09df9fbaa5f --output-dir artifacts/kexp037/rayk/opponent --receipt artifacts/kexp037/rayk/receipt.json
      - name: Screen Rayk V11
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_early_terminal_noninput_sell.py:agent --opponent file:artifacts/kexp037/rayk/opponent/main.py:agent --partition development --output artifacts/kexp037/rayk/report.json
      - name: Fetch Andrew V12
        run: python tools/fetch_public_kaggle_notebook.py --handle andrewsokolovsky/kaggriculture-breaking-the-tie/versions/12 --filename main.py --sha256 df4e899ad535754cf2ddbd3c16e48085916b0cd2baa5182a1a2cfc6a856abae5 --output-dir artifacts/kexp037/andrew/opponent --receipt artifacts/kexp037/andrew/receipt.json
      - name: Screen Andrew V12
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_early_terminal_noninput_sell.py:agent --opponent file:artifacts/kexp037/andrew/opponent/main.py:agent --partition development --output artifacts/kexp037/andrew/report.json
      - name: Direct screen vs R4B
        run: python tools/run_late_lifecycle_panel.py --candidate file:candidates/r4d_early_terminal_noninput_sell.py:agent --opponent file:candidates/r4b_ablation_market_only.py:agent --partition development --output artifacts/kexp037/direct-r4b/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp037-early-terminal-noninput-sell
          path: artifacts/kexp037/**
