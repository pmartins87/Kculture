name: FP001 H11 fertilizer conversion audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-principles-economy-v1
    paths:
      - 'tools/fp001_h11_fertilizer_conversion_audit.py'
      - '.github/workflows/fp001-h11-fertilizer-conversion.yml'
      - 'requirements.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Kaggriculture environment
        run: pip install -r requirements.txt
      - name: Run H11 exact fertilizer conversion audit
        run: python tools/fp001_h11_fertilizer_conversion_audit.py
