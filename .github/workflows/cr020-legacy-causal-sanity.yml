name: cr020-legacy-causal-sanity
on:
  push:
    paths:
      - '.github/workflows/cr020-legacy-causal-sanity.yml'
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Verify frozen candidate and diagnostic identities
        run: |
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:candidates/cr015_liquidation_phase_early_order.py)" = "fabd4bc398e7eadcfd1d44add4d0e593315140e8"
          test "$(git rev-parse HEAD:candidates/cr020_monotone_append_latch.py)" = "2a58a7e77fbb5e49beb5ebb783dd5afdf592aac0"
          test "$(git rev-parse HEAD:configs/cr014b_affected_pairs_v1.json)" = "59b3c9a3e1541dd25418bc2034762cba95be7909"
          test "$(git rev-parse HEAD:tools/cr015_preregistered_evaluation.py)" = "be7cdec1aede3d774f3a963f1cd6b087ca497709"
          test "$(git rev-parse HEAD:tools/cr020_legacy_causal_sanity.py)" = "2ad17a00ddef7b1f80b180f20e875fffb7d82d2a"
      - name: Fetch frozen public dependencies
        run: python tools/fetch_public_opponents.py
      - name: Fetch exact diagnostic opponents
        run: |
          mkdir -p artifacts/cr020_sanity/opponents
          python tools/fetch_exact_package_main.py --handle 'boatlee/v21-r1-public-state-route-portfolio/versions/2' --output artifacts/cr020_sanity/opponents/boatlee.py --receipt artifacts/cr020_sanity/opponents/boatlee.json
          python tools/fetch_exact_package_main.py --handle 'andrewsokolovsky/kaggriculture/versions/11' --output artifacts/cr020_sanity/opponents/andrew.py --receipt artifacts/cr020_sanity/opponents/andrew.json
          python tools/fetch_exact_package_main.py --handle 'raykkretzschmar/kaggriculture-rank-your-agent/versions/23' --output artifacts/cr020_sanity/opponents/rayk.py --receipt artifacts/cr020_sanity/opponents/rayk.json
          python tools/fetch_exact_package_main.py --handle 'tetsutani/read-the-town-build-the-farm-kaggriculture/versions/2' --output artifacts/cr020_sanity/opponents/tetsu.py --receipt artifacts/cr020_sanity/opponents/tetsu.json
      - name: Verify opponent identities
        run: |
          python - <<'PY'
          import json
          expected={
            'boatlee':('d65410a4fc8a31226055e43085131468ac8af5721aabdf3593cb8eade59cabe3','c6f96a8521dc9aa369b6f27e5b36b9d481e5c1688f50c8ca215c3bb53f1f9eb8'),
            'andrew':('cdcac082442f8c70d8caa6f6979a3c699c73810622eca32806c80a924987d3dc','0827987dab3f52e1f50661c355b42f289b8e305d90a263b16f3054aaecfe943c'),
            'rayk':('86b7ae5c029e351adfbd80059cd185b39d1467303437e6441ff7ad871cd8e7ee','6c709f6d3ce6cf221a9495de7e716fcd1b660e3bbc8ee5679b63233d0265a812'),
            'tetsu':('00c423f03e091c4bc64417fe66bcf44dbe5d1a8b5d5eff5fadc6bc362b318ec9','73834889054bb6a515fbb40a306a7e0e609105049c781e32197a205f6c339c4f'),
          }
          for name,(archive,main) in expected.items():
            r=json.load(open(f'artifacts/cr020_sanity/opponents/{name}.json'))
            assert r['archive_sha256']==archive,(name,r['archive_sha256'])
            assert r['main_sha256']==main,(name,r['main_sha256'])
          print('opponent identity PASS')
          PY
      - name: Run legacy causal sanity
        run: |
          python tools/cr020_legacy_causal_sanity.py \
            --opponent-dir artifacts/cr020_sanity/opponents \
            --output artifacts/cr020_sanity/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr020-legacy-causal-sanity
          path: artifacts/cr020_sanity/**
