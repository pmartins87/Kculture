name: all3-physical-proposal-oracle-v5
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-physical-proposal-oracle-v5.yml'
      - 'tools/all3_physical_proposal_oracle_v5_shard.py'
      - 'tools/aggregate_all3_physical_proposal_oracle_v5.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        opponent: [v47_mirror,v48,router_2715,tactical_memory]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_physical_proposal_oracle_v5_shard.py
          python -m py_compile tools/aggregate_all3_physical_proposal_oracle_v5.py
      - name: Run V5 physical proposal shard
        run: |
          mkdir -p artifacts/v5-physical
          python tools/all3_physical_proposal_oracle_v5_shard.py \
            --opponent ${{ matrix.opponent }} \
            --out artifacts/v5-physical/V5_${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-physical-${{ matrix.opponent }}
          path: artifacts/v5-physical/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v5-physical-*
          path: artifacts/v5-physical-shards
          merge-multiple: false
      - name: Aggregate V5 physical oracle
        run: |
          mkdir -p artifacts/v5-physical-aggregate
          python tools/aggregate_all3_physical_proposal_oracle_v5.py \
            --input-dir artifacts/v5-physical-shards \
            --out artifacts/v5-physical-aggregate/ALL3_PHYSICAL_PROPOSAL_V5.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-physical-proposal-oracle-v5
          path: artifacts/v5-physical-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
