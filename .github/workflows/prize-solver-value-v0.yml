name: Prize Solver V0 value learning

on:
  workflow_dispatch:
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - 'solver/**'
      - 'tools/prize_solver_value_train_v0.py'
      - '.github/workflows/prize-solver-value-v0.yml'

jobs:
  value:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train and validate V0 value function
        run: python tools/prize_solver_value_train_v0.py
      - name: Upload value receipt/model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prize-solver-value-v0
          path: PRIZE_SOLVER_VALUE_V0.json
          if-no-files-found: warn
