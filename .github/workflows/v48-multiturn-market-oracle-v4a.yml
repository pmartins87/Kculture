name: v48-multiturn-market-oracle-v4a
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/v48-multiturn-market-oracle-v4a.yml'
      - 'tools/v48_multiturn_market_oracle_v4a.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/v48_multiturn_market_oracle_v4a.py
      - name: Run targeted V48 multi-turn market oracle
        run: |
          mkdir -p artifacts/v48-multiturn-market-v4a
          python tools/v48_multiturn_market_oracle_v4a.py \
            --out artifacts/v48-multiturn-market-v4a/V48_MULTITURN_MARKET_V4A.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v48-multiturn-market-v4a
          path: artifacts/v48-multiturn-market-v4a/*.json
          retention-days: 30
          if-no-files-found: warn
