name: all3-v13c-mechanical-completion
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v13c-mechanical-completion.yml'
      - 'tools/aggregate_all3_v13c_mechanical_completion.py'
      - 'configs/all3_v13c_rank14_supplement.json'
      - 'configs/all3_v13c_current_frontier_representatives.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Download original V13C artifact
        uses: actions/download-artifact@v4
        with:
          name: all3-v13c-current-frontier-hard-context
          path: artifacts/original
          run-id: 35520875702
          github-token: ${{ github.token }}
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v13c_current_frontier_hard_context.py
          python -m py_compile tools/aggregate_all3_v13c_mechanical_completion.py
      - name: Run exact rank-14 supplement
        run: |
          mkdir -p artifacts/supplement
          python tools/all3_v13c_current_frontier_hard_context.py             --config configs/all3_v13c_rank14_supplement.json             --out artifacts/supplement/V13C_RANK14_SUPPLEMENT.json
      - name: Mechanically complete V13C
        run: |
          mkdir -p artifacts/composite
          python tools/aggregate_all3_v13c_mechanical_completion.py             --original artifacts/original/ALL3_V13C_CURRENT_FRONTIER_HARD_CONTEXT.json             --supplement artifacts/supplement/V13C_RANK14_SUPPLEMENT.json             --full-config configs/all3_v13c_current_frontier_representatives.json             --out artifacts/composite/ALL3_V13C_MECHANICALLY_COMPLETE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v13c-mechanical-completion
          path: |
            artifacts/supplement/*.json
            artifacts/composite/*.json
          retention-days: 30
          if-no-files-found: warn
