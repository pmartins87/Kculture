name: FP001 H8 animal fertilizer audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-principles-economy-v1
    paths:
      - 'tools/fp001_h8_animal_fertilizer_economics.py'
      - '.github/workflows/fp001-h8-animal-fertilizer-audit.yml'
      - 'requirements.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Kaggriculture environment
        run: pip install -r requirements.txt
      - name: Run H8 exact economics audit
        run: python tools/fp001_h8_animal_fertilizer_economics.py
