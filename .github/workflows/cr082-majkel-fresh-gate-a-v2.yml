name: CR082 Majkel fresh Gate A v2 strict forward
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr082-majkel-fresh-gate-a-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: test -n "$KAGGLE_API_TOKEN"
      - run: python -m pip install -U 'kaggle>=2.2.3' numpy
      - uses: actions/download-artifact@v4
        with:
          name: cr081-majkel_current_56156662
          path: old
          run-id: 34669006417
          github-token: ${{ github.token }}
      - name: Collect current newest Majkel corpus
        run: |
          python tools/collect_submission_replays_cli_v2.py \
            --submission 'majkel_strict_forward_56156662:56156662' \
            --output-dir fresh \
            --max-per-submission 128 \
            --selection newest \
            --retries 6 \
            --delay-seconds 0.5
      - name: Apply strict-forward frozen Gate A
        run: |
          python tools/cr082_fresh_gate_a_v2.py \
            --old-root old \
            --fresh-root fresh \
            --team 'Majkel1337' \
            --output result/gate_a.json
      - name: Freeze provenance
        if: always()
        run: |
          find fresh -type f -print | sort > result/FRESH_FILELIST.txt || true
          find fresh -type f -print0 | sort -z | xargs -0 -r sha256sum > result/FRESH_SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr082-majkel-fresh-gate-a-v2-strict-forward
          path: result/**
          retention-days: 30
          if-no-files-found: error
