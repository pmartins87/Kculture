name: all3-v19b-consensus-causal
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v19b-consensus-causal.yml'
      - 'tools/first_party_tm1_p2_consensus_schedule.py'
      - 'tools/all3_v19b_consensus_causal.py'
      - 'docs/strategy/ALL3_V19A_P2_CONSENSUS_SCHEDULE_PROTOCOL_2026-09-20.md'
      - 'configs/all3_v14a_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Download binding V19A schedule
        uses: actions/download-artifact@v4
        with:
          name: all3-v19a-p2-consensus-schedule
          path: artifacts/v19a-binding
          run-id: 35552885627
          github-token: ${{ github.token }}
      - name: Syntax
        run: |
          python -m py_compile tools/first_party_tm1_p2_consensus_schedule.py
          python -m py_compile tools/all3_v19b_consensus_causal.py
      - name: Run V19B causal gate
        run: |
          mkdir -p artifacts/v19b
          python tools/all3_v19b_consensus_causal.py             --hard-config configs/all3_v14a_hard_contexts.json             --schedule artifacts/v19a-binding/ALL3_V19A_P2_CONSENSUS_SCHEDULE.json             --out artifacts/v19b/ALL3_V19B_CONSENSUS_CAUSAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v19b-consensus-causal
          path: artifacts/v19b/*.json
          retention-days: 30
          if-no-files-found: warn
