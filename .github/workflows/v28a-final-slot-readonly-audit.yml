name: v28a-final-slot-readonly-audit

'on':
  push:
    branches: [research/prize-solver-v0]
    paths:
      - '.github/workflows/v28a-final-slot-readonly-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2.3'
      - name: Run read-only final-slot audit
        run: |
          mkdir -p artifacts/v28a
          python tools/kaggle_meta_scout_cli.py \
            --competition kaggriculture \
            --output-dir artifacts/v28a \
            --top-teams 10 \
            --submissions-per-team 0 \
            --replays-per-submission 0 \
            --delay 0.2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28a-final-slot-readonly-audit
          path: artifacts/v28a/**
          retention-days: 30
          if-no-files-found: error
