name: all3-v10a-residual-cumulative-market
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v10a-residual-cumulative-market.yml'
      - 'tools/all3_v10a_residual_cumulative_market.py'
      - 'tools/aggregate_all3_v10a_residual_cumulative_market.py'
      - 'configs/all3_v6_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v10a_residual_cumulative_market.py
          python -m py_compile tools/aggregate_all3_v10a_residual_cumulative_market.py
      - name: Run V10A context
        run: |
          mkdir -p artifacts/v10a
          python tools/all3_v10a_residual_cumulative_market.py             --contexts configs/all3_v6_hard_contexts.json             --index ${{ matrix.index }}             --out artifacts/v10a/V10A_CONTEXT_${{ matrix.index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10a-context-${{ matrix.index }}
          path: artifacts/v10a/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: context
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v10a-context-*
          path: artifacts/v10a-contexts
          merge-multiple: false
      - name: Aggregate V10A
        run: |
          mkdir -p artifacts/v10a-aggregate
          python tools/aggregate_all3_v10a_residual_cumulative_market.py             --input-dir artifacts/v10a-contexts             --out artifacts/v10a-aggregate/ALL3_V10A_RESIDUAL_CUMULATIVE_MARKET.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v10a-residual-cumulative-market
          path: artifacts/v10a-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
