name: cq1-queue-clamp-parity-audit
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/cq1-queue-clamp-parity-audit.yml'
      - 'tools/cq1_queue_clamp_parity_audit.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/cq1_queue_clamp_parity_audit.py
      - name: Run O-CQ1 parity audit
        run: |
          mkdir -p artifacts/cq1-parity-audit
          python tools/cq1_queue_clamp_parity_audit.py \
            --out artifacts/cq1-parity-audit/CQ1_PARITY_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cq1-parity-audit
          path: artifacts/cq1-parity-audit/*.json
          retention-days: 30
          if-no-files-found: warn
