name: all3-v19c-consensus-fresh-validation
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - 'activate/v19c_consensus'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Download binding V19A schedule
        uses: actions/download-artifact@v4
        with:
          name: all3-v19a-p2-consensus-schedule
          path: artifacts/v19a-binding
          run-id: 35552885627
          github-token: ${{ github.token }}
      - name: Syntax
        run: |
          python -m py_compile tools/first_party_tm1_p2_consensus_schedule.py
          python -m py_compile tools/all3_v19c_consensus_fresh_validation.py
      - name: Run V19C fresh validation
        run: |
          mkdir -p artifacts/v19c
          python tools/all3_v19c_consensus_fresh_validation.py             --config configs/all3_v19c_consensus_fresh_validation.json             --schedule artifacts/v19a-binding/ALL3_V19A_P2_CONSENSUS_SCHEDULE.json             --out artifacts/v19c/ALL3_V19C_CONSENSUS_FRESH_VALIDATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v19c-consensus-fresh-validation
          path: artifacts/v19c/*.json
          retention-days: 30
          if-no-files-found: warn
