name: v28l-physical-causal-temporal-localization
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v28l-physical-causal-temporal-localization.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix: {shard_index: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U pip && python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' numpy
      - uses: actions/download-artifact@v4
        with:
          name: v28f-immutable-snapshot
          path: artifacts/v28f-snapshot
          run-id: 35807910104
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v28f-all3-hedge-complementarity
          path: artifacts/v28f
          run-id: 35807910104
          github-token: ${{ github.token }}
      - name: Run frozen V28L shard
        run: |
          set -euo pipefail
          for k in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY; do unset "$k" || true; done
          python tools/v28l_physical_temporal_localization_shard.py --snapshot-dir artifacts/v28f-snapshot --v28f artifacts/v28f/V28F_ALL3_HEDGE_COMPLEMENTARITY.json --shard-index ${{ matrix.shard_index }} --num-shards 4 --out artifacts/v28l/V28L_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28l-shard-${{ matrix.shard_index }}
          path: artifacts/v28l/*.json
          retention-days: 30
  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/download-artifact@v4
        with:
          pattern: v28l-shard-*
          path: artifacts/v28l-shards
      - run: python tools/aggregate_v28l_physical_temporal_localization.py --input-dir artifacts/v28l-shards --out artifacts/v28l-final/V28L_PHYSICAL_TEMPORAL_LOCALIZATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28l-physical-temporal-localization
          path: artifacts/v28l-final/*.json
          retention-days: 30
