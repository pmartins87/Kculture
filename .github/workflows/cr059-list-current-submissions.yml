name: cr059-list-current-submissions
on:
  push:
    paths:
      - '.github/workflows/cr059-list-current-submissions.yml'
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install kaggle
      - name: List Kaggriculture submissions
        run: |
          kaggle competitions submissions -c kaggriculture
