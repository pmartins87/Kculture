name: cr034-public-regime-fingerprint
on:
  push:
    paths:
      - '.github/workflows/cr034-public-regime-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact environment
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -r requirements.txt kagglehub 'kaggle>=2.2.3'
      - name: Syntax check
        run: python -m py_compile tools/cr034_public_regime_fingerprint.py
      - name: Run public-only regime fingerprint study
        run: python tools/cr034_public_regime_fingerprint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr034-public-regime-fingerprint
          path: |
            artifacts/cr034_public_regime_fingerprint/report.json
            artifacts/cr034_public_regime_fingerprint/summary.json
          if-no-files-found: warn
          retention-days: 30
