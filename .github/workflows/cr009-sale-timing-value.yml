name: cr009-sale-timing-value

on:
  push:
    paths:
      - '.github/workflows/cr009-sale-timing-value.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub scikit-learn
      - name: Verify frozen diagnostic
        run: |
          test "$(git rev-parse HEAD:tools/cr009_trigger_timing_value_audit.py)" = "af6a6195be14a0d19d524f3e9c161f7148da79d5"
      - name: Run strict out-of-time timing audit
        run: |
          mkdir -p artifacts/cr009
          python tools/cr009_trigger_timing_value_audit.py --top 20 --output artifacts/cr009/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr009-sale-timing-value
          path: artifacts/cr009/**
