name: cr028-current-engine-frontier
on:
  push:
    paths:
      - '.github/workflows/cr028-current-engine-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data dependencies
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install kagglehub pandas
      - name: Characterize current-engine rating frontier
        run: python tools/cr028_current_engine_frontier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr028-current-engine-frontier
          path: artifacts/cr028_frontier/report.json
          if-no-files-found: error
          retention-days: 30
