name: CR080 authenticated Kaggle checkpoint
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr080-api-checkpoint-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Freeze API metadata and rules
        run: |
          test -n "$KAGGLE_API_TOKEN"
          mkdir -p artifacts/checkpoint
          python tools/kaggle_meta_scout_cli.py --output-dir artifacts/checkpoint --top-teams 0 --replays-per-submission 0
          kaggle competitions episodes 56124705 --format json --quiet > artifacts/checkpoint/cr071m_episodes.json
          kaggle competitions submission-limits kaggriculture --json > artifacts/checkpoint/submission_limits.json
          python - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          root=Path('artifacts/checkpoint')
          commands=[['kaggle','competitions','pages','list','--help'], ['kaggle','competitions','pages','list','kaggriculture','--content']]
          rows=[]
          for cmd in commands:
              r=subprocess.run(cmd,capture_output=True,text=True)
              rows.append({'command':cmd,'returncode':r.returncode,'stdout':r.stdout,'stderr':r.stderr})
          (root/'pages_commands.json').write_text(json.dumps(rows,indent=2))
          print('pages read return codes:',[r['returncode'] for r in rows])
          PYCODE
      - name: Collect latest 32 incumbent replays
        run: |
          python tools/collect_submission_replays_cli_v2.py --submission cr071m:56124705 --output-dir artifacts/recent --max-per-submission 32 --selection newest --retries 6 --delay-seconds 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr080-api-checkpoint-v1
          path: artifacts/
          retention-days: 30
