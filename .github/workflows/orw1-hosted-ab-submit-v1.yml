name: v28c-exact-v47-final-hedge-submit
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/orw1-hosted-ab-submit-v1.yml'

permissions:
  contents: read

jobs:
  submit-v47:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: kaggriculture
      MAX_DAILY: '5'
      ALL3_ID: '56367770'
      ORW1_ID: '56336027'
      V47_DESCRIPTION: PS_V28C_FINAL_HEDGE_EXACT_V47_08E56C43
      V47_EXPECTED_SHA256: 08e56c43ecf28253605b61066dd769334d96262056b8cd337489f1f4f909ad01
      V47_MAIN_EXPECTED_SHA256: f4ecd4876fde93a14e3381993283f3b6a1afa023b48dd57217f4d90794d39842
      V47_EXPECTED_ENTRYPOINT: _y_agent_shopherd

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install authenticated Kaggle runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -U 'kaggle>=2.2.3' 'kagglehub>=0.3.12' 'kaggle-environments==1.32.7'
          kaggle competitions list --group entered -v | tee entered.csv
          grep -qi "$COMPETITION" entered.csv

      - name: Strict current-pair and quota preflight
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submissions "$COMPETITION" -v -q | tee before_submissions.csv
          python - <<'PY'
          import csv, io, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          text=Path("before_submissions.csv").read_text(encoding="utf-8",errors="replace")
          lines=[x for x in text.splitlines() if x.strip()]
          rows=[]
          for i,line in enumerate(lines):
              if "," not in line:
                  continue
              cand=list(csv.DictReader(io.StringIO("\n".join(lines[i:]))))
              if cand and any(k and "ref" in k.lower() for k in cand[0]):
                  rows=cand
                  break
          if not rows:
              raise SystemExit("could not parse Kaggle submissions CSV")

          def get(row, needle):
              return next((str(v) for k,v in row.items() if k and needle in k.lower()),"")
          rows=sorted(rows,key=lambda r:get(r,"date"),reverse=True)
          latest=[get(r,"ref") for r in rows[:2]]
          expected=[os.environ["ALL3_ID"],os.environ["ORW1_ID"]]
          if latest != expected:
              raise SystemExit(f"latest-two drifted: observed={latest}, expected={expected}")

          descs={get(r,"description") for r in rows}
          wanted=os.environ["V47_DESCRIPTION"]
          if wanted in descs:
              raise SystemExit(f"duplicate V47 description already exists: {wanted}")

          today=datetime.now(timezone.utc).date().isoformat()
          today_rows=[r for r in rows if get(r,"date").startswith(today)]
          projected=len(today_rows)+1
          maximum=int(os.environ["MAX_DAILY"])
          if projected>maximum:
              raise SystemExit(f"daily cap would be exceeded: {projected}>{maximum}")

          out={"latest_two_before":latest,"today_utc":today,"observed_today":len(today_rows),
               "projected_today":projected,"maximum_daily":maximum}
          Path("preflight.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Recover exact historical V47 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen v47_public_output smoke
          python - <<'PY'
          import hashlib, shutil, tarfile
          from pathlib import Path
          import kagglehub

          expected_archive="08e56c43ecf28253605b61066dd769334d96262056b8cd337489f1f4f909ad01"
          expected_main="f4ecd4876fde93a14e3381993283f3b6a1afa023b48dd57217f4d90794d39842"
          handle="ahmedberatozer/kaggriculture-v47-reactive-market-coordination"

          out=Path("v47_public_output")
          kagglehub.notebook_output_download(handle,output_dir=str(out),force_download=True)
          hits=[]
          for p in sorted(out.rglob("*")):
              if not p.is_file() or not p.name.lower().endswith((".tar.gz",".tgz",".tar")):
                  continue
              ah=hashlib.sha256(p.read_bytes()).hexdigest()
              try:
                  with tarfile.open(p,"r:*") as tf:
                      files=sorted(m.name for m in tf.getmembers() if m.isfile())
                      if files != ["main.py"]:
                          continue
                      data=tf.extractfile("main.py").read()
              except Exception:
                  continue
              mh=hashlib.sha256(data).hexdigest()
              if ah==expected_archive and mh==expected_main:
                  hits.append(p)
          if len(hits)!=1:
              raise SystemExit(f"expected one exact V47 archive, got {len(hits)}: {hits}")
          shutil.copyfile(hits[0],"frozen/V47_EXACT.tar.gz")
          print({"source":str(hits[0]),"archive_sha256":expected_archive,"main_sha256":expected_main})
          PY

          test "$(sha256sum frozen/V47_EXACT.tar.gz | awk '{print $1}')" = "$V47_EXPECTED_SHA256"
          tar -xzf frozen/V47_EXACT.tar.gz -C smoke
          test "$(sha256sum smoke/main.py | awk '{print $1}')" = "$V47_MAIN_EXPECTED_SHA256"
          printf '%s  %s\n' "$V47_EXPECTED_SHA256" V47_EXACT.tar.gz | tee SHA256SUMS.txt

      - name: Official loader smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from kaggle_environments.agent import get_last_callable
          p=Path("smoke/main.py")
          fn=get_last_callable(p.read_text(encoding="utf-8"),path=str(p.resolve()))
          name=getattr(fn,"__name__",None)
          argc=getattr(getattr(fn,"__code__",None),"co_argcount",None)
          if name!=os.environ["V47_EXPECTED_ENTRYPOINT"]:
              raise SystemExit(f"loader selected {name!r}, expected {os.environ['V47_EXPECTED_ENTRYPOINT']!r}")
          if argc not in (1,2):
              raise SystemExit(f"unexpected argc={argc}")
          print({"entrypoint":name,"argc":argc})
          PY

      - name: Submit exact V47 once
        shell: bash
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' | tee submit_start_utc.txt
          kaggle competitions submit -c "$COMPETITION" -f frozen/V47_EXACT.tar.gz -m "$V47_DESCRIPTION"
          date -u +'%Y-%m-%dT%H:%M:%SZ' | tee submit_return_utc.txt

      - name: Verify registration and latest-two pair
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            kaggle competitions submissions "$COMPETITION" -v -q > after_submissions.csv
            if grep -Fq "$V47_DESCRIPTION" after_submissions.csv; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"

          python - <<'PY'
          import csv, io, json, os
          from pathlib import Path

          text=Path("after_submissions.csv").read_text(encoding="utf-8",errors="replace")
          lines=[x for x in text.splitlines() if x.strip()]
          rows=[]
          for i,line in enumerate(lines):
              if "," not in line:
                  continue
              cand=list(csv.DictReader(io.StringIO("\n".join(lines[i:]))))
              if cand and any(k and "ref" in k.lower() for k in cand[0]):
                  rows=cand
                  break
          if not rows:
              raise SystemExit("could not parse post-submit CSV")
          def get(row,needle):
              return next((str(v) for k,v in row.items() if k and needle in k.lower()),"")
          rows=sorted(rows,key=lambda r:get(r,"date"),reverse=True)
          target=next((r for r in rows if get(r,"description")==os.environ["V47_DESCRIPTION"]),None)
          if target is None:
              raise SystemExit("registered V47 row missing")
          new_id=get(target,"ref")
          latest=[get(r,"ref") for r in rows[:2]]
          expected=[new_id,os.environ["ALL3_ID"]]
          if latest!=expected:
              raise SystemExit(f"post-submit latest-two invalid: observed={latest}, expected={expected}")
          if os.environ["ORW1_ID"] in latest:
              raise SystemExit("ORW1 still appears in latest-two")
          out={
            "decision":"V28C_EXACT_V47_REGISTERED",
            "new_v47_submission_id":new_id,
            "new_v47_status":get(target,"status"),
            "new_v47_public_score":get(target,"publicscore"),
            "latest_two_after":latest,
            "preserved_all3_submission_id":os.environ["ALL3_ID"],
            "displaced_orw1_submission_id":os.environ["ORW1_ID"],
            "description":os.environ["V47_DESCRIPTION"]
          }
          Path("v28c_result.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28c-exact-v47-final-hedge-submit-provenance
          path: |
            entered.csv
            before_submissions.csv
            preflight.json
            SHA256SUMS.txt
            submit_start_utc.txt
            submit_return_utc.txt
            after_submissions.csv
            v28c_result.json
          retention-days: 30
          if-no-files-found: warn
