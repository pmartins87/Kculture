name: CR092 recovery-only aggregate

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-principles-economy-v1
    paths:
      - '.github/workflows/cr092-recover-aggregate.yml'

permissions:
  actions: read
  contents: read

jobs:
  recover-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/first-principles-economy-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download immutable CR092 edge artifacts from original run
        uses: actions/download-artifact@v4
        with:
          pattern: cr092-edge-*
          path: cr092_edges
          merge-multiple: true
          run-id: 35015135956
          github-token: ${{ github.token }}

      - name: Aggregate only — no episode rerun
        run: |
          set -euo pipefail
          python tools/cr092_aggregate.py \
            --input-dir cr092_edges \
            --result artifacts/CR092_RESULT.json \
            --labels artifacts/CR092_ROUTER_LABELS.json
          sha256sum artifacts/CR092_RESULT.json artifacts/CR092_ROUTER_LABELS.json | tee artifacts/SHA256SUMS.txt

      - name: Upload canonical recovered CR092 aggregate
        uses: actions/upload-artifact@v4
        with:
          name: cr092-recovered-canonical-aggregate-v1
          path: artifacts/**
          retention-days: 90
          if-no-files-found: error
