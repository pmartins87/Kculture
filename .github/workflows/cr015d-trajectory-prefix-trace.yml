name: cr015d-trajectory-prefix-trace
on:
  push:
    paths:
      - '.github/workflows/cr015d-trajectory-prefix-trace.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen R4B dependencies
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen diagnostic identities
        run: |
          test "$(git rev-parse HEAD:candidates/cr015_liquidation_phase_early_order.py)" = "fabd4bc398e7eadcfd1d44add4d0e593315140e8"
          test "$(git rev-parse HEAD:configs/cr014c_flip_pairs_v1.json)" = "ea1762fd292584f50d73d6251f065a6a590de827"
          test "$(git rev-parse HEAD:tools/cr015d_trajectory_prefix_trace.py)" = "2d21dbcd667d9affb05613d89bf6d6b14aa7fe61"
      - name: Fetch exact frozen flip opponents
        run: |
          mkdir -p artifacts/cr015d/opponents
          python tools/fetch_exact_package_main.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/23 --output artifacts/cr015d/opponents/rayk.py --receipt artifacts/cr015d/opponents/rayk.json
          python tools/fetch_exact_package_main.py --handle boatlee/v21-r1-public-state-route-portfolio/versions/2 --output artifacts/cr015d/opponents/boatlee.py --receipt artifacts/cr015d/opponents/boatlee.json
          python tools/fetch_exact_package_main.py --handle tetsutani/read-the-town-build-the-farm-kaggriculture/versions/2 --output artifacts/cr015d/opponents/tetsu.py --receipt artifacts/cr015d/opponents/tetsu.json
      - name: Trace CR-015 adaptive trajectory
        run: |
          python tools/cr015d_trajectory_prefix_trace.py \
            --opponent-dir artifacts/cr015d/opponents \
            --output artifacts/cr015d/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr015d-trajectory-prefix-trace
          path: artifacts/cr015d/**
