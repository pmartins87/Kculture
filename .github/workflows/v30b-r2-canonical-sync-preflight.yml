name: v30b-r2-canonical-sync-preflight
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v30b-r2-canonical-sync-preflight.yml']
permissions:
  contents: write
jobs:
  sync-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: kaggriculture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync canonical sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          block='''## Binding update — 2026-09-23 — V30B-R2 VALIDATED / USER DECISION GATE\n\n**This block supersedes lower current-action sections.**\n\nBinding original V30B protocol: `docs/strategy/V30B_PUBLIC_PERSISTENT_POLICY_VALIDATION_PROTOCOL_2026-09-23.md`. Binding workflow `35906418993` completed SUCCESS with mechanics PASS and exact package parity 8/8. Decision: **`V30B_PUBLIC_PERSISTENT_POLICY_VALIDATED_READY_FOR_USER_DECISION`**. Exact public candidate: `arsgorynich/herd-safe-v3-experimental-risk-aware-feed`; frozen main.py SHA `4f8637a3e33348b98f531de246d353f5d2955b2f85480e3fd02bf4a7874f0d01`; archive SHA `70d93426baa309e3a13a6c837504e4d73b177cd05d7d2865c024844e1d2abe7b`. Fresh 12-opponent frontier, seeds 80511..80516, both seats: candidate score rate 0.9097222222 vs ALL3 0.5833333333; paired score delta +0.3263888889; mean paired margin delta +6314.2013889; positive/neutral/negative contexts 54/90/0; source breadth 5; seed breadth 6/6; positive support both seats. Result: `docs/strategy/V30B_PUBLIC_PERSISTENT_POLICY_VALIDATION_RESULT_2026-09-23.md`. No Kaggle mutation authorized. Protected latest-two remains exact V47 `56466970` + ALL3 `56367770` pending read-only preflight and explicit user authorization.\n\n'''
          for fn in ['STATUS.md','ROADMAP.md','HANDOFF.md']:
              p=Path(fn); txt=p.read_text(); title,rest=txt.split('\n',1); p.write_text(title+'\n\n'+block+rest)
          p=Path('data/programme_teacher/2026-09-18/OPTION_LIBRARY_V0.json')
          d=json.loads(p.read_text())
          d['v30b_binding_original_protocol_2026_09_23']={
            'workflow':35906418993,'decision':'V30B_PUBLIC_PERSISTENT_POLICY_VALIDATED_READY_FOR_USER_DECISION','mechanical_pass':True,
            'candidate_ref':'arsgorynich/herd-safe-v3-experimental-risk-aware-feed','candidate_sha':'4f8637a3e33348b98f531de246d353f5d2955b2f85480e3fd02bf4a7874f0d01',
            'archive_sha256':'70d93426baa309e3a13a6c837504e4d73b177cd05d7d2865c024844e1d2abe7b','package_parity':'8/8',
            'candidate_score_rate':0.9097222222222222,'all3_score_rate':0.5833333333333334,'mean_paired_score_delta':0.3263888888888889,
            'mean_paired_margin_delta':6314.201388888889,'positive_contexts':54,'negative_contexts':0,'positive_source_breadth':5,'positive_seed_breadth':6,
            'positive_support_both_seats':True,'result_doc':'docs/strategy/V30B_PUBLIC_PERSISTENT_POLICY_VALIDATION_RESULT_2026-09-23.md',
            'routing':'READ_ONLY_PREFLIGHT_THEN_EXPLICIT_USER_AUTHORIZATION_REQUIRED','automatic_kaggle_submission':False}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md ROADMAP.md HANDOFF.md
          git add -f data/programme_teacher/2026-09-18/OPTION_LIBRARY_V0.json
          git commit -m 'Sync binding V30B-R2 validation result' || true
          git push origin HEAD:research/prize-solver-v0
      - name: Read-only Kaggle preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q -U 'kaggle>=2.2.3'
          date -u +'%Y-%m-%dT%H:%M:%SZ' > preflight_utc.txt
          kaggle competitions submissions "$COMPETITION" -v -q | tee submissions.csv
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('submissions.csv')))
          # Submission IDs are stable governance keys; capture their positions/statuses without mutation.
          ids=['56466970','56367770']
          found={i:None for i in ids}
          for idx,r in enumerate(rows):
              blob=' '.join(str(v) for v in r.values())
              for i in ids:
                  if i in blob and found[i] is None: found[i]={'row_index':idx,'row':r}
          out={'protected_ids':ids,'found':found,'latest_two_confirmed': all(found.values()) and found['56466970']['row_index']==0 and found['56367770']['row_index']==1,
               'listed_submission_count':len(rows),'read_only':True,'candidate_ref':'arsgorynich/herd-safe-v3-experimental-risk-aware-feed',
               'candidate_sha':'4f8637a3e33348b98f531de246d353f5d2955b2f85480e3fd02bf4a7874f0d01',
               'would_displace_from_latest_two':'56367770' if all(found.values()) and found['56466970']['row_index']==0 and found['56367770']['row_index']==1 else 'UNRESOLVED'}
          open('V30B_READ_ONLY_PREFLIGHT.json','w').write(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v30b-r2-read-only-preflight
          path: |
            preflight_utc.txt
            submissions.csv
            V30B_READ_ONLY_PREFLIGHT.json
          retention-days: 30
