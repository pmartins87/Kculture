name: cr024-consensus-tape-diff
on:
  push:
    paths:
      - '.github/workflows/cr024-consensus-tape-diff.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install minimal dependencies
        run: |
          python -m pip install -U 'kaggle>=2.2.3'
      - name: Verify frozen inputs
        run: |
          test -n "$KAGGLE_API_TOKEN"
          test "$(git rev-parse HEAD:configs/cr023_public_tape_preregistered_seeds_v1.json)" = "5325caa121881bfa8d118d890358cb766dfa1d64"
          test "$(git rev-parse HEAD:tools/cr024_consensus_tape_diff.py)" = "2bd2dbbb5c377ca88143ee48314cfa82a1d15f0f"
      - name: Compare frozen top11 and top19 public tapes
        run: python tools/cr024_consensus_tape_diff.py
      - uses: actions/upload-artifact@v4
        with:
          name: cr024-consensus-tape-diff
          path: artifacts/cr024_consensus_tape_diff/report.json
          if-no-files-found: error
