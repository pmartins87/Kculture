name: Prize Solver macro rollout v0

on:
  workflow_dispatch:
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - 'solver/**'
      - 'tools/prize_solver_macro_rollout_v0.py'
      - '.github/workflows/prize-solver-macro-rollout-v0.yml'

jobs:
  macro-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate exact macro counterfactual labels
        run: python tools/prize_solver_macro_rollout_v0.py
      - name: Upload macro rollout labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prize-solver-macro-rollout-v0
          path: PRIZE_SOLVER_MACRO_ROLLOUT_V0.json
          if-no-files-found: warn
