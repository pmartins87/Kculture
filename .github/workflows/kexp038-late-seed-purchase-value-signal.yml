name: kexp038-late-seed-purchase-value-signal

on:
  push:
    paths:
      - .github/workflows/kexp038-late-seed-purchase-value-signal.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen diagnostic and base
        run: |
          test "$(git rev-parse HEAD:tools/audit_late_seed_purchase_value_signal.py)" = "41419bf62924da4b2dc585641d0569c936243f8f"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Audit purchase-time route value signal
        run: python tools/audit_late_seed_purchase_value_signal.py --output artifacts/kexp038/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp038-late-seed-purchase-value-signal
          path: artifacts/kexp038/**
