        run: >-
          python tools/fetch_public_kaggle_notebook.py --handle andrewsokolovsky/kaggriculture-breaking-the-tie/versions/12 --filename main.py --sha256 df4e899ad535754cf2ddbd3c16e48085916b0cd2baa5182a1a2cfc6a856abae5 --output-dir artifacts/public_kaggle/andrew_v12 --receipt artifacts/current-meta/andrew_v12_r4a_receipt.json
      - run: >-
