name: r4-rayk-andrew-strong-screen

on:
  push:
    paths:
      - ".github/workflows/r4-rayk-andrew-strong-screen.yml"
  workflow_dispatch:

jobs:
  r4a-vs-rayk-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - run: python tools/fetch_public_opponents.py
      - name: Fetch exact Rayk V11
        env: {KAGGLE_USERNAME: "", KAGGLE_KEY: "", KAGGLE_API_TOKEN: ""}
        run: >-
          python tools/fetch_public_kaggle_notebook.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/11 --filename main.py --sha256 adc61ab15b3b4016e49efe525f4906e6ae3bbb66c4ff29ab795ae09df9fbaa5f --output-dir artifacts/public_kaggle/rayk_v11 --receipt artifacts/current-meta/rayk_v11_r4a_receipt.json
      - run: >-
          python tools/run_tournament.py --candidate file:artifacts/public_opponents/cok_v8_779caae.py:agent --opponents file:artifacts/public_kaggle/rayk_v11/main.py:agent --seed-partition development --output-root artifacts/current-meta/r4a-vs-rayk-v11
      - uses: actions/upload-artifact@v4
        with: {name: r4a-vs-rayk-v11, path: "artifacts/current-meta/**"}

  r4b-vs-rayk-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - run: python tools/fetch_public_opponents.py
      - run: test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Fetch exact Rayk V11
        env: {KAGGLE_USERNAME: "", KAGGLE_KEY: "", KAGGLE_API_TOKEN: ""}
        run: >-
          python tools/fetch_public_kaggle_notebook.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/11 --filename main.py --sha256 adc61ab15b3b4016e49efe525f4906e6ae3bbb66c4ff29ab795ae09df9fbaa5f --output-dir artifacts/public_kaggle/rayk_v11 --receipt artifacts/current-meta/rayk_v11_r4b_receipt.json
      - run: >-
          python tools/run_tournament.py --candidate file:candidates/r4b_ablation_market_only.py:agent --opponents file:artifacts/public_kaggle/rayk_v11/main.py:agent --seed-partition development --output-root artifacts/current-meta/r4b-vs-rayk-v11
      - uses: actions/upload-artifact@v4
        with: {name: r4b-vs-rayk-v11, path: "artifacts/current-meta/**"}

