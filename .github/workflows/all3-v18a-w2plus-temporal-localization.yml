name: all3-v18a-w2plus-temporal-localization
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v18a-w2plus-temporal-localization.yml'
      - 'tools/all3_v18a_w2_temporal_shard.py'
      - 'tools/aggregate_all3_v18a_w2_temporal.py'
      - 'docs/strategy/ALL3_V18A_W2_TEMPORAL_LOCALIZATION_PROTOCOL_2026-09-20.md'
      - 'configs/all3_v14a_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v18a_w2_temporal_shard.py
          python -m py_compile tools/aggregate_all3_v18a_w2_temporal.py
      - name: Run V18A shard
        run: |
          mkdir -p artifacts/v18a
          python tools/all3_v18a_w2_temporal_shard.py             --hard-config configs/all3_v14a_hard_contexts.json             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v18a/V18A_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v18a-shard-${{ matrix.shard_index }}
          path: artifacts/v18a/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v18a-shard-*
          path: artifacts/v18a-shards
          merge-multiple: false
      - name: Download binding V14A artifact
        uses: actions/download-artifact@v4
        with:
          name: all3-v14a-mechanical-completion
          path: artifacts/v14a-binding
          run-id: 35526276641
          github-token: ${{ github.token }}
      - name: Aggregate V18A
        run: |
          mkdir -p artifacts/v18a-aggregate
          python tools/aggregate_all3_v18a_w2_temporal.py             --input-dir artifacts/v18a-shards             --v14a-binding artifacts/v14a-binding/complete/ALL3_V14A_CURRENT_FRONTIER_DOMAIN_UPPER_BOUND_COMPLETE.json             --out artifacts/v18a-aggregate/ALL3_V18A_W2PLUS_TEMPORAL_LOCALIZATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v18a-w2plus-temporal-localization
          path: artifacts/v18a-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
