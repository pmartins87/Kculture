name: all3-v14a-current-frontier-domain-upper-bound
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v14a-current-frontier-domain-upper-bound.yml'
      - 'tools/all3_v14a_domain_upper_bound_shard.py'
      - 'tools/aggregate_all3_v14a_domain_upper_bound.py'
      - 'configs/all3_v14a_hard_contexts.json'
      - 'docs/strategy/ALL3_V14A_CURRENT_FRONTIER_DOMAIN_UPPER_BOUND_PROTOCOL_2026-09-20.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v14a_domain_upper_bound_shard.py
          python -m py_compile tools/aggregate_all3_v14a_domain_upper_bound.py
      - name: Run V14A shard
        run: |
          mkdir -p artifacts/v14a
          python tools/all3_v14a_domain_upper_bound_shard.py             --hard-config configs/all3_v14a_hard_contexts.json             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v14a/V14A_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14a-shard-${{ matrix.shard_index }}
          path: artifacts/v14a/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v14a-shard-*
          path: artifacts/v14a-shards
          merge-multiple: false
      - name: Aggregate V14A
        run: |
          mkdir -p artifacts/v14a-aggregate
          python tools/aggregate_all3_v14a_domain_upper_bound.py             --input-dir artifacts/v14a-shards             --hard-config configs/all3_v14a_hard_contexts.json             --out artifacts/v14a-aggregate/ALL3_V14A_CURRENT_FRONTIER_DOMAIN_UPPER_BOUND.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v14a-current-frontier-domain-upper-bound
          path: artifacts/v14a-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
