name: kexp054-kexp050-fresh-validation

on:
  push:
    paths:
      - .github/workflows/kexp054-kexp050-fresh-validation.yml
  workflow_dispatch:

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base dependency
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:candidates/r4d_reallocate_614_carrot.py)" = "61b77be136836328917441cb03f89bc6665c4c27"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Validation direct KEXP-050 vs R4B
        run: >-
          python tools/run_late_lifecycle_panel.py
          --candidate file:candidates/r4d_reallocate_614_carrot.py:agent
          --opponent file:candidates/r4b_ablation_market_only.py:agent
          --partition validation
          --output artifacts/kexp054/direct/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp054-direct
          path: artifacts/kexp054/direct/report.json

  public-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - id: kexp050
            ref: file:candidates/r4d_reallocate_614_carrot.py:agent
          - id: r4b
            ref: file:candidates/r4b_ablation_market_only.py:agent
        opponent:
          - id: kaito
            handle: kaitofukami/25-27-strict-future-v27-midgame-meta-reset/versions/4
            sha256: f48c21166eac68d1b05a401f04f94a2eb6154e65415af64893672365ff33c7b8
          - id: rayk
            handle: raykkretzschmar/kaggriculture-rank-your-agent/versions/11
            sha256: adc61ab15b3b4016e49efe525f4906e6ae3bbb66c4ff29ab795ae09df9fbaa5f
          - id: andrew
            handle: andrewsokolovsky/kaggriculture-breaking-the-tie/versions/12
            sha256: df4e899ad535754cf2ddbd3c16e48085916b0cd2baa5182a1a2cfc6a856abae5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen base dependency
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:candidates/r4d_reallocate_614_carrot.py)" = "61b77be136836328917441cb03f89bc6665c4c27"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Fetch hash-pinned public opponent
        run: >-
          python tools/fetch_public_kaggle_notebook.py
          --handle "${{ matrix.opponent.handle }}"
          --filename main.py
          --sha256 "${{ matrix.opponent.sha256 }}"
          --output-dir "artifacts/kexp054/${{ matrix.candidate.id }}-${{ matrix.opponent.id }}/opponent"
          --receipt "artifacts/kexp054/${{ matrix.candidate.id }}-${{ matrix.opponent.id }}/receipt.json"
      - name: Validation public-panel block
        run: >-
          python tools/run_late_lifecycle_panel.py
          --candidate "${{ matrix.candidate.ref }}"
          --opponent "file:artifacts/kexp054/${{ matrix.candidate.id }}-${{ matrix.opponent.id }}/opponent/main.py:agent"
          --partition validation
          --output "artifacts/kexp054/${{ matrix.candidate.id }}-${{ matrix.opponent.id }}/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kexp054-${{ matrix.candidate.id }}-${{ matrix.opponent.id }}
          path: |
            artifacts/kexp054/${{ matrix.candidate.id }}-${{ matrix.opponent.id }}/report.json
            artifacts/kexp054/${{ matrix.candidate.id }}-${{ matrix.opponent.id }}/receipt.json
