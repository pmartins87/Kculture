name: kaggle-kernel-version-introspection
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/kaggle-kernel-version-introspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -U 'kaggle>=2.2.3' 'kagglesdk>=0.1.35'
      - name: Introspect Kaggle kernel APIs
        run: |
          python - <<'PY'
          import inspect, json
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate()
          names=[n for n in dir(api) if 'kernel' in n.lower()]
          print('KAGGLE_API_KERNEL_METHODS',json.dumps(names))
          for n in names:
              try:
                  obj=getattr(api,n)
                  if callable(obj):
                      print('SIG',n,str(inspect.signature(obj)))
              except Exception as e:
                  print('SIGERR',n,repr(e))
          try:
              import kagglesdk
              print('KAGGLESDK',getattr(kagglesdk,'__version__',None))
          except Exception as e:
              print('KAGGLESDKERR',repr(e))
          ref='tetsutani/demand-preserving-turn-sale-timing'
          try:
              rows=api.kernels_list(user='tetsutani',search='demand-preserving-turn-sale-timing',page_size=20) or []
              print('KERNEL_LIST_COUNT',len(rows))
              for i,x in enumerate(rows):
                  vals={}
                  for n in dir(x):
                      if n.startswith('_'): continue
                      try:
                          v=getattr(x,n)
                          if callable(v): continue
                          if isinstance(v,(str,int,float,bool,type(None))):
                              vals[n]=v
                      except Exception: pass
                  print('KERNEL_META',i,json.dumps(vals,default=str,sort_keys=True))
          except Exception as e:
              print('KERNEL_LIST_ERR',repr(e))
          try:
              st=api.kernels_status(ref)
              vals={}
              for n in dir(st):
                  if n.startswith('_'): continue
                  try:
                      v=getattr(st,n)
                      if callable(v): continue
                      if isinstance(v,(str,int,float,bool,type(None))):
                          vals[n]=v
                  except Exception: pass
              print('KERNEL_STATUS_OBJ',type(st).__name__,json.dumps(vals,default=str,sort_keys=True),repr(st))
          except Exception as e:
              print('KERNEL_STATUS_ERR',repr(e))
          PY
