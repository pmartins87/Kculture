name: o-pc1-development
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/o-pc1-development.yml'
      - 'tools/first_party_pc1_profit_crop_rotation.py'
      - 'tools/o_pc1_dev_shard.py'
      - 'tools/aggregate_o_pc1_dev.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        opponent: [v47_mirror,v48,ready_stock]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/first_party_pc1_profit_crop_rotation.py
          python -m py_compile tools/o_pc1_dev_shard.py
      - name: Run O-PC1 development shard
        run: |
          mkdir -p artifacts/pc1-dev-shard
          python tools/o_pc1_dev_shard.py \
            --opponent ${{ matrix.opponent }} \
            --out artifacts/pc1-dev-shard/PC1_${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc1-dev-${{ matrix.opponent }}
          path: artifacts/pc1-dev-shard/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pc1-dev-*
          path: artifacts/pc1-dev-shards
          merge-multiple: false
      - name: Aggregate
        run: |
          mkdir -p artifacts/pc1-dev
          python tools/aggregate_o_pc1_dev.py \
            --input-dir artifacts/pc1-dev-shards \
            --out artifacts/pc1-dev/O_PC1_DEVELOPMENT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o-pc1-development
          path: artifacts/pc1-dev/*.json
          retention-days: 30
          if-no-files-found: warn
