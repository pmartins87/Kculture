name: v45-counterfactual-feature-corpus
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v45-counterfactual-feature-corpus.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U 'kaggle-environments==1.32.7'
      - uses: actions/download-artifact@v4
        with:
          name: v30b-binding-package
          path: v30b
          run-id: 35906418993
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v41-slim-current-corpus
          path: corpus
          run-id: 36737975801
          github-token: ${{ github.token }}
      - name: Collect V30B counterfactual features at step 216
        run: |
          mkdir -p out
          python tools/v45_collect_cf_features.py             --corpus-root corpus             --base-package v30b/V30B_CANDIDATE.tar.gz             --shard ${{ matrix.shard }} --num-shards 6             --output out/features-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v45-cf-features-${{ matrix.shard }}
          path: out/*.json
          retention-days: 3

  aggregate:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v45-cf-features-*
          path: shards
          merge-multiple: true
      - name: Require 75 contexts and V30B step216 parity
        run: |
          python - <<'PY'
          import glob,json
          from pathlib import Path
          rows=[]
          for fn in glob.glob("shards/*.json"):
              rows += json.loads(Path(fn).read_text())
          if len(rows)!=75: raise SystemExit(f"expected 75 rows got {len(rows)}")
          v=[r for r in rows if r["label"]=="v30b_final"]
          ok=sum(r.get("step216_parity") is True for r in v)
          if len(v)!=25 or ok!=25: raise SystemExit(f"V30B step216 parity {ok}/{len(v)}")
          eps=[int(r["episode_id"]) for r in rows]
          if len(eps)!=len(set(eps)): raise SystemExit("duplicate episode ids")
          out={"decision":"V45_COUNTERFACTUAL_FEATURE_CORPUS_PASS","rows":75,
               "v30b_step216_parity":"25/25","features":len(rows[0]["features"])}
          Path("V45_FEATURE_CORPUS_RESULT.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          Path("V45_FEATURE_CORPUS.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
          print("V45_FEATURE_CORPUS",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v45-counterfactual-feature-corpus
          path: |
            V45_FEATURE_CORPUS.json
            V45_FEATURE_CORPUS_RESULT.json
          retention-days: 3
