name: cr043-latest-top3000-probe
on:
  push:
    paths:
      - '.github/workflows/cr043-latest-top3000-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact environment
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -r requirements.txt kagglehub 'kaggle>=2.2.3'
      - name: Download frozen CR029 source bundle
        uses: actions/download-artifact@v4
        with:
          name: cr035-source-bundle
          path: artifacts/cr035_source_bundle
          run-id: 34016286606
          github-token: ${{ github.token }}
      - name: Syntax check
        run: |
          python -m py_compile tools/cr035_public_regime_selector_shard.py
          python -m py_compile tools/cr043_latest_top3000_probe.py
      - name: Probe latest top-3000 official meta
        run: >-
          python tools/cr043_latest_top3000_probe.py
          --source-bundle artifacts/cr035_source_bundle/source_bundle.json
          --output artifacts/cr043/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr043-latest-top3000-probe
          path: artifacts/cr043/report.json
          if-no-files-found: warn
          retention-days: 30
