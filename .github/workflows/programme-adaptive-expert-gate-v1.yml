name: programme-adaptive-expert-gate-v1
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/programme-adaptive-expert-gate-v1.yml'
      - 'tools/programme_adaptive_expert_gate.py'
      - 'docs/strategy/PROGRAMME_ADAPTIVE_EXPERT_GATE_2026-09-18.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned engine and public-output client
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' numpy
      - name: Syntax check
        run: python -m py_compile tools/programme_adaptive_expert_gate.py
      - name: Run frozen adaptive-expert gate
        run: |
          mkdir -p artifacts/programme-adaptive-expert-gate
          python tools/programme_adaptive_expert_gate.py \
            --out artifacts/programme-adaptive-expert-gate/ADAPTIVE_EXPERT_GATE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme-adaptive-expert-gate-v1
          path: artifacts/programme-adaptive-expert-gate/*.json
          retention-days: 30
          if-no-files-found: warn
