name: cr078-late-mirror-breaker-v1
on:
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr078-late-mirror-breaker-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen CR071M/PARENT corpus
        uses: actions/download-artifact@v4
        with:
          name: cr071-presale1-telemetry-packages
          path: artifacts/source
          run-id: 34349439774
          github-token: ${{ github.token }}
      - name: Download frozen historical frontier
        uses: actions/download-artifact@v4
        with:
          name: historical-reference-league-packages
          path: artifacts/historical
          run-id: 34276243787
          github-token: ${{ github.token }}
      - name: Build exactly one CR078 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/corpus artifacts/build
          BASE="$(find artifacts/source -name 'CR071M_CR053_PRESALE1_SEATSAFE_V1.tar.gz' -type f -print -quit)"
          test -s "$BASE"
          python tools/cr078_late_mirror_breaker.py --base "$BASE" --output-dir artifacts/build
          cp "$BASE" artifacts/corpus/CR071M_PARENT.tar.gz
          cp artifacts/build/CR078_LATE_MIRROR_BREAKER_V1.tar.gz artifacts/corpus/CR078.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR053_ROUTE106309334_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR053.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR061.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR065.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR070A.tar.gz
          cp artifacts/build/receipt.json artifacts/corpus/CR078_BUILD_RECEIPT.json
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from kaggle_exact_runtime import make_seeds
          used=set()
          for n,m in [(64,5809072026),(32,9092026),(32,9092027)]: used |= set(make_seeds(n,m))
          fresh=set(make_seeds(32,9102026))
          overlap=used & fresh
          if overlap: raise SystemExit(f'fresh-seed firewall failed: {sorted(overlap)}')
          print('fresh-seed firewall PASS',len(fresh),min(fresh),max(fresh))
          PY
          find artifacts/corpus -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/corpus/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cr078-late-mirror-breaker-v1-packages
          path: artifacts/corpus/
          retention-days: 30
          if-no-files-found: error

  h2h:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { variant: CR078, opponent: CR071M_PARENT }
          - { variant: CR078, opponent: CR070A }
          - { variant: CR078, opponent: CR053 }
          - { variant: CR078, opponent: CR061 }
          - { variant: CR078, opponent: CR065 }
          - { variant: CR071M_PARENT, opponent: CR053 }
          - { variant: CR071M_PARENT, opponent: CR061 }
          - { variant: CR071M_PARENT, opponent: CR065 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned Kaggle reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7' numpy
      - name: Compile exact-reference runner
        run: python -m py_compile tools/kaggle_exact_runtime.py tools/kaggle_reference_h2h_v2.py
      - uses: actions/download-artifact@v4
        with:
          name: cr078-late-mirror-breaker-v1-packages
          path: artifacts/corpus
      - name: Exact-reference screen — 32 paired seeds / 64 games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/result
          python tools/kaggle_reference_h2h_v2.py \
            --a "artifacts/corpus/${{ matrix.variant }}.tar.gz" \
            --b "artifacts/corpus/${{ matrix.opponent }}.tar.gz" \
            --a-id '${{ matrix.variant }}' --b-id '${{ matrix.opponent }}' \
            --seed-count 32 --master-seed 9102026 \
            --output 'artifacts/result/${{ matrix.variant }}_vs_${{ matrix.opponent }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr078-screen-${{ matrix.variant }}-vs-${{ matrix.opponent }}
          path: artifacts/result/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: h2h
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cr078-screen-*
          path: artifacts/results
          merge-multiple: true
      - name: Apply frozen discovery gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('artifacts/results').glob('*.json')):
              d=json.loads(p.read_text())
              m=d['metrics_a_vs_b']; u=d.get('paired_seed_uncertainty') or {}
              rows.append({'variant':d['a'],'opponent':d['b'],'wins':m['wins'],'losses':m['losses'],'ties':m['ties'],'games':m['games'],'score_rate':m['score_rate'],'ci95':u.get('ci95'),'errors':len(d.get('errors') or [])})
          by={(r['variant'],r['opponent']):r for r in rows}
          c='CR078'; p='CR071M_PARENT'; guards=['CR053','CR061','CR065']
          required=[(c,p),(c,'CR070A')]+[(c,o) for o in guards]+[(p,o) for o in guards]
          missing=[x for x in required if x not in by]
          if missing: raise SystemExit(f'missing H2H outputs: {missing}')
          mirror=by[(c,p)]; tetsu=by[(c,'CR070A')]
          guard_deltas={o:by[(c,o)]['score_rate']-by[(p,o)]['score_rate'] for o in guards}
          ci=mirror.get('ci95') or [0,1]
          checks={
            'candidate_vs_exact_parent_at_least_0.60': mirror['score_rate'] >= 0.60,
            'candidate_vs_exact_parent_ci_lower_above_0.50': ci[0] > 0.50,
            'candidate_vs_cr070a_at_least_0.60': tetsu['score_rate'] >= 0.60,
            'no_guardrail_regression_below_minus_0.03125': all(v >= -0.03125 for v in guard_deltas.values()),
            'all_h2h_error_free': all(r['errors']==0 for r in rows),
          }
          gate=all(checks.values())
          out={'schema_version':'kculture-cr078-late-mirror-breaker-v1-summary','primary_metric':'seat-balanced W/L / score_rate','money_margin_role':'diagnostic_only','fresh_master_seed':9102026,'fresh_seed_count':32,'rows':rows,'guardrail_delta_candidate_minus_parent':guard_deltas,'gate_checks':checks,'promotion_gate_pass':gate,'decision':'EXPAND_TO_INDEPENDENT_CONFIRMATION' if gate else 'DO_NOT_SUBMIT_CR078_SCREEN_FAILED','automatic_kaggle_submission':False}
          Path('artifacts/summary').mkdir(parents=True,exist_ok=True)
          Path('artifacts/summary/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          md=['# CR078 late mirror-breaker screen','',f"Candidate vs exact CR071M parent: **{mirror['score_rate']:.4f}** {mirror['wins']}-{mirror['losses']}-{mirror['ties']} CI95={mirror['ci95']}",f"Candidate vs CR070A/Tetsu: **{tetsu['score_rate']:.4f}** {tetsu['wins']}-{tetsu['losses']}-{tetsu['ties']}",'','Guardrail deltas:']+[f"- {o}: {guard_deltas[o]:+.4f}" for o in guards]+['',f"Gate: **{'PASS' if gate else 'FAIL'}**",f"Decision: `{out['decision']}`"]
          Path('artifacts/summary/summary.md').write_text('\n'.join(md)+'\n')
          print('\n'.join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cr078-late-mirror-breaker-v1-summary
          path: artifacts/summary/
          retention-days: 30
          if-no-files-found: error
