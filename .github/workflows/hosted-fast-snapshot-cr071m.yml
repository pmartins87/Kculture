name: hosted-fast-snapshot-cr071m
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/hosted-fast-snapshot-cr071m.yml'
  workflow_dispatch:

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install -U 'kaggle>=2.2.1'
      - name: Freeze current hosted metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hosted-fast-cr071m
          kaggle competitions episodes 56124705 --format json --quiet > artifacts/hosted-fast-cr071m/episodes.json
          kaggle competitions submission-limits kaggriculture --json > artifacts/hosted-fast-cr071m/submission-limits.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/hosted-fast-cr071m/episodes.json')
          obj=json.loads(p.read_text())
          eps=obj if isinstance(obj,list) else next((obj[k] for k in ('episodes','items','results','data') if isinstance(obj.get(k),list)),[])
          sid=56124705
          counts={'WIN':0,'LOSS':0,'TIE':0,'UNKNOWN':0}
          rows=[]
          for ep in eps:
              agents=ep.get('agents') or ep.get('Agents') or []
              mine=None; rewards=[]; idx=None
              for i,a in enumerate(agents):
                  if not isinstance(a,dict): continue
                  try: r=float(a.get('reward',a.get('Reward')))
                  except Exception: r=None
                  if r is not None: rewards.append(r)
                  try: sub=int(a.get('submissionId',a.get('submission_id',a.get('SubmissionId'))))
                  except Exception: sub=None
                  if sub==sid: mine=r; idx=i
              out='UNKNOWN'
              if mine is not None and rewards:
                  best=max(rewards)
                  out='LOSS' if mine<best else ('TIE' if sum(r==best for r in rewards)>1 else 'WIN')
              counts[out]+=1
              eid=ep.get('id',ep.get('episodeId',ep.get('episode_id')))
              rows.append({'episode_id':eid,'outcome':out,'agent_index':idx})
          summary={'submission_id':sid,'episode_count':len(eps),'outcomes':counts,'recent_compact':rows[:30]}
          Path('artifacts/hosted-fast-cr071m/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-fast-snapshot-cr071m
          path: artifacts/hosted-fast-cr071m/**
          retention-days: 30
          if-no-files-found: error
