name: cr026b-rank10-fresh-gate
'on':
  push:
    paths:
      - .github/workflows/cr026b-rank10-fresh-gate.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - &deps
        run: python -m pip install -r requirements.txt kagglehub 'kaggle>=2.2.3'
      - uses: actions/download-artifact@v4
        with:
          name: cr026-screen-input
          path: artifacts/cr026b
          run-id: 33973134213
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and mechanically verify frozen rank-10 candidate
        run: python tools/cr026b_fresh_gate.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: cr026b-prepared
          path: artifacts/cr026b/**
          retention-days: 7

  reactive:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: rayk
            handle: raykkretzschmar/kaggriculture-rank-your-agent/versions/23
            archive_sha256: 86b7ae5c029e351adfbd80059cd185b39d1467303437e6441ff7ad871cd8e7ee
            main_sha256: 6c709f6d3ce6cf221a9495de7e716fcd1b660e3bbc8ee5679b63233d0265a812
          - id: boatlee
            handle: boatlee/v21-r1-public-state-route-portfolio/versions/2
            archive_sha256: d65410a4fc8a31226055e43085131468ac8af5721aabdf3593cb8eade59cabe3
            main_sha256: c6f96a8521dc9aa369b6f27e5b36b9d481e5c1688f50c8ca215c3bb53f1f9eb8
          - id: prvsiyan
            handle: prvsiyan/kaggriculture-frontier-the-soil-remembers-rain/versions/10
            archive_sha256: fadde4e4e5cde332352827cbbfd7c8ea95f2e9abd34a3ca7196a29b007e93bd3
            main_sha256: 943e8c114ace4f5c5965698e66a4943e982dab4ccb57d8efa134a4e5b4f13955
    steps:
      - *checkout
      - *python
      - *deps
      - &prepared
        uses: actions/download-artifact@v4
        with:
          name: cr026b-prepared
          path: artifacts/cr026b
      - name: Fetch exact reactive opponent
        run: python tools/fetch_exact_package_main.py --handle '${{ matrix.handle }}' --output artifacts/cr026b/opponent.py --receipt artifacts/cr026b/opponent.json
      - name: Check opponent source identity
        env:
          EXPECT_MAIN: ${{ matrix.main_sha256 }}
          EXPECT_ARCHIVE: ${{ matrix.archive_sha256 }}
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('artifacts/cr026b/opponent.json'))
          assert r['main_sha256']==os.environ['EXPECT_MAIN']
          assert r['archive_sha256']==os.environ['EXPECT_ARCHIVE']
          PY
      - name: Run fresh paired reactive shard
        run: python tools/cr026b_fresh_gate.py reactive --opponent artifacts/cr026b/opponent.py --opponent-id '${{ matrix.id }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr026b-reactive-${{ matrix.id }}
          path: artifacts/cr026b/reactive_*.json
          if-no-files-found: error

  hosted:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - *checkout
      - *python
      - *deps
      - *prepared
      - name: Run deterministic fresh hosted panel and direct replication
        run: python tools/cr026b_fresh_gate.py hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr026b-hosted
          path: artifacts/cr026b/hosted.json
          if-no-files-found: error

  aggregate:
    needs:
      - reactive
      - hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - *prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: cr026b-reactive-*
          path: artifacts/cr026b
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cr026b-hosted
          path: artifacts/cr026b
      - name: Apply frozen promotion rule
        run: python tools/cr026b_fresh_gate.py aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr026b-final-report
          path: artifacts/cr026b/final.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cr026b-ready-submission
          path: |
            artifacts/cr026b/CR026B_RECENT_BACKBONE_RANK10_V1.tar.gz
            artifacts/cr026b/manifest.json
            artifacts/cr026b/final.json
          if-no-files-found: error
