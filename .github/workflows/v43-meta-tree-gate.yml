name: v43-meta-tree-gate
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v43-meta-tree-gate.yml']
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U scikit-learn numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: v42-shard-*
          path: shards
          merge-multiple: true
          run-id: 36738813734
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v41-slim-current-corpus
          path: corpus
          run-id: 36737975801
          github-token: ${{ github.token }}
      - name: Train shallow public-state meta tree with temporal holdout
        run: |
          python tools/v43_train_meta_tree.py             --shards-dir shards             --corpus-root corpus             --holdout-per-label 5             --output V43_MODEL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v43-model
          path: V43_MODEL.json
          retention-days: 3
          if-no-files-found: warn
