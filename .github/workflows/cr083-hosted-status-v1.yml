name: CR083 hosted status v1 read-only
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr083-hosted-status-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TARGET_SUBMISSION: '56199767'
      CONTROL_SUBMISSION: '56124705'
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: test -n "$KAGGLE_API_TOKEN"
      - run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Read-only CR083 status, episodes and current frontier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hosted_status
          kaggle competitions submissions kaggriculture -v -q | tee hosted_status/own_submissions.csv
          echo '=== TARGET ==='
          grep -F "${TARGET_SUBMISSION}," hosted_status/own_submissions.csv || true
          echo '=== CONTROL ==='
          grep -F "${CONTROL_SUBMISSION}," hosted_status/own_submissions.csv || true
          echo '=== TARGET EPISODES ==='
          kaggle competitions episodes "$TARGET_SUBMISSION" -v -q | tee hosted_status/target_episodes.csv || true
          echo '=== CONTROL EPISODES ==='
          kaggle competitions episodes "$CONTROL_SUBMISSION" -v -q | tee hosted_status/control_episodes.csv || true
          echo '=== EPISODE COUNTS ==='
          python - <<'PY'
          from pathlib import Path
          def count_csv(path):
              lines=[x for x in Path(path).read_text(errors='replace').splitlines() if x.strip()]
              # tolerate CLI preambles; header contains episode id
              for i,line in enumerate(lines):
                  low=line.lower()
                  if ',' in line and 'episode' in low:
                      return max(0,len(lines)-i-1)
              return 0
          print('target_episode_rows=',count_csv('hosted_status/target_episodes.csv'))
          print('control_episode_rows=',count_csv('hosted_status/control_episodes.csv'))
          PY
          echo '=== CURRENT LEADERBOARD ==='
          kaggle competitions leaderboard kaggriculture --show -v -q | tee hosted_status/leaderboard.csv
      - uses: actions/upload-artifact@v4
        with:
          name: cr083-hosted-status-v1
          path: hosted_status/**
          retention-days: 30
