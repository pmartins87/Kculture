name: cr019-barnyard-3034-reference-probe
on:
  push:
    paths:
      - '.github/workflows/cr019-barnyard-3034-reference-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader and current engine
        run: |
          python -m pip install -U kagglehub
          python -m pip install kaggle-environments==1.32.7
      - name: Fetch exact Version 7 packaged main.py
        run: |
          mkdir -p artifacts/cr019
          python tools/fetch_exact_package_main.py \
            --handle romanrozen/strong-barnyard-economist/versions/7 \
            --output artifacts/cr019/barnyard_economist_v7.py \
            --receipt artifacts/cr019/receipt.json
      - name: Audit import and content identity
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          p=Path('artifacts/cr019/barnyard_economist_v7.py')
          data=p.read_bytes()
          spec=importlib.util.spec_from_file_location('cr019_barnyard',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert callable(m.agent)
          report={
            'source':'romanrozen/strong-barnyard-economist/versions/7',
            'reported_public_score':3034.8,
            'license':'Apache-2.0 (Kaggle notebook metadata; attribution required)',
            'main_sha256':hashlib.sha256(data).hexdigest(),
            'main_bytes':len(data),
            'imports_current_engine':True,
          }
          Path('artifacts/cr019/probe.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr019-barnyard-3034-reference-probe
          path: artifacts/cr019/**
