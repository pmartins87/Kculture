name: cr015e-mode-switch-diagnostic
on:
  push:
    paths:
      - '.github/workflows/cr015e-mode-switch-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen R4B dependencies
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:candidates/cr015_liquidation_phase_early_order.py)" = "fabd4bc398e7eadcfd1d44add4d0e593315140e8"
          test "$(git rev-parse HEAD:configs/cr014b_affected_pairs_v1.json)" = "59b3c9a3e1541dd25418bc2034762cba95be7909"
          test "$(git rev-parse HEAD:tools/cr015e_mode_switch_diagnostic.py)" = "c8d5a4d2243626c9f487a4ba9517256279b4ccec"
      - name: Fetch exact affected-opponent packages
        run: |
          mkdir -p artifacts/cr015e/opponents
          python tools/fetch_exact_package_main.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/23 --output artifacts/cr015e/opponents/rayk.py --receipt artifacts/cr015e/opponents/rayk.json
          python tools/fetch_exact_package_main.py --handle boatlee/v21-r1-public-state-route-portfolio/versions/2 --output artifacts/cr015e/opponents/boatlee.py --receipt artifacts/cr015e/opponents/boatlee.json
          python tools/fetch_exact_package_main.py --handle andrewsokolovsky/kaggriculture/versions/11 --output artifacts/cr015e/opponents/andrew.py --receipt artifacts/cr015e/opponents/andrew.json
          python tools/fetch_exact_package_main.py --handle tetsutani/read-the-town-build-the-farm-kaggriculture/versions/2 --output artifacts/cr015e/opponents/tetsu.py --receipt artifacts/cr015e/opponents/tetsu.json
      - name: Diagnose mode switching
        run: |
          python tools/cr015e_mode_switch_diagnostic.py \
            --opponent-dir artifacts/cr015e/opponents \
            --output artifacts/cr015e/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr015e-mode-switch-diagnostic
          path: artifacts/cr015e/**
