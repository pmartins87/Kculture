name: cr045b-official-episode-metadata-probe
'on':
  push:
    paths:
      - '.github/workflows/cr045b-official-episode-metadata-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install kagglehub
      - name: Syntax check
        run: python -m py_compile tools/cr045b_official_episode_metadata_probe.py
      - name: Inspect official episode metadata
        run: python tools/cr045b_official_episode_metadata_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr045b-official-episode-metadata-probe
          path: artifacts/cr045b/report.json
          if-no-files-found: warn
          retention-days: 30
