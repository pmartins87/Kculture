name: v37-live-quota-snapshot
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v37-live-quota-snapshot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Snapshot
        run: |
          set -euo pipefail
          python -m pip install -U 'kaggle>=2.2.3'
          kaggle competitions submissions kaggriculture -v -q | tee submissions.csv
          kaggle competitions submission-limits kaggriculture --json | tee limits.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: v37-live-quota-snapshot
          path: |
            submissions.csv
            limits.json
          retention-days: 3
