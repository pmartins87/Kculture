# checkpoint 2
name: all3-hosted-status-once-v1
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-hosted-status-once-v1.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: kaggriculture
      ORW1_DESCRIPTION: PS_ORW1_R2_TREATMENT_HOSTED_FAITHFUL_997AA273
      ALL3_DESCRIPTION: PS_ALL3_V1_RW1_TW1_LQ2_204A9ED4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -U 'kaggle>=2.2.3'
      - name: Capture current intended pair
        shell: bash
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' | tee snapshot_utc.txt
          kaggle competitions submissions "$COMPETITION" -v -q | tee submissions.csv
          echo "ORW1:"
          grep -F "$ORW1_DESCRIPTION" submissions.csv | head -1 | tee orw1_row.txt
          echo "ALL3:"
          grep -F "$ALL3_DESCRIPTION" submissions.csv | head -1 | tee all3_row.txt
      - uses: actions/upload-artifact@v4
        with:
          name: all3-hosted-status-once-v1
          path: |
            snapshot_utc.txt
            submissions.csv
            orw1_row.txt
            all3_row.txt
          retention-days: 30
