name: cr033-cr029-jit-carrot-screen
on:
  push:
    paths:
      - '.github/workflows/cr033-cr029-jit-carrot-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact environment
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -r requirements.txt kagglehub 'kaggle>=2.2.3'
      - name: Syntax check
        run: python -m py_compile tools/cr033_cr029_jit_carrot_screen.py
      - name: Run focused causal screen
        run: python tools/cr033_cr029_jit_carrot_screen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr033-cr029-jit-carrot-screen
          path: |
            artifacts/cr033_cr029_jit_carrot_screen/report.json
            artifacts/cr033_cr029_jit_carrot_screen/summary.json
          if-no-files-found: warn
          retention-days: 30
