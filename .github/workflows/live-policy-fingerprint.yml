name: live-policy-fingerprint

on:
  push:
    paths:
      - ".github/workflows/live-policy-fingerprint.yml"
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install public dataset client
        run: python -m pip install -U kagglehub
      - name: Fingerprint top-20 live policies
        env:
          KAGGLE_USERNAME: ""
          KAGGLE_KEY: ""
          KAGGLE_API_TOKEN: ""
        run: |
          set -euo pipefail
          python tools/live_meta_policy_fingerprint.py \
            --date 2026-08-25 \
            --top 20 \
            --output artifacts/live-policy-fingerprint/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp020-live-policy-fingerprint
          path: artifacts/live-policy-fingerprint/report.json
