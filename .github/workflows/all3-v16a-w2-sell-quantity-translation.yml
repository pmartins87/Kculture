name: all3-v16a-w2-sell-quantity-translation
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v16a-w2-sell-quantity-translation.yml'
      - 'tools/all3_v16a_w2_sell_quantity_translation.py'
      - 'docs/strategy/ALL3_V16A_W2_SELL_QUANTITY_PROTOCOL_2026-09-20.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download V14B binding artifact
        uses: actions/download-artifact@v4
        with:
          name: all3-v14b-market-phenotype-atlas
          path: artifacts/v14b-source
          run-id: 35526759114
          github-token: ${{ github.token }}
      - name: Syntax
        run: python -m py_compile tools/all3_v16a_w2_sell_quantity_translation.py
      - name: Translate W2 SELL quantity phenotype
        run: |
          mkdir -p artifacts/v16a
          python tools/all3_v16a_w2_sell_quantity_translation.py             --atlas artifacts/v14b-source/ALL3_V14B_MARKET_PHENOTYPE_ATLAS.json             --out artifacts/v16a/ALL3_V16A_W2_SELL_QUANTITY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v16a-w2-sell-quantity
          path: artifacts/v16a/*.json
          retention-days: 30
          if-no-files-found: warn
