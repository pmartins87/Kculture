name: all3-v7-option-composition-attribution
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v7-option-composition-attribution.yml'
      - 'tools/all3_v7_option_composition_context.py'
      - 'tools/aggregate_all3_v7_option_composition.py'
      - 'configs/all3_v6_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v7_option_composition_context.py
          python -m py_compile tools/aggregate_all3_v7_option_composition.py
      - name: Run V7 context attribution
        run: |
          mkdir -p artifacts/v7
          python tools/all3_v7_option_composition_context.py \
            --config configs/all3_v6_hard_contexts.json \
            --index ${{ matrix.index }} \
            --out artifacts/v7/V7_CONTEXT_${{ matrix.index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-context-${{ matrix.index }}
          path: artifacts/v7/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: context
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v7-context-*
          path: artifacts/v7-contexts
          merge-multiple: false
      - name: Aggregate V7
        run: |
          mkdir -p artifacts/v7-aggregate
          python tools/aggregate_all3_v7_option_composition.py \
            --input-dir artifacts/v7-contexts \
            --out artifacts/v7-aggregate/ALL3_V7_OPTION_COMPOSITION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v7-option-composition-attribution
          path: artifacts/v7-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
