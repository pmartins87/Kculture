name: r4-public-base-screen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen environment
        run: python -m pip install -r requirements.txt

      - name: Validate laboratory configs
        run: python tools/validate_r2_configs.py

      - name: Fetch hash-pinned public agents
        run: python tools/fetch_public_opponents.py

      - name: COK V8 versus simple reference pool
        run: >-
          python tools/run_tournament.py
          --candidate file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --opponent-pool configs/opponent_pool.json
          --seed-partition development
          --limit-seeds 4

      - name: Seyamalam V21 versus simple reference pool
        run: >-
          python tools/run_tournament.py
          --candidate file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --opponent-pool configs/opponent_pool.json
          --seed-partition development
          --limit-seeds 4

      - name: COK V8 versus Seyamalam V21
        run: >-
          python tools/run_tournament.py
          --candidate file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --opponents file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --seed-partition development
          --limit-seeds 8

      - name: Preserve R4 base-screen artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r4-public-base-screen
          path: |
            artifacts/public_opponents/fetch_receipt.json
            artifacts/tournaments/**/tournament.json
