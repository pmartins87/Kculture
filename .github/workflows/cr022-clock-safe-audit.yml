name: cr022-clock-safe-audit
on:
  push:
    paths:
      - .github/workflows/cr022-clock-safe-audit.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Install frozen engine
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base dependencies
        run: python tools/fetch_public_opponents.py
      - name: Run normal parity and missing-step fault injection
        run: |
          mkdir -p artifacts/cr022_clock_safe
          python tools/cr022_clock_safe_audit.py --output artifacts/cr022_clock_safe/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr022-clock-safe-audit
          path: artifacts/cr022_clock_safe/**
