name: kexp052-fresh-exploratory-stress

on:
  push:
    paths:
      - .github/workflows/kexp052-fresh-exploratory-stress.yml
  workflow_dispatch:

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: kexp045
            candidate: file:candidates/r4d_jit_carrot_two.py:agent
            blob: 9d199b3c263254805c64f122367afe180027afeb
          - label: kexp050
            candidate: file:candidates/r4d_reallocate_614_carrot.py:agent
            blob: 61b77be136836328917441cb03f89bc6665c4c27
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:tools/run_fresh_exploratory_stress.py)" = "564a984a216abdc24edf4c85afaa60ff546ecb48"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:$(echo '${{ matrix.candidate }}' | cut -d: -f2))" = "${{ matrix.blob }}"
      - name: Run 96-seed both-seat stress
        run: python tools/run_fresh_exploratory_stress.py --candidate "${{ matrix.candidate }}" --count 96 --output "artifacts/kexp052/${{ matrix.label }}/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kexp052-${{ matrix.label }}
          path: artifacts/kexp052/${{ matrix.label }}/report.json
