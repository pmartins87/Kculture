name: all3-v19d-tm1-package-parity
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - 'activate/v19d_tm1_package'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Download binding V19A schedule
        uses: actions/download-artifact@v4
        with:
          name: all3-v19a-p2-consensus-schedule
          path: artifacts/v19a-binding
          run-id: 35552885627
          github-token: ${{ github.token }}
      - name: Syntax
        run: |
          python -m py_compile tools/build_all3_tm1_hosted_candidate.py
          python -m py_compile tools/all3_tm1_package_parity_gate.py
      - name: Build deterministic hosted package
        run: |
          mkdir -p artifacts/v19d-package
          python tools/build_all3_tm1_hosted_candidate.py             --schedule artifacts/v19a-binding/ALL3_V19A_P2_CONSENSUS_SCHEDULE.json             --out-dir artifacts/v19d-package
      - name: Run exact package parity
        run: |
          python tools/all3_tm1_package_parity_gate.py             --candidate artifacts/v19d-package/KCULTURE_V47_ALL3_TM1_V1.tar.gz             --schedule artifacts/v19a-binding/ALL3_V19A_P2_CONSENSUS_SCHEDULE.json             --out artifacts/v19d-package/V19D_PACKAGE_PARITY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v19d-tm1-package-parity
          path: artifacts/v19d-package/*
          retention-days: 30
          if-no-files-found: warn
