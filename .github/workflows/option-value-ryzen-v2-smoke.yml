name: option-value-ryzen-v2-smoke
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/option-value-ryzen-v2-smoke.yml'
      - 'tools/option_value_dataset_ryzen_v2.py'
      - 'tools/run_option_value_v2_ryzen.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/option_value_dataset_ryzen_v2.py
          python -m py_compile tools/option_value_dataset_v0_pilot.py
      - name: Run one-seed seven-opponent V2 smoke
        run: |
          rm -rf runs/option_value_v2_smoke
          python tools/option_value_dataset_ryzen_v2.py             --out runs/option_value_v2_smoke             --seed-count 1             --master-seed 26091903             --opponents v47_mirror,ready_stock,v48,router_2715,conditional_memory,tactical_memory,best_market             --seats 0             --workers 1
          cat runs/option_value_v2_smoke/SUMMARY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-value-ryzen-v2-smoke
          path: runs/option_value_v2_smoke/**
          retention-days: 30
          if-no-files-found: warn
