name: cr008-model-parity
on:
  push:
    paths:
      - 'models/cr007_pure_models.json'
      - '.github/workflows/cr008-model-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install kagglehub scikit-learn kaggle-environments
      - name: Audit sklearn to pure-tree parity
        run: |
          mkdir -p artifacts/cr008-parity
          python tools/audit_cr008_model_parity.py --top 20 --output artifacts/cr008-parity/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr008-model-parity
          path: artifacts/cr008-parity/**
