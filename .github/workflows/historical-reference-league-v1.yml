name: historical-reference-league-v1
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/historical-reference-league-v1.yml'
      - 'tools/historical_reference_league_rank.py'
      - 'tools/kaggle_exact_runtime.py'
      - 'tools/kaggle_reference_h2h_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download authoritative CR053
        uses: actions/download-artifact@v4
        with:
          name: cr052-cr053-hosted-candidates
          path: artifacts/source/cr053
          run-id: 34105008373
          github-token: ${{ github.token }}

      - name: Download authoritative CR061
        uses: actions/download-artifact@v4
        with:
          name: cr060-cr061-seat-safe-candidates
          path: artifacts/source/cr061
          run-id: 34136336741
          github-token: ${{ github.token }}

      - name: Download authoritative CR065
        uses: actions/download-artifact@v4
        with:
          name: cr064-cr066-current-frontier-seatsafe
          path: artifacts/source/cr065
          run-id: 34160996911
          github-token: ${{ github.token }}

      - name: Download authoritative CR068A/B
        uses: actions/download-artifact@v4
        with:
          name: cr068-historical-frontier-seatsafe
          path: artifacts/source/cr068
          run-id: 34183263508
          github-token: ${{ github.token }}

      - name: Download authoritative CR070A
        uses: actions/download-artifact@v4
        with:
          name: cr070-shape-shop-packages
          path: artifacts/source/cr070
          run-id: 34192356280
          github-token: ${{ github.token }}

      - name: Freeze exact six-package league corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/league_packages
          declare -a files=(
            R4D_CR053_ROUTE106309334_V1.tar.gz
            R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz
            R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz
            R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz
            R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz
            R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz
          )
          for name in "${files[@]}"; do
            src=$(find artifacts/source -name "$name" -type f -print -quit)
            test -n "$src"
            cp "$src" artifacts/league_packages/
          done
          (cd artifacts/league_packages && sha256sum *.tar.gz | sort) | tee artifacts/league_packages/SHA256SUMS.txt
          test "$(find artifacts/league_packages -name '*.tar.gz' | wc -l)" -eq 6

      - uses: actions/upload-artifact@v4
        with:
          name: historical-reference-league-packages
          path: artifacts/league_packages/
          retention-days: 30
          if-no-files-found: error

  h2h:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {a: CR053, b: CR061, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz}
          - {a: CR053, b: CR065, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz}
          - {a: CR053, b: CR068A, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz}
          - {a: CR053, b: CR068B, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz}
          - {a: CR053, b: CR070A, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: CR061, b: CR065, afile: R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz, bfile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz}
          - {a: CR061, b: CR068A, afile: R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz, bfile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz}
          - {a: CR061, b: CR068B, afile: R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz, bfile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz}
          - {a: CR061, b: CR070A, afile: R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: CR065, b: CR068A, afile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz, bfile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz}
          - {a: CR065, b: CR068B, afile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz, bfile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz}
          - {a: CR065, b: CR070A, afile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: CR068A, b: CR068B, afile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz, bfile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz}
          - {a: CR068A, b: CR070A, afile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: CR068B, b: CR070A, afile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned Kaggle reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7' numpy

      - name: Compile exact-reference runner
        run: |
          python -m py_compile tools/kaggle_exact_runtime.py tools/kaggle_reference_h2h_v2.py

      - uses: actions/download-artifact@v4
        with:
          name: historical-reference-league-packages
          path: artifacts/packages

      - name: Resolve exact packages
        shell: bash
        run: |
          set -euo pipefail
          A=$(find artifacts/packages -name '${{ matrix.afile }}' -type f -print -quit)
          B=$(find artifacts/packages -name '${{ matrix.bfile }}' -type f -print -quit)
          test -n "$A" && test -n "$B"
          echo "A=$A" >> "$GITHUB_ENV"
          echo "B=$B" >> "$GITHUB_ENV"
          sha256sum "$A" "$B"

      - name: Exact Kaggle reference H2H - 32 paired seeds / 64 games
        run: |
          mkdir -p artifacts/result
          PYTHONPATH=tools python tools/kaggle_reference_h2h_v2.py \
            --a "$A" --b "$B" \
            --a-id '${{ matrix.a }}' --b-id '${{ matrix.b }}' \
            --seed-count 32 \
            --output 'artifacts/result/${{ matrix.a }}_vs_${{ matrix.b }}.json'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-reference-${{ matrix.a }}-vs-${{ matrix.b }}
          path: artifacts/result/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: [prepare, h2h]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download pairwise results
        uses: actions/download-artifact@v4
        with:
          pattern: historical-reference-*-vs-*
          path: artifacts/results
          merge-multiple: true

      - name: Aggregate W/L and Bradley-Terry
        run: |
          mkdir -p artifacts/league_summary
          python tools/historical_reference_league_rank.py \
            --root artifacts/results \
            --output-json artifacts/league_summary/historical_reference_league_v1.json \
            --output-md artifacts/league_summary/historical_reference_league_v1.md
          cat artifacts/league_summary/historical_reference_league_v1.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-reference-league-v1-summary
          path: artifacts/league_summary/
          retention-days: 30
          if-no-files-found: warn
