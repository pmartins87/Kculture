name: cr010-kaggriculture-order-sequence
on:
  push:
    paths:
      - '.github/workflows/cr010-kaggriculture-order-sequence.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub scikit-learn
      - name: Verify frozen diagnostic
        run: |
          test "$(git rev-parse HEAD:tools/cr010_kaggriculture_order_sequence_audit.py)" = "c6b3d02ee18d80b58c6b4bc79c12bbc10e286d42"
      - name: Run strict out-of-time order-sequence audit
        run: |
          python tools/cr010_kaggriculture_order_sequence_audit.py \
            --top 20 \
            --output artifacts/cr010/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr010-kaggriculture-order-sequence
          path: artifacts/cr010/**
