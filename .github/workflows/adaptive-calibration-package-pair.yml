name: adaptive-calibration-package-pair
on:
  push:
    paths:
      - '.github/workflows/adaptive-calibration-package-pair.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub scikit-learn
      - name: Fetch frozen COK base
        run: python tools/fetch_public_opponents.py
      - name: Verify source candidate identities
        run: |
          test "$(git rev-parse HEAD:candidates/cr008_adaptive_frontrun.py)" = "8e1c26202c3101c19668bf61edf2ae51d4329d5d"
          test "$(git rev-parse HEAD:candidates/cr011_adaptive_early_order.py)" = "c4f1cb79f3c20b8229ab09e00a6878289cf9648d"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Build deterministic calibration packages
        run: python tools/build_cr008_cr011_calibration_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-calibration-package-pair
          path: artifacts/submissions/adaptive_calibration_pair/**
      - name: Prove source-to-package parity on official active-trigger states
        run: python tools/audit_adaptive_calibration_package_pair.py

# Recovery rebuild requested 2026-08-30; upload precedes long parity audit.
