name: cr022b-recent-top-forecast-tournament-v2
on:
  push:
    paths:
      - '.github/workflows/cr022b-recent-top-forecast-tournament-v2.yml'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub scikit-learn
      - name: Verify frozen CR022B V2 identities
        run: |
          test "$(git rev-parse HEAD:tools/cr022b_recent_top_forecast_tournament.py)" = "9e06ca153cd169591d136a5a57db326f27df22b7"
          test "$(git rev-parse HEAD:models/cr007_pure_models.json)" = "d4b29e753e2328ac43503f8daa655cc63abdd336"
      - name: Run unchanged recent official top-episode forecast tournament
        run: |
          mkdir -p artifacts/cr022b_v2
          python tools/cr022b_recent_top_forecast_tournament.py --top 20 --output artifacts/cr022b_v2/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr022b-recent-top-forecast-tournament-v2
          path: artifacts/cr022b_v2/**
          if-no-files-found: warn
