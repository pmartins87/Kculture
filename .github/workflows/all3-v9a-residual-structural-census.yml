name: all3-v9a-residual-structural-census
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v9a-residual-structural-census.yml'
      - 'tools/all3_v9a_residual_structural_census.py'
      - 'configs/all3_v6_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v9a_residual_structural_census.py
      - name: Run V9A residual structural census
        run: |
          mkdir -p artifacts/v9a
          python tools/all3_v9a_residual_structural_census.py             --config configs/all3_v6_hard_contexts.json             --out artifacts/v9a/ALL3_V9A_RESIDUAL_STRUCTURAL_CENSUS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v9a-residual-structural-census
          path: artifacts/v9a/*.json
          retention-days: 30
          if-no-files-found: warn
