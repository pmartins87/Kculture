name: cr032-keiz-regime-forensics
on:
  push:
    paths:
      - '.github/workflows/cr032-keiz-regime-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact environment
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -r requirements.txt kagglehub 'kaggle>=2.2.3'
      - name: Syntax check
        run: python -m py_compile tools/cr032_keiz_regime_forensics.py
      - name: Run structural loss-regime forensics
        run: python tools/cr032_keiz_regime_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr032-keiz-regime-forensics
          path: |
            artifacts/cr032_keiz_regime_forensics/report.json
            artifacts/cr032_keiz_regime_forensics/summary.json
          if-no-files-found: warn
          retention-days: 30
