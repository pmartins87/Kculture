name: Prize Solver V0 smoke

on:
  workflow_dispatch:
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - 'solver/**'
      - 'candidates/prize_solver_v0.py'
      - 'tools/prize_solver_v0_smoke.py'
      - '.github/workflows/prize-solver-v0-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 12-game mechanical smoke
        run: python tools/prize_solver_v0_smoke.py
      - name: Upload smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prize-solver-v0-smoke
          path: PRIZE_SOLVER_V0_SMOKE.json
          if-no-files-found: warn
