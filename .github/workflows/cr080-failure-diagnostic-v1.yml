name: CR080 post-failure diagnostic
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr080-failure-diagnostic-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        opponent: [CR071M, CR061, CR065]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'kaggle-environments==1.32.7' numpy
      - uses: actions/download-artifact@v4
        with:
          name: cr080-confirmation-packages-v1
          path: corpus
          run-id: 34655496708
          github-token: ${{ github.token }}
      - name: Frozen CR080 closed-loop telemetry on used confirmation seeds
        run: |
          python tools/cr080_failure_diagnostic.py \
            --cr080 corpus/CR080.tar.gz \
            --opponent 'corpus/${{ matrix.opponent }}.tar.gz' \
            --opponent-id '${{ matrix.opponent }}' \
            --seed-count 32 \
            --master-seed 9112081 \
            --output 'results/CR080_vs_${{ matrix.opponent }}_diagnostic.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr080-failure-diagnostic-${{ matrix.opponent }}
          path: results/*.json
          retention-days: 30
  aggregate:
    if: always()
    needs: diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cr080-failure-diagnostic-*
          path: results
          merge-multiple: true
      - name: Freeze descriptive summary only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = {
              'schema_version': 'cr080-post-failure-diagnostic-aggregate-v1',
              'confirmation_run': 34655496708,
              'diagnostic_only': True,
              'retune_cr080_permitted': False,
              'opponents': {},
          }
          for p in sorted(Path('results').glob('*.json')):
              d = json.loads(p.read_text())
              out['opponents'][d['opponent']] = d['summary']
          Path('summary').mkdir(exist_ok=True)
          Path('summary/diagnosis.json').write_text(json.dumps(out, indent=2, sort_keys=True))
          compact = {}
          for opp, s in out['opponents'].items():
              compact[opp] = {
                  'all': s['all'],
                  'wins': s['wins'],
                  'losses': s['losses'],
              }
          print(json.dumps(compact, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cr080-failure-diagnostic-summary-v1
          path: summary/
          retention-days: 30
