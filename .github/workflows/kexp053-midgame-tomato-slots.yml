name: kexp053-midgame-tomato-slots

on:
  push:
    paths:
      - .github/workflows/kexp053-midgame-tomato-slots.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify identities
        run: |
          test "$(git rev-parse HEAD:tools/audit_midgame_tomato_slots.py)" = "6afc81cd623443b141c291a1f73d72628b7c312c"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Audit physical TOMATO-compatible slots
        run: python tools/audit_midgame_tomato_slots.py --output artifacts/kexp053/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp053-midgame-tomato-slots
          path: artifacts/kexp053/report.json
