name: cr072-public-frontier-corpus-v1
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr072-public-frontier-corpus-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public Kaggle downloader
        run: python -m pip install --upgrade kagglehub
      - name: Download frozen high-score public notebook outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/frontier
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          import kagglehub

          root=Path('artifacts/frontier')
          handles={
            'rayk_v11_2990': 'raykkretzschmar/kaggriculture-rank-your-agent/versions/11',
            'kaito_v13_2882': 'kaitofukami/22-24-unseen-lineages-v41-sparse-closed-loop/versions/13',
            'multiroute_v59_2767': 'flexonafft/kaggriculture-multi-route-farming-agent/versions/59',
            'moon_v11_2736': 'prvsiyan/kaggriculture-frontier-the-moon-counts-melons/versions/11',
            'indar_v1_2686': 'indarkarhana/shape-the-shop-work-the-pasture-top-10/versions/1',
          }
          manifest={'schema_version':'kculture-cr072-public-frontier-corpus-v1','handles':{},'errors':{}}

          def safe_extract(tf: tarfile.TarFile, dest: Path):
              dest=dest.resolve()
              for m in tf.getmembers():
                  target=(dest / m.name).resolve()
                  if not str(target).startswith(str(dest)+os.sep) and target != dest:
                      raise RuntimeError(f'unsafe tar member {m.name}')
              tf.extractall(dest)

          for key,handle in handles.items():
              out=root/key
              out.mkdir(parents=True,exist_ok=True)
              try:
                  p=Path(kagglehub.notebook_output_download(handle, output_dir=str(out), force_download=True))
                  print('DOWNLOADED',key,handle,p,flush=True)
              except Exception as e:
                  manifest['errors'][key]=repr(e)
                  print('DOWNLOAD_ERROR',key,repr(e),flush=True)
                  continue
              # Extract any submission archives, preserving originals.
              for archive in list(out.rglob('*.tar.gz')):
                  dest=archive.parent/(archive.name.replace('.tar.gz','')+'_UNPACKED')
                  dest.mkdir(exist_ok=True)
                  try:
                      with tarfile.open(archive,'r:gz') as tf: safe_extract(tf,dest)
                  except Exception as e:
                      manifest['errors'][f'{key}:{archive.name}:extract']=repr(e)
              files=[]
              for f in sorted(x for x in out.rglob('*') if x.is_file()):
                  b=f.read_bytes()
                  files.append({'path':str(f.relative_to(out)),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              manifest['handles'][key]={'handle':handle,'files':files}
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True))
          print(json.dumps({k:len(v['files']) for k,v in manifest['handles'].items()},indent=2))
          print('errors',json.dumps(manifest['errors'],indent=2))
          if 'rayk_v11_2990' not in manifest['handles']:
              raise SystemExit('Rayk V11 public output is required; collection failed')
          PY
          find artifacts/frontier -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | head -200
      - name: Build source inventory
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('artifacts/frontier')
          rows=[]
          for f in sorted(root.rglob('*.py')):
              text=f.read_text(errors='replace')
              rows.append({
                  'path':str(f.relative_to(root)),
                  'lines':text.count('\n')+1,
                  'bytes':len(text.encode()),
                  'functions':len(re.findall(r'^def\s+\w+',text,re.M)),
                  'classes':len(re.findall(r'^class\s+\w+',text,re.M)),
                  'contains_tape':'_TAPE' in text or 'TAPE' in text,
                  'contains_route':'route' in text.lower(),
                  'contains_market':'market' in text.lower(),
                  'contains_opponent':'opponent' in text.lower() or 'farms[1' in text,
              })
          (root/'SOURCE_INVENTORY.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cr072-public-frontier-corpus-v1
          path: artifacts/frontier/
          retention-days: 30
          if-no-files-found: error
