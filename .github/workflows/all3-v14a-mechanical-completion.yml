name: all3-v14a-mechanical-completion
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v14a-mechanical-completion.yml'
      - 'configs/all3_v14a_mechanical_supplement.json'
      - 'tools/aggregate_all3_v14a_mechanical_completion.py'
      - 'tools/all3_v14a_domain_upper_bound_shard.py'
      - 'configs/all3_v14a_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Download original V14A shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v14a-shard-*
          path: artifacts/original
          run-id: 35525689199
          github-token: ${{ github.token }}
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v14a_domain_upper_bound_shard.py
          python -m py_compile tools/aggregate_all3_v14a_mechanical_completion.py
      - name: Run exact 429 supplement
        run: |
          mkdir -p artifacts/supplement
          python tools/all3_v14a_domain_upper_bound_shard.py             --hard-config configs/all3_v14a_mechanical_supplement.json             --shard-index 0             --num-shards 1             --out artifacts/supplement/V14A_429_SUPPLEMENT.json
      - name: Mechanically complete V14A
        run: |
          mkdir -p artifacts/complete
          python tools/aggregate_all3_v14a_mechanical_completion.py             --original-dir artifacts/original             --supplement artifacts/supplement/V14A_429_SUPPLEMENT.json             --hard-config configs/all3_v14a_hard_contexts.json             --out artifacts/complete/ALL3_V14A_CURRENT_FRONTIER_DOMAIN_UPPER_BOUND_COMPLETE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v14a-mechanical-completion
          path: |
            artifacts/supplement/*.json
            artifacts/complete/*.json
          retention-days: 30
          if-no-files-found: warn
