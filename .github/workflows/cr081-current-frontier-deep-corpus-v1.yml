name: CR081 current frontier deep corpus v1
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr081-current-frontier-deep-corpus-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: umg_current_56169353
            submission: 56169353
            count: 128
          - label: majkel_current_56156662
            submission: 56156662
            count: 64
          - label: ymg_current_56161578
            submission: 56161578
            count: 64
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Require authenticated Kaggle API
        run: test -n "$KAGGLE_API_TOKEN"
      - name: Install Kaggle CLI
        run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Collect newest target episodes
        run: |
          python tools/collect_submission_replays_cli_v2.py \
            --submission '${{ matrix.label }}:${{ matrix.submission }}' \
            --output-dir 'artifacts/${{ matrix.label }}' \
            --max-per-submission '${{ matrix.count }}' \
            --selection newest \
            --retries 6 \
            --delay-seconds 0.5
      - name: Freeze provenance
        if: always()
        run: |
          find 'artifacts/${{ matrix.label }}' -type f -print | sort > 'artifacts/${{ matrix.label }}/FILELIST.txt' || true
          find 'artifacts/${{ matrix.label }}' -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > 'artifacts/${{ matrix.label }}/SHA256SUMS.txt' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr081-${{ matrix.label }}
          path: artifacts/${{ matrix.label }}/**
          retention-days: 30
          if-no-files-found: error
