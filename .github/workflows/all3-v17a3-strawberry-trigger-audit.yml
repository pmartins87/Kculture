name: all3-v17a3-strawberry-trigger-audit
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v17a3-strawberry-trigger-audit.yml'
      - 'tools/all3_v17a3_strawberry_trigger_shard.py'
      - 'tools/aggregate_all3_v17a3_strawberry_trigger.py'
      - 'docs/strategy/ALL3_V17A3_STRAWBERRY_TRIGGER_PROTOCOL_2026-09-20.md'
      - 'configs/all3_v14a_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Download V14B binding artifact
        uses: actions/download-artifact@v4
        with:
          name: all3-v14b-market-phenotype-atlas
          path: artifacts/v14b-source
          run-id: 35526759114
          github-token: ${{ github.token }}
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v17a3_strawberry_trigger_shard.py
          python -m py_compile tools/aggregate_all3_v17a3_strawberry_trigger.py
      - name: Run trigger-audit shard
        run: |
          mkdir -p artifacts/v17a3
          python tools/all3_v17a3_strawberry_trigger_shard.py             --hard-config configs/all3_v14a_hard_contexts.json             --atlas artifacts/v14b-source/ALL3_V14B_MARKET_PHENOTYPE_ATLAS.json             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v17a3/V17A3_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v17a3-shard-${{ matrix.shard_index }}
          path: artifacts/v17a3/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v17a3-shard-*
          path: artifacts/v17a3-shards
          merge-multiple: false
      - name: Aggregate V17A3
        run: |
          mkdir -p artifacts/v17a3-aggregate
          python tools/aggregate_all3_v17a3_strawberry_trigger.py             --input-dir artifacts/v17a3-shards             --out artifacts/v17a3-aggregate/ALL3_V17A3_STRAWBERRY_TRIGGER_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v17a3-strawberry-trigger-audit
          path: artifacts/v17a3-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
