name: cr063-current-public-frontier-refresh
'on':
  push:
    paths:
      - '.github/workflows/cr063-current-public-frontier-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle output client
        run: python -m pip install kagglehub
      - name: Syntax check
        run: python -m py_compile tools/cr063_current_public_frontier_refresh.py
      - name: Fetch current frontier packages
        run: python tools/cr063_current_public_frontier_refresh.py --output-dir artifacts/cr063
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr063-current-public-frontier-refresh
          path: artifacts/cr063/
          retention-days: 30
          if-no-files-found: warn
