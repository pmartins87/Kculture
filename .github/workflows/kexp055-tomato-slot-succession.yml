name: kexp055-tomato-slot-succession

on:
  push:
    paths:
      - .github/workflows/kexp055-tomato-slot-succession.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:tools/audit_tomato_slot_succession.py)" = "$(git rev-parse HEAD:tools/audit_tomato_slot_succession.py)"
      - name: Audit TOMATO-compatible slot succession
        run: python tools/audit_tomato_slot_succession.py --output artifacts/kexp055/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp055-tomato-slot-succession
          path: artifacts/kexp055/report.json
