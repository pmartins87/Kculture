name: cr028-top3000-lineage
on:
  push:
    paths:
      - '.github/workflows/cr028-top3000-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data dependencies
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install kagglehub pandas
      - name: Mine rating>=3000 public lineages
        run: |
          python tools/cr028_top3000_lineage_miner.py \
            --rating-min 3000 \
            --output artifacts/cr028_lineage/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr028-top3000-lineage
          path: artifacts/cr028_lineage/report.json
          if-no-files-found: error
          retention-days: 30
