name: v31a-v30b-second-slot-complementarity
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v31a-v30b-second-slot-complementarity.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install acquisition runtime
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'kagglehub>=0.3.12' 'kaggle-environments==1.32.7'
      - name: Recover exact historical V47 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v47_public_output artifacts/v31a-v47
          python - <<'PY'
          import hashlib,shutil,tarfile
          from pathlib import Path
          import kagglehub
          expected_archive="08e56c43ecf28253605b61066dd769334d96262056b8cd337489f1f4f909ad01"
          expected_main="f4ecd4876fde93a14e3381993283f3b6a1afa023b48dd57217f4d90794d39842"
          handle="ahmedberatozer/kaggriculture-v47-reactive-market-coordination"
          out=Path("v47_public_output")
          kagglehub.notebook_output_download(handle,output_dir=str(out),force_download=True)
          hits=[]
          for p in sorted(out.rglob("*")):
              if not p.is_file() or not p.name.lower().endswith((".tar.gz",".tgz",".tar")): continue
              try:
                  ah=hashlib.sha256(p.read_bytes()).hexdigest()
                  with tarfile.open(p,"r:*") as tf:
                      names=sorted(m.name for m in tf.getmembers() if m.isfile())
                      if names!=["main.py"]: continue
                      data=tf.extractfile("main.py").read()
              except Exception:
                  continue
              mh=hashlib.sha256(data).hexdigest()
              if ah==expected_archive and mh==expected_main: hits.append((p,data))
          if len(hits)!=1: raise SystemExit(f"expected one exact V47 archive, got {len(hits)}")
          Path("artifacts/v31a-v47/main.py").write_bytes(hits[0][1])
          print({"archive":str(hits[0][0]),"archive_sha":expected_archive,"main_sha":expected_main})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v31a-exact-v47
          path: artifacts/v31a-v47/main.py
          retention-days: 30

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'kagglehub>=0.3.12' 'kaggle-environments==1.32.7'
      - uses: actions/download-artifact@v4
        with:
          name: v30a-immutable-public-policy-snapshot
          path: artifacts/v30a-snapshot
          repository: pmartins87/Kculture
          run-id: 35877442921
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v30b-binding-frontier
          path: artifacts/v30b-frontier
          repository: pmartins87/Kculture
          run-id: 35906418993
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: v30b-binding-shard-*
          path: artifacts/v30b-binding-shards
          merge-multiple: false
          repository: pmartins87/Kculture
          run-id: 35906418993
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v31a-exact-v47
          path: artifacts/v31a-v47
      - name: Run frozen V31A shard
        shell: bash
        run: |
          set -euo pipefail
          for k in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY; do unset "$k" || true; done
          mkdir -p artifacts/v31a
          python tools/v31a_second_slot_complementarity_shard.py             --v30a-snapshot artifacts/v30a-snapshot             --frontier artifacts/v30b-frontier             --binding-shards artifacts/v30b-binding-shards             --v47-main artifacts/v31a-v47/main.py             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v31a/V31A_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31a-shard-${{ matrix.shard_index }}
          path: artifacts/v31a/*.json
          retention-days: 30

  aggregate:
    needs: [prepare,shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/download-artifact@v4
        with:
          pattern: v31a-shard-*
          path: artifacts/v31a-shards
          merge-multiple: false
      - name: Aggregate V31A
        run: |
          set -euo pipefail
          mkdir -p artifacts/v31a-final
          python tools/aggregate_v31a_second_slot_complementarity.py             --input-dir artifacts/v31a-shards             --out artifacts/v31a-final/V31A_SECOND_SLOT_COMPLEMENTARITY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31a-second-slot-complementarity
          path: artifacts/v31a-final/*.json
          retention-days: 30
          if-no-files-found: error
