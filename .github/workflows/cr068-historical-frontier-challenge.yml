name: cr068-historical-frontier-challenge
'on':
  push:
    paths:
      - '.github/workflows/cr068-historical-frontier-challenge.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download CR062 exact historical sources
        uses: actions/download-artifact@v4
        with:
          name: cr062-public-frontier-audit
          path: artifacts/source
          run-id: 34136552163
          github-token: ${{ github.token }}
      - name: Build mechanical seat-safe packages
        run: |
          python -m py_compile tools/cr068_historical_frontier_seatsafe.py
          python tools/cr068_historical_frontier_seatsafe.py \
            --source-dir artifacts/source \
            --output-dir artifacts/cr068
      - uses: actions/upload-artifact@v4
        with:
          name: cr068-historical-frontier-seatsafe
          path: artifacts/cr068/
          retention-days: 30
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {a: cr053, b: cr068a, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz}
          - {a: cr053, b: cr068b, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz}
          - {a: cr065, b: cr068a, afile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz, bfile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz}
          - {a: cr065, b: cr068b, afile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz, bfile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz}
          - {a: cr068a, b: cr068b, afile: R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz, bfile: R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install simulator
        run: |
          python -m pip install numpy pybind11
          python -m pip install 'git+https://github.com/destbreso/kaggriculture-cppsim@main'
      - name: Download CR053
        uses: actions/download-artifact@v4
        with:
          name: cr052-cr053-hosted-candidates
          path: artifacts/cr053
          run-id: 34105008373
          github-token: ${{ github.token }}
      - name: Download CR065
        uses: actions/download-artifact@v4
        with:
          name: cr064-cr066-current-frontier-seatsafe
          path: artifacts/current
          run-id: 34160996911
          github-token: ${{ github.token }}
      - name: Download CR068 build
        uses: actions/download-artifact@v4
        with:
          name: cr068-historical-frontier-seatsafe
          path: artifacts/historical
      - name: Resolve packages
        run: |
          A=$(find artifacts -name '${{ matrix.afile }}' -print -quit)
          B=$(find artifacts -name '${{ matrix.bfile }}' -print -quit)
          test -n "$A"; test -n "$B"
          echo "A_PATH=$A" >> "$GITHUB_ENV"
          echo "B_PATH=$B" >> "$GITHUB_ENV"
      - name: Common-seed both-seat smoke
        run: |
          mkdir -p artifacts/results
          python tools/cr058_broad_live_agent_league.py \
            --a "$A_PATH" --b "$B_PATH" \
            --a-id '${{ matrix.a }}' --b-id '${{ matrix.b }}' \
            --output 'artifacts/results/${{ matrix.a }}_vs_${{ matrix.b }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr068-${{ matrix.a }}-vs-${{ matrix.b }}
          path: artifacts/results/*.json
          retention-days: 30
          if-no-files-found: warn
