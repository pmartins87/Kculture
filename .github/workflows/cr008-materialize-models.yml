name: cr008-materialize-models
on:
  push:
    paths:
      - '.github/workflows/cr008-materialize-models.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install kagglehub scikit-learn kaggle-environments
      - name: Regenerate exact frozen trees
        run: |
          mkdir -p models
          python tools/export_cr007_pure_models.py --top 20 --output models/cr007_pure_models.json
          echo '6f12e86d0b19c5ba39c2ab4131e186ea14b49f42cc33b33a2ad895fab55783bb  models/cr007_pure_models.json' | sha256sum -c -
      - name: Commit deterministic model file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git add models/cr007_pure_models.json
          if git diff --cached --quiet; then
            echo 'Model already materialized identically.'
          else
            git commit -m 'Add frozen CR-007 adaptive trees'
            git push origin HEAD:main
          fi
