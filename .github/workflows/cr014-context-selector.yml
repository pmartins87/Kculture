name: cr014-context-selector
on:
  push:
    paths:
      - '.github/workflows/cr014-context-selector.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub scikit-learn
      - name: Fetch frozen base dependencies
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen local identities
        run: |
          test "$(git rev-parse HEAD:candidates/cr011_adaptive_early_order.py)" = "c4f1cb79f3c20b8229ab09e00a6878289cf9648d"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Run CR-014
        run: python tools/run_cr014_context_selector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr014-context-selector
          path: artifacts/cr014/**
