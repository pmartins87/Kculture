name: Prize Solver PS2 Ryzen runner smoke

on:
  workflow_dispatch:
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - 'tools/prize_solver_rollout_ryzen.py'
      - 'solver/prize_solver_v4.py'
      - 'solver/rollout_search.py'
      - 'solver/value_features.py'
      - '.github/workflows/prize-solver-ps2-runner-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tiny resumable PS2 batch
        run: |
          python tools/prize_solver_rollout_ryzen.py \
            --out runs/ps2_runner_smoke \
            --seed-count 2 \
            --branch-days 6,12 \
            --force-days 3 \
            --workers 2
      - name: Verify summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/ps2_runner_smoke/SUMMARY.json')
          d=json.loads(p.read_text())
          assert d['branch_states'] == 4, d
          assert d['rollouts'] == 20, d
          assert not d['failures'], d['failures']
          print('PS2_RUNNER_SMOKE_PASS', {'states':d['branch_states'],'rollouts':d['rollouts'],'mean_regret':d['mean_heuristic_regret']})
          PY
      - name: Upload smoke output
        uses: actions/upload-artifact@v4
        with:
          name: prize-solver-ps2-runner-smoke
          path: runs/ps2_runner_smoke
          if-no-files-found: error
