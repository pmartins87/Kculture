name: debug-current-kaggle-submissions
on:
  push:
    paths:
      - '.github/workflows/debug-current-kaggle-submissions.yml'
  workflow_dispatch:

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install -U 'kaggle>=2.2.1'
      - name: Submission limits
        run: kaggle competitions submission-limits kaggriculture --json || true
      - name: Current submissions JSON
        run: kaggle competitions submissions kaggriculture --json || true
