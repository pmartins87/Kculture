name: CR084 frozen promotion v1
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr084-promotion-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {a: CR084, b: CR083}
          - {a: CR084, b: CR071M}
          - {a: CR084, b: CR053}
          - {a: CR084, b: CR061}
          - {a: CR084, b: CR065}
          - {a: CR083, b: CR071M}
          - {a: CR083, b: CR053}
          - {a: CR083, b: CR061}
          - {a: CR083, b: CR065}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'kaggle-environments==1.32.7' numpy
      - name: Download exact Gate-A frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: cr084-corrected-gate-a-v1
          path: gate_a
          run-id: 34758074656
          github-token: ${{ github.token }}
      - name: Verify exact frozen CR084 and firewall
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum gate_a/corpus/CR084.tar.gz | awk '{print $1}')" = "3aa08bb2ee163d1707dbf0bf9d2cb4b6f8c194fa2dbd715c38a67a4a41d414a2"
          test "$(sha256sum gate_a/corpus/CR083.tar.gz | awk '{print $1}')" = "648fbcdb370f7e48fafda18a1112c5f1b57a17a81b7191f010fe4058f41a41b8"
          python - <<'PY'
          import json
          d=json.load(open('gate_a/result/gate_a.json'))
          assert d['pass'] is True and d['decision']=='ELIGIBLE_FOR_FROZEN_PROMOTION_PANEL',d
          f=json.load(open('gate_a/build/SEED_FIREWALL.json'))
          assert f['promotion_master']==9140842 and f['all_overlaps_zero'] is True,f
          print('Frozen CR084 promotion input verified')
          PY
      - name: Fresh frozen promotion row
        run: |
          mkdir -p results
          python tools/kaggle_reference_h2h_v2.py \
            --a 'gate_a/corpus/${{ matrix.a }}.tar.gz' \
            --b 'gate_a/corpus/${{ matrix.b }}.tar.gz' \
            --a-id '${{ matrix.a }}' --b-id '${{ matrix.b }}' \
            --seed-count 32 --master-seed 9140842 \
            --output 'results/${{ matrix.a }}_vs_${{ matrix.b }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr084-promo-${{ matrix.a }}-vs-${{ matrix.b }}
          path: results/*.json
          retention-days: 30

  aggregate:
    needs: promotion
    if: always() && needs.promotion.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/download-artifact@v4
        with:
          pattern: cr084-promo-*
          path: results
          merge-multiple: true
      - name: Apply pre-frozen CR084 promotion gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          games={}
          for p in Path('results').rglob('*.json'):
            d=json.loads(p.read_text())
            if 'metrics_a_vs_b' in d: games[(d['a'],d['b'])]=d
          guards=['CR071M','CR053','CR061','CR065']
          required=[('CR084','CR083')]+[('CR084',o) for o in guards]+[('CR083',o) for o in guards]
          missing=[list(x) for x in required if x not in games]
          checks={'complete_panel':not missing}
          out={'schema_version':'cr084-promotion-gate-v1','master_seed':9140842,'seed_count':32,'candidate_sha256':'3aa08bb2ee163d1707dbf0bf9d2cb4b6f8c194fa2dbd715c38a67a4a41d414a2','missing':missing}
          if not missing:
            checks['all_64_games_32_fresh_seeds']=all(games[x]['metrics_a_vs_b']['games']==64 and games[x]['seed_count']==32 and games[x]['master_seed']==9140842 for x in required)
            checks['no_errors_or_non_done']=all(not games[x]['errors'] and games[x]['metrics_a_vs_b']['non_done_games']==0 for x in required)
            rate=lambda a,b:games[(a,b)]['metrics_a_vs_b']['score_rate']
            direct=games[('CR084','CR083')]['metrics_a_vs_b']
            delta={o:rate('CR084',o)-rate('CR083',o) for o in guards}
            checks['direct_at_least_0_5625']=direct.get('score_rate',0)>=0.5625
            checks['direct_mean_margin_positive']=direct.get('mean_margin_secondary',0)>0
            checks['aggregate_guardrail_delta_nonnegative']=sum(delta.values())>=0
            checks['each_guardrail_delta_at_least_minus_0_0625']=min(delta.values())>=-0.0625
            out['guardrail_deltas']=delta
            out['rows']=[{'a':x[0],'b':x[1],**games[x]['metrics_a_vs_b']} for x in required]
          out['checks']=checks
          out['pass']=all(checks.values())
          out['decision']='ELIGIBLE_FOR_INDEPENDENT_HIGH_STRENGTH_PROXY_ONLY' if out['pass'] else 'CLOSE_CR084_CRITICAL_FEED_RESCUE'
          Path('summary').mkdir(exist_ok=True)
          Path('summary/gate.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cr084-promotion-gate-v1
          path: summary/
          retention-days: 30
