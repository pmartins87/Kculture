name: CR082 state-adaptive 1NN confirmation v1
# Trigger commit after first registration on the branch.
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr082-state-adaptive-confirm-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: cr082-majkel-fresh-gate-a-v2-strict-forward
          path: source/gate_a
          run-id: 34694852503
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cr081-majkel_current_56156662
          path: source/majkel
          run-id: 34669006417
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cr080-confirmation-packages-v1
          path: source/anchors
          run-id: 34655496708
          github-token: ${{ github.token }}
      - name: Verify strict-forward Gate A evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('source/gate_a/gate_a.json')
          assert p.exists(), list(Path('source/gate_a').rglob('*'))
          d=json.loads(p.read_text())
          assert d['schema_version']=='cr082-fresh-gate-a-v2-strict-forward', d
          assert d['pass'] is True, d
          assert d['decision']=='ELIGIBLE_TO_BUILD_ONE_CR082_CANDIDATE', d
          assert d['strictly_forward_episodes']>=24, d
          assert d['exact_delta']>=0.03, d
          assert d['semantic_delta']>=0.03, d
          assert d['old_episodes']==64, d
          assert d['frozen_development_episodes']==48, d
          assert d['v1_loose_filter_result_invalid_for_promotion'] is True, d
          assert d['hypothesis_forming_old_holdout_reused_for_training'] is False, d
          print('CR082 strict-forward Gate A PASS verified')
          PY
      - name: Build single frozen CR082 candidate
        run: |
          mkdir -p corpus build
          python tools/cr082_build_state_adaptive.py \
            --majkel-root source/majkel \
            --cr071m source/anchors/CR071M.tar.gz \
            --output corpus/CR082.tar.gz \
            --manifest build/CANDIDATE_MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/CANDIDATE_MANIFEST.json').read_text())
          assert d['schema_version']=='cr082-state-adaptive-1nn-v1-frozen', d
          assert d['runtime_market_window']==[0,287], d
          assert d['teacher_total_original_episodes']==64, d
          assert d['teacher_development_episodes']==48, d
          assert d['feature_dimension']==41, d
          assert d['distance']=='euclidean_zscore', d
          assert d['k']==1, d
          assert d['teacher_newest_16_not_used_in_build'] is True, d
          assert d['room_guard_retained_in_prefix'] is True, d
          assert d['clamp_sells_retained_in_prefix'] is True, d
          assert d['same_turn_buy_product_funds_later_sell_in_prefix'] is True, d
          assert d['cr053_counter_disabled_in_prefix'] is True, d
          assert d['dead_stock_disabled_in_prefix'] is True, d
          assert d['farmer_hands_source']=='CR071M same-step unchanged', d
          for k in ['identity_features','episode_id_feature','seed_feature','future_state_feature','opponent_private_feature','replay_continuation']:
              assert d[k] is False, (k,d[k])
          a=d['self_audit']
          assert a['source_strategic_isolation_pass'] is True, a
          assert a['runtime_policy_equivalence_queries']==2304 and a['runtime_policy_equivalence_mismatches']==0, a
          assert a['physical_backbone_equivalence_queries']==1440 and a['physical_backbone_equivalence_mismatches']==0, a
          print('CR082 frozen candidate manifest/self-audit PASS')
          PY
      - name: Rebuild to prove package determinism
        run: |
          python tools/cr082_build_state_adaptive.py \
            --majkel-root source/majkel \
            --cr071m source/anchors/CR071M.tar.gz \
            --output build/CR082_REBUILD.tar.gz \
            --manifest build/REBUILD_MANIFEST.json
          cmp corpus/CR082.tar.gz build/CR082_REBUILD.tar.gz
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=hashlib.sha256(Path('corpus/CR082.tar.gz').read_bytes()).hexdigest()
          b=hashlib.sha256(Path('build/CR082_REBUILD.tar.gz').read_bytes()).hexdigest()
          assert a==b,(a,b)
          m1=json.loads(Path('build/CANDIDATE_MANIFEST.json').read_text())
          m2=json.loads(Path('build/REBUILD_MANIFEST.json').read_text())
          assert m1['candidate_sha256']==m2['candidate_sha256']==a,(m1['candidate_sha256'],m2['candidate_sha256'],a)
          print('CR082 deterministic rebuild PASS',a)
          PY
      - name: Freeze anchors and fresh-seed firewall
        run: |
          cp source/anchors/CR071M.tar.gz corpus/CR071M.tar.gz
          cp source/anchors/CR053.tar.gz corpus/CR053.tar.gz
          cp source/anchors/CR061.tar.gz corpus/CR061.tar.gz
          cp source/anchors/CR065.tar.gz corpus/CR065.tar.gz
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from kaggle_exact_runtime import make_seeds
          prior=json.loads(Path('experiments/CR080_MENGFEI_BRIDGE_2026-09-11/seed_firewall.json').read_text())
          masters=[]
          masters.extend(prior.get('earlier_masters_checked',[]))
          if prior.get('master_seed') is not None: masters.append(prior['master_seed'])
          masters.extend([9112080,9112081,9120811,9120812,9120813])
          masters=list(dict.fromkeys(int(x) for x in masters))
          used=set()
          for master in masters:
              used.update(make_seeds(512,master))
          fresh=make_seeds(32,9120821)
          overlap=sorted(used & set(fresh))
          assert not overlap, f'Seed overlap: {overlap}'
          Path('corpus/seed_firewall.json').write_text(json.dumps({
              'master_seed':9120821,
              'seeds':fresh,
              'earlier_masters':masters,
              'overlap':overlap,
          },indent=2))
          print('CR082 fresh seed firewall PASS:',len(fresh))
          PY
          sha256sum corpus/*.tar.gz > corpus/SHA256SUMS.txt
          cp source/gate_a/gate_a.json corpus/GATE_A.json
          cp build/CANDIDATE_MANIFEST.json corpus/CANDIDATE_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: cr082-confirmation-packages-v1-frozen
          path: corpus/
          retention-days: 30
  h2h:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {a: CR082, b: CR071M}
          - {a: CR082, b: CR053}
          - {a: CR082, b: CR061}
          - {a: CR082, b: CR065}
          - {a: CR071M, b: CR053}
          - {a: CR071M, b: CR061}
          - {a: CR071M, b: CR065}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'kaggle-environments==1.32.7' numpy
      - uses: actions/download-artifact@v4
        with:
          name: cr082-confirmation-packages-v1-frozen
          path: corpus
      - name: Exact reference, frozen CR082 candidate, both seats
        run: |
          python tools/kaggle_reference_h2h_v2.py \
            --a 'corpus/${{ matrix.a }}.tar.gz' \
            --b 'corpus/${{ matrix.b }}.tar.gz' \
            --a-id '${{ matrix.a }}' \
            --b-id '${{ matrix.b }}' \
            --seed-count 32 \
            --master-seed 9120821 \
            --output 'results/${{ matrix.a }}_vs_${{ matrix.b }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr082-confirm-${{ matrix.a }}-vs-${{ matrix.b }}
          path: results/*.json
          retention-days: 30
  aggregate:
    if: always()
    needs: h2h
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/download-artifact@v4
        with:
          pattern: cr082-confirm-*
          path: results
          merge-multiple: true
      - run: python tools/cr082_confirm_gate.py --results results --output summary/gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: cr082-confirmation-gate-v1-frozen
          path: summary/
          retention-days: 30
