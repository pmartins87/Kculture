name: v28b-fresh-final-slot-benchmark

'on':
  push:
    branches: [research/prize-solver-v0]
    paths:
      - '.github/workflows/v28b-fresh-final-slot-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      decision: ${{ steps.read.outputs.decision }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Run V28B current-frontier snapshot
        id: snap
        continue-on-error: true
        run: |
          python tools/v28b_current_frontier_snapshot.py \
            --out artifacts/v28b-snapshot-result/V28B_SNAPSHOT_RESULT.json \
            --raw artifacts/v28b-snapshot-result/TOP30_RAW.csv \
            --snapshot-dir artifacts/v28b-snapshot
      - name: Read snapshot decision
        id: read
        if: always()
        run: |
          python - <<'PY'
          import json,os
          p='artifacts/v28b-snapshot-result/V28B_SNAPSHOT_RESULT.json'
          d='V28B_NO_RESULT'
          if os.path.exists(p):
              d=json.load(open(p))['decision']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"decision={d}\n")
          print("V28B_SNAPSHOT_WORKFLOW_DECISION",d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28b-frontier-snapshot-result
          path: artifacts/v28b-snapshot-result/*
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28b-frontier-immutable-snapshot
          path: artifacts/v28b-snapshot/**
          retention-days: 7
          if-no-files-found: warn
      - name: Fail if snapshot invalid
        if: steps.snap.outcome != 'success'
        run: exit 2

  shard:
    needs: snapshot
    if: needs.snapshot.outputs.decision == 'V28B_FRONTIER_SNAPSHOT_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' numpy
      - uses: actions/download-artifact@v4
        with:
          name: v28b-frontier-immutable-snapshot
          path: artifacts/v28b-snapshot
      - name: Run V28B benchmark shard
        run: |
          mkdir -p artifacts/v28b
          python tools/v28b_final_slot_benchmark_shard.py \
            --snapshot-dir artifacts/v28b-snapshot \
            --shard-index ${{ matrix.shard_index }} \
            --num-shards 4 \
            --out artifacts/v28b/V28B_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28b-shard-${{ matrix.shard_index }}
          path: artifacts/v28b/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: [snapshot,shard]
    if: needs.snapshot.outputs.decision == 'V28B_FRONTIER_SNAPSHOT_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v28b-shard-*
          path: artifacts/v28b-shards
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: v28b-frontier-snapshot-result
          path: artifacts/v28b-snapshot-result
      - name: Aggregate V28B
        run: |
          mkdir -p artifacts/v28b-final
          python tools/aggregate_v28b_final_slot_benchmark.py \
            --input-dir artifacts/v28b-shards \
            --snapshot-result artifacts/v28b-snapshot-result/V28B_SNAPSHOT_RESULT.json \
            --out artifacts/v28b-final/V28B_FRESH_FINAL_SLOT_BENCHMARK.json
      - uses: actions/upload-artifact@v4
        with:
          name: v28b-fresh-final-slot-benchmark
          path: artifacts/v28b-final/*.json
          retention-days: 30
          if-no-files-found: error
