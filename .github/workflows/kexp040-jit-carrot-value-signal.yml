name: kexp040-jit-carrot-value-signal

on:
  push:
    paths:
      - .github/workflows/kexp040-jit-carrot-value-signal.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen diagnostic and base
        run: |
          test "$(git rev-parse HEAD:tools/audit_jit_carrot_value_signal.py)" = "71c3db1dcb9dfd0264087fe37de3d41e59b8d3d9"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Audit one-step JIT crop value signal
        run: python tools/audit_jit_carrot_value_signal.py --output artifacts/kexp040/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp040-jit-carrot-value-signal
          path: artifacts/kexp040/**
