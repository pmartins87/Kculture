name: v48-market-upper-bound-v4b
'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/v48_market_upper_bound_v4b.py
      - name: Run V48 long-horizon market upper bound
        run: |
          mkdir -p artifacts/v48-market-upper-bound-v4b
          python tools/v48_market_upper_bound_v4b.py \
            --out artifacts/v48-market-upper-bound-v4b/V48_MARKET_UPPER_BOUND_V4B.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v48-market-upper-bound-v4b
          path: artifacts/v48-market-upper-bound-v4b/*.json
          retention-days: 30
          if-no-files-found: warn
