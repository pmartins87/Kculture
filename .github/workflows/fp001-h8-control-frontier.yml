name: FP001 H8 control frontier

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-principles-economy-v1
    paths:
      - 'tools/fp001_h8_control_frontier.py'
      - 'tools/fp001_h8_animal_fertilizer_economics.py'
      - '.github/workflows/fp001-h8-control-frontier.yml'
      - 'requirements.txt'

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Kaggriculture environment
        run: pip install -r requirements.txt
      - name: Run H8 exact control frontier
        working-directory: tools
        run: python fp001_h8_control_frontier.py
