name: cr012-cr011-effect-attribution
on:
  push:
    paths:
      - '.github/workflows/cr012-cr011-effect-attribution.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen R4B dependencies
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:candidates/cr011_adaptive_early_order.py)" = "c4f1cb79f3c20b8229ab09e00a6878289cf9648d"
          test "$(git rev-parse HEAD:candidates/cr008_adaptive_frontrun.py)" = "8e1c26202c3101c19668bf61edf2ae51d4329d5d"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:configs/cr011_fresh_exploratory_seeds_v1.json)" = "1833dcc168da09b39c95fd4a734d97a4845a36db"
      - name: Fetch exact current-meta opponents
        run: |
          python tools/fetch_exact_package_main.py --handle kaitofukami/103-128-fresh-public-v43-sparse-shop-hybrid/versions/13 --output artifacts/cr012/opponents/kaito/main.py --receipt artifacts/cr012/opponents/kaito/receipt.json
          python tools/fetch_exact_package_main.py --handle prvsiyan/kaggriculture-frontier-the-soil-remembers-rain/versions/10 --output artifacts/cr012/opponents/prvsiyan/main.py --receipt artifacts/cr012/opponents/prvsiyan/receipt.json
          python tools/fetch_exact_package_main.py --handle web3cainiao/kaggriculture-v21-tactical-memory/versions/1 --output artifacts/cr012/opponents/tactical/main.py --receipt artifacts/cr012/opponents/tactical/receipt.json
          python tools/fetch_exact_package_main.py --handle andrewsokolovsky/kaggriculture/versions/11 --output artifacts/cr012/opponents/andrew/main.py --receipt artifacts/cr012/opponents/andrew/receipt.json
      - name: Attribute CR-011 effects
        run: |
          python tools/cr012_cr011_effect_attribution.py \
            --opponent artifacts/cr012/opponents/kaito/main.py \
            --opponent artifacts/cr012/opponents/prvsiyan/main.py \
            --opponent artifacts/cr012/opponents/tactical/main.py \
            --opponent artifacts/cr012/opponents/andrew/main.py \
            --output artifacts/cr012/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr012-cr011-effect-attribution
          path: artifacts/cr012/**
