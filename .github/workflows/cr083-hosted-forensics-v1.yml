name: CR083 hosted forensics v1 read-only
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr083-hosted-forensics-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TARGET_SUBMISSION: '56199767'
      TARGET_TEAM_NAME: 'Paulo Martins'
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: test -n "$KAGGLE_API_TOKEN"
      - run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Freeze target public episode ids
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hosted_forensics/replays
          kaggle competitions episodes "$TARGET_SUBMISSION" -v -q | tee hosted_forensics/episodes.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('hosted_forensics/episodes.csv')
          rows=list(csv.DictReader(p.read_text().splitlines()))
          ids=[]
          for r in rows:
              if 'PUBLIC' in str(r.get('type','')) and str(r.get('state','')).endswith('COMPLETED'):
                  ids.append(str(r['id']))
          Path('hosted_forensics/public_episode_ids.txt').write_text('\n'.join(ids)+'\n')
          print('public_completed_episode_ids=',len(ids))
          PY
      - name: Download public replays read-only
        shell: bash
        run: |
          set -u
          ok=0; fail=0
          while read -r eid; do
            [ -n "$eid" ] || continue
            mkdir -p "hosted_forensics/replays/$eid"
            if kaggle competitions replay "$eid" -p "hosted_forensics/replays/$eid" -q; then
              ok=$((ok+1))
            else
              echo "$eid" >> hosted_forensics/replay_failures.txt
              fail=$((fail+1))
            fi
            sleep 0.10
          done < hosted_forensics/public_episode_ids.txt
          echo "replay_download_ok=$ok replay_download_fail=$fail"
      - name: Summarize target rewards and opponent mix
        shell: bash
        run: |
          set -euo pipefail
          python tools/cr083_hosted_forensics.py \
            --replay-root hosted_forensics/replays \
            --target-team-name "$TARGET_TEAM_NAME" \
            --target-submission "$TARGET_SUBMISSION" \
            --output hosted_forensics/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr083-hosted-forensics-v2-teamname
          path: hosted_forensics/**
          retention-days: 30
