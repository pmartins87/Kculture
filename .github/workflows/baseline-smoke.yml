name: local-lab-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen environment
        run: python -m pip install -r requirements.txt

      - name: Verify starter parity and 720-turn completion
        run: python tools/smoke_baseline.py

      - name: Exercise deterministic episode logger
        run: python tools/run_episode.py --agent0 main:agent --agent1 starter --seed 505

      - name: Exercise seed-and-seat tournament harness
        run: python tools/run_tournament.py --candidate main:agent --opponents pass starter --seeds 501 502

      - name: Preserve lab smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-lab-smoke
          path: |
            artifacts/baseline_smoke.json
            artifacts/episodes/**/summary.json
            artifacts/tournaments/**/tournament.json
