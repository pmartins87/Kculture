name: local-lab-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen environment
        run: python -m pip install -r requirements.txt

      - name: Verify starter parity and 720-turn completion
        run: python tools/smoke_baseline.py

      - name: Validate R2 seed, pool, and provenance configs
        run: python tools/validate_r2_configs.py

      - name: Exercise fresh-module episode logger
        run: python tools/run_episode.py --agent0 file:main.py:agent --agent1 starter --seed 505

      - name: Exercise frozen reference opponent pool
        run: python tools/run_tournament.py --candidate file:main.py:agent --opponent-pool configs/opponent_pool.json --seed-partition development --limit-seeds 1

      - name: Fetch hash-pinned public opponents
        run: python tools/fetch_public_opponents.py

      - name: Exercise strong public benchmark from both seats
        run: python tools/run_tournament.py --candidate file:main.py:agent --opponents file:artifacts/public_opponents/cok_v8_779caae.py:agent --seed-partition development --limit-seeds 1

      - name: Preserve lab smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-lab-smoke
          path: |
            artifacts/baseline_smoke.json
            artifacts/episodes/**/summary.json
            artifacts/tournaments/**/tournament.json
            artifacts/public_opponents/fetch_receipt.json
