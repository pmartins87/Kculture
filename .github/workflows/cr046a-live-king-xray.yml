name: cr046a-live-king-xray
'on':
  push:
    paths:
      - '.github/workflows/cr046a-live-king-xray.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependency
        run: python -m pip install requests
      - name: Syntax check
        run: python -m py_compile tools/cr046_live_king_xray.py
      - name: X-ray current live king
        run: python tools/cr046_live_king_xray.py --max-episodes 40 --output artifacts/cr046a/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr046a-live-king-xray
          path: artifacts/cr046a/report.json
          if-no-files-found: warn
          retention-days: 30
