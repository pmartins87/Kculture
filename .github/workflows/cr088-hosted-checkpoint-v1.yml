name: CR088 hosted checkpoint v1 read-only
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr088-hosted-checkpoint-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: kaggriculture
      CR086_ID: '56220184'
      CR083_ID: '56199767'
      CR053_ID: '56073870'
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: test -n "$KAGGLE_API_TOKEN"
      - run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Read-only submissions, quota metadata, and CR086 maturity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint
          kaggle competitions submissions "$COMPETITION" -v -q | tee checkpoint/own_submissions.csv
          kaggle competitions episodes "$CR086_ID" -v -q > checkpoint/cr086_episodes.csv || true
          python - <<'PY' | tee checkpoint/checkpoint.json
          import csv, io, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def csv_rows(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace') if Path(path).exists() else ''
              lines = [line for line in text.splitlines() if line.strip()]
              for i, line in enumerate(lines):
                  if ',' not in line:
                      continue
                  try:
                      rows = list(csv.DictReader(io.StringIO('\n'.join(lines[i:]))))
                  except Exception:
                      continue
                  if rows and any(key and ('ref' in key.lower() or 'date' in key.lower() or 'episode' in key.lower()) for key in rows[0]):
                      return rows
              return []

          submissions = csv_rows('checkpoint/own_submissions.csv')
          episodes = csv_rows('checkpoint/cr086_episodes.csv')
          today = datetime.now(timezone.utc).date().isoformat()

          def get(row, *needles):
              for key, value in row.items():
                  low = (key or '').lower()
                  if any(n in low for n in needles):
                      return value
              return None

          submitted_today = []
          selected = {}
          targets = {
              'CR086': os.environ['CR086_ID'],
              'CR083': os.environ['CR083_ID'],
              'CR053': os.environ['CR053_ID'],
          }
          for row in submissions:
              date = get(row, 'date') or ''
              if date.startswith(today):
                  submitted_today.append(row)
              ref = str(get(row, 'ref') or '')
              for label, target in targets.items():
                  if ref == target:
                      selected[label] = row

          metadata = {}
          try:
              from kaggle.api.kaggle_api_extended import KaggleApi
              api = KaggleApi()
              api.authenticate()
              comp = api.competition_view(os.environ['COMPETITION'])
              for name in dir(comp):
                  low = name.lower()
                  if name.startswith('_') or not any(k in low for k in ('submission', 'daily', 'limit', 'deadline', 'enabled')):
                      continue
                  try:
                      value = getattr(comp, name)
                  except Exception:
                      continue
                  if not callable(value) and isinstance(value, (str, int, float, bool, type(None))):
                      metadata[name] = value
          except Exception as exc:
              metadata['competition_view_error'] = repr(exc)

          out = {
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'today_utc': today,
              'submission_rows_total': len(submissions),
              'submissions_today_utc': len(submitted_today),
              'submitted_today': submitted_today,
              'selected_submissions': selected,
              'cr086_episode_rows': len(episodes),
              'competition_metadata': metadata,
              'read_only': True,
          }
          print(json.dumps(out, indent=2, sort_keys=True, default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr088-hosted-checkpoint-v1
          path: checkpoint/**
          retention-days: 30
          if-no-files-found: error
