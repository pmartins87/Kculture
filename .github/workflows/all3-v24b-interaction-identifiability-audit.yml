name: all3-v24b-interaction-identifiability-audit

'on':
  push:
    branches: [research/prize-solver-v0]
    paths:
      - '.github/workflows/all3-v24b-interaction-identifiability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' numpy
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35641081142
          name: all3-v24a-coupled-divergence-trace
          path: artifacts/v24a
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35627972979
          name: all3-v23-config
          path: artifacts/v23-config
      - name: Run V24B identifiability audit
        run: |
          mkdir -p artifacts/v24b
          python tools/audit_v24b_interaction_identifiability.py \
            --v24a artifacts/v24a/ALL3_V24A_COUPLED_DIVERGENCE_TRACE.json \
            --hard-config artifacts/v23-config/V23B_HARD_CONFIG.json \
            --out artifacts/v24b/V24B_IDENTIFIABILITY_AUDIT.json
      - uses: actions/upload-artifact@v4
        with:
          name: all3-v24b-interaction-identifiability-audit
          path: artifacts/v24b/*.json
          retention-days: 30
          if-no-files-found: error
