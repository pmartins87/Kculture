name: FP001 H1B pulse-hold scan

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-principles-economy-v1
    paths:
      - 'tools/fp001_market_microsim.py'
      - 'tools/fp001_h1b_pulse_hold_scan.py'
      - '.github/workflows/fp001-h1b-pulse-hold.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run H1B pulse-hold scan
        working-directory: tools
        run: python fp001_h1b_pulse_hold_scan.py
