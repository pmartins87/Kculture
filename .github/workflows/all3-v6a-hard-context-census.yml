name: all3-v6a-hard-context-census
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v6a-hard-context-census.yml'
      - 'tools/all3_v6a_hard_context_shard.py'
      - 'tools/aggregate_all3_v6a_hard_contexts.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        opponent: [v47_mirror,ready_stock,v48,router_2715,conditional_memory,tactical_memory,best_market]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v6a_hard_context_shard.py
          python -m py_compile tools/aggregate_all3_v6a_hard_contexts.py
      - name: Run V6A census shard
        run: |
          mkdir -p artifacts/v6a
          python tools/all3_v6a_hard_context_shard.py \
            --opponent ${{ matrix.opponent }} \
            --out artifacts/v6a/V6A_${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6a-${{ matrix.opponent }}
          path: artifacts/v6a/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v6a-*
          path: artifacts/v6a-shards
          merge-multiple: false
      - name: Aggregate hard contexts
        run: |
          mkdir -p artifacts/v6a-aggregate
          python tools/aggregate_all3_v6a_hard_contexts.py \
            --input-dir artifacts/v6a-shards \
            --out artifacts/v6a-aggregate/ALL3_V6A_HARD_CONTEXTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v6a-hard-context-census
          path: artifacts/v6a-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
