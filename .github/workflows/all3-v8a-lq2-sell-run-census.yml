name: all3-v8a-lq2-sell-run-census
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v8a-lq2-sell-run-census.yml'
      - 'tools/all3_v8a_lq2_sell_run_context.py'
      - 'tools/aggregate_all3_v8a_lq2_sell_runs.py'
      - 'configs/all3_v6_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/all3_v8a_lq2_sell_run_context.py
          python -m py_compile tools/aggregate_all3_v8a_lq2_sell_runs.py
      - name: Run V8A context census
        run: |
          mkdir -p artifacts/v8a
          python tools/all3_v8a_lq2_sell_run_context.py \
            --config configs/all3_v6_hard_contexts.json \
            --index ${{ matrix.index }} \
            --out artifacts/v8a/V8A_CONTEXT_${{ matrix.index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8a-context-${{ matrix.index }}
          path: artifacts/v8a/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: context
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v8a-context-*
          path: artifacts/v8a-contexts
          merge-multiple: false
      - name: Aggregate V8A
        run: |
          mkdir -p artifacts/v8a-aggregate
          python tools/aggregate_all3_v8a_lq2_sell_runs.py \
            --input-dir artifacts/v8a-contexts \
            --out artifacts/v8a-aggregate/ALL3_V8A_LQ2_SELL_RUN_CENSUS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v8a-lq2-sell-run-census
          path: artifacts/v8a-aggregate/*.json
          retention-days: 30
          if-no-files-found: warn
