name: cr071-top-matchup-forensics
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr071-top-matchup-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {a: CR053, b: CR061, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz}
          - {a: CR053, b: CR070A, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: CR061, b: CR070A, afile: R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned Kaggle reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7' numpy
      - name: Compile forensic runner
        run: |
          python -m py_compile tools/kaggle_exact_runtime.py tools/kaggle_reference_matchup_forensics.py
      - name: Download frozen six-agent corpus
        uses: actions/download-artifact@v4
        with:
          name: historical-reference-league-packages
          path: artifacts/packages
          run-id: 34276243787
          github-token: ${{ github.token }}
      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          A=$(find artifacts/packages -name '${{ matrix.afile }}' -type f -print -quit)
          B=$(find artifacts/packages -name '${{ matrix.bfile }}' -type f -print -quit)
          test -n "$A" && test -n "$B"
          echo "A=$A" >> "$GITHUB_ENV"
          echo "B=$B" >> "$GITHUB_ENV"
      - name: Exact-reference visible-state forensics
        run: |
          mkdir -p artifacts/result
          PYTHONPATH=tools python tools/kaggle_reference_matchup_forensics.py \
            --a "$A" --b "$B" \
            --a-id '${{ matrix.a }}' --b-id '${{ matrix.b }}' \
            --seed-count 12 \
            --checkpoints '72,144,216,226,288,313,314,315,316,360,432,433,504,576,648,696,718' \
            --output 'artifacts/result/${{ matrix.a }}_vs_${{ matrix.b }}_forensics.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr071-forensics-${{ matrix.a }}-vs-${{ matrix.b }}
          path: artifacts/result/*.json
          retention-days: 30
          if-no-files-found: warn
