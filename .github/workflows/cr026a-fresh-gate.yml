name: cr026a-fresh-gate
'on':
  push:
    paths:
    - .github/workflows/cr026a-fresh-gate.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - &id001
      uses: actions/checkout@v4
    - &id002
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - &id003
      run: python -m pip install -r requirements.txt kagglehub 'kaggle>=2.2.3'
    - uses: actions/download-artifact@v4
      with:
        name: cr026-screen-input
        path: artifacts/cr026a
        run-id: 33973134213
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - run: python tools/cr026a_fresh_gate.py prepare
    - uses: actions/upload-artifact@v4
      with:
        name: cr026a-prepared
        path: artifacts/cr026a/**
        retention-days: 7
  reactive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - *id001
    - *id002
    - *id003
    - &id004
      uses: actions/download-artifact@v4
      with:
        name: cr026a-prepared
        path: artifacts/cr026a
    - name: Fetch exact reactive opponent
      run: python tools/fetch_exact_package_main.py --handle '${{ matrix.handle }}'
        --output artifacts/cr026a/opponent.py --receipt artifacts/cr026a/opponent.json
    - name: Check opponent source identity
      env:
        EXPECT_MAIN: ${{ matrix.main_sha256 }}
        EXPECT_ARCHIVE: ${{ matrix.archive_sha256 }}
      run: 'python - <<''PY''

        import json,os

        r=json.load(open(''artifacts/cr026a/opponent.json''))

        assert r[''main_sha256'']==os.environ[''EXPECT_MAIN'']

        assert r[''archive_sha256'']==os.environ[''EXPECT_ARCHIVE'']

        PY'
    - run: python tools/cr026a_fresh_gate.py reactive --opponent artifacts/cr026a/opponent.py
        --opponent-id '${{ matrix.id }}'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cr026a-reactive-${{ matrix.id }}
        path: artifacts/cr026a/reactive_*.json
        if-no-files-found: error
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
        - id: rayk
          handle: raykkretzschmar/kaggriculture-rank-your-agent/versions/23
          archive_sha256: 86b7ae5c029e351adfbd80059cd185b39d1467303437e6441ff7ad871cd8e7ee
          main_sha256: 6c709f6d3ce6cf221a9495de7e716fcd1b660e3bbc8ee5679b63233d0265a812
        - id: boatlee
          handle: boatlee/v21-r1-public-state-route-portfolio/versions/2
          archive_sha256: d65410a4fc8a31226055e43085131468ac8af5721aabdf3593cb8eade59cabe3
          main_sha256: c6f96a8521dc9aa369b6f27e5b36b9d481e5c1688f50c8ca215c3bb53f1f9eb8
        - id: tetsu
          handle: tetsutani/read-the-town-build-the-farm-kaggriculture/versions/2
          archive_sha256: 00c423f03e091c4bc64417fe66bcf44dbe5d1a8b5d5eff5fadc6bc362b318ec9
          main_sha256: 73834889054bb6a515fbb40a306a7e0e609105049c781e32197a205f6c339c4f
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - run: python tools/cr026a_fresh_gate.py hosted
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cr026a-hosted
        path: artifacts/cr026a/hosted.json
        if-no-files-found: error
    needs: prepare
  aggregate:
    needs:
    - reactive
    - hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - *id004
    - uses: actions/download-artifact@v4
      with:
        pattern: cr026a-reactive-*
        path: artifacts/cr026a
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        name: cr026a-hosted
        path: artifacts/cr026a
    - run: python tools/cr026a_fresh_gate.py aggregate
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cr026a-final-report
        path: artifacts/cr026a/final.json
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cr026a-ready-submission
        path: 'artifacts/cr026a/CR026A_RECENT_BACKBONE_V1.tar.gz

          artifacts/cr026a/manifest.json

          artifacts/cr026a/final.json'
        if-no-files-found: error
