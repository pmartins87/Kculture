name: cr073-public-frontier-calibration-v1
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr073-public-frontier-calibration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download CR072 public frontier corpus
        uses: actions/download-artifact@v4
        with:
          name: cr072-public-frontier-corpus-v1
          path: artifacts/public
          run-id: 34370093160
          github-token: ${{ github.token }}
      - name: Download frozen Kculture controls
        uses: actions/download-artifact@v4
        with:
          name: cr071-presale1-confirm-packages
          path: artifacts/control
          run-id: 34315316048
          github-token: ${{ github.token }}
      - name: Build calibration corpus and prove fresh-seed separation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/corpus
          cp artifacts/public/rayk_v11_2990/submission.tar.gz artifacts/corpus/RAYK_V11_2990.tar.gz
          cp artifacts/public/moon_v11_2736/submission.tar.gz artifacts/corpus/MOON_V11_2736.tar.gz
          cp artifacts/public/multiroute_v59_2767/submission.tar.gz artifacts/corpus/MULTIROUTE_V59_2767.tar.gz
          cp artifacts/public/indar_v1_2686/submission.tar.gz artifacts/corpus/INDAR_V1_2686.tar.gz
          cp "$(find artifacts/control -name 'PARENT_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/PARENT.tar.gz
          cp "$(find artifacts/control -name 'CR071M_CR053_PRESALE1_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/PRESALE1.tar.gz
          test -s artifacts/corpus/RAYK_V11_2990.tar.gz
          test -s artifacts/corpus/PARENT.tar.gz
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from kaggle_exact_runtime import make_seeds
          old=set()
          old |= set(make_seeds(64,5809072026))
          old |= set(make_seeds(64,9092026))
          old |= set(make_seeds(64,9092027))
          old |= set(make_seeds(64,9092028))
          old |= set(make_seeds(64,9092029))
          fresh=set(make_seeds(32,9092031))
          overlap=old & fresh
          if overlap:
              raise SystemExit(f'CR073 fresh-seed firewall failed: {sorted(overlap)}')
          print('CR073 fresh-seed firewall PASS', len(fresh), min(fresh), max(fresh))
          PY
          find artifacts/corpus -type f -maxdepth 1 -print0 | sort -z | xargs -0 sha256sum > artifacts/corpus/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cr073-public-frontier-calibration-packages
          path: artifacts/corpus/
          retention-days: 30
          if-no-files-found: error

  h2h:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { public: RAYK_V11_2990, control: PARENT }
          - { public: RAYK_V11_2990, control: PRESALE1 }
          - { public: MOON_V11_2736, control: PARENT }
          - { public: MOON_V11_2736, control: PRESALE1 }
          - { public: MULTIROUTE_V59_2767, control: PARENT }
          - { public: MULTIROUTE_V59_2767, control: PRESALE1 }
          - { public: INDAR_V1_2686, control: PARENT }
          - { public: INDAR_V1_2686, control: PRESALE1 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned Kaggle reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7' numpy
      - name: Compile exact-reference runner
        run: python -m py_compile tools/kaggle_exact_runtime.py tools/kaggle_reference_h2h_v2.py
      - uses: actions/download-artifact@v4
        with:
          name: cr073-public-frontier-calibration-packages
          path: artifacts/corpus
      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          A="artifacts/corpus/${{ matrix.public }}.tar.gz"
          B="artifacts/corpus/${{ matrix.control }}.tar.gz"
          test -s "$A" && test -s "$B"
          echo "A=$A" >> "$GITHUB_ENV"
          echo "B=$B" >> "$GITHUB_ENV"
      - name: Exact-reference CR073 calibration — 32 paired seeds / 64 games
        run: |
          mkdir -p artifacts/result
          PYTHONPATH=tools python tools/kaggle_reference_h2h_v2.py \
            --a "$A" --b "$B" \
            --a-id '${{ matrix.public }}' --b-id '${{ matrix.control }}' \
            --seed-count 32 \
            --master-seed 9092031 \
            --output 'artifacts/result/${{ matrix.public }}_vs_${{ matrix.control }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr073-${{ matrix.public }}-vs-${{ matrix.control }}
          path: artifacts/result/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: h2h
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cr073-*
          path: artifacts/results
          merge-multiple: true
      - name: Aggregate CR073 and apply frozen interpretation tree
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('artifacts/results').glob('*.json')):
              d=json.loads(p.read_text())
              m=d['metrics_a_vs_b']
              rows.append({
                  'public':d['a'],'control':d['b'],
                  'wins':m['wins'],'losses':m['losses'],'ties':m['ties'],
                  'games':m['games'],'score_rate':m['score_rate'],
                  'ci95':d.get('paired_seed_uncertainty',{}).get('ci95'),
              })
          agents=['RAYK_V11_2990','MOON_V11_2736','MULTIROUTE_V59_2767','INDAR_V1_2686']
          controls=['PARENT','PRESALE1']
          by={(r['public'],r['control']):r for r in rows}
          missing=[(a,c) for a in agents for c in controls if (a,c) not in by]
          if missing:
              raise SystemExit(f'missing CR073 results: {missing}')
          avg={a:sum(by[(a,c)]['score_rate'] for c in controls)/2 for a in agents}
          path_a=any(all(by[(a,c)]['score_rate']>=0.60 for c in controls) for a in agents)
          no_ge_055=all(by[(a,c)]['score_rate']<0.55 for a in agents for c in controls)
          strongest_hosted_local_bad=(by[('RAYK_V11_2990','PARENT')]['score_rate']<=0.50 and by[('RAYK_V11_2990','PRESALE1')]['score_rate']<=0.50)
          path_b=(not path_a) and (no_ge_055 or strongest_hosted_local_bad)
          if path_a:
              interpretation='LOCAL_CAPTURES_HOSTED_FRONTIER'
              eligible=[a for a in agents if all(by[(a,c)]['score_rate']>=0.60 for c in controls)]
              next_target=max(eligible,key=lambda a:avg[a])
              next_action='CAUSAL_DECOMPOSITION_OF_STRONGEST_PUBLIC_AGENT'
          elif path_b:
              interpretation='LOCAL_META_MISALIGNED'
              next_target=None
              next_action='RESTRICT_LOCAL_TO_MECHANICS_AND_USE_HOSTED_META_AS_PRIMARY_STRATEGIC_CALIBRATION'
          else:
              interpretation='MIXED_CALIBRATION'
              # nearest matchup to 0.55 as the single pre-authorized expansion candidate
              pair=min(((abs(by[(a,c)]['score_rate']-0.55),a,c) for a in agents for c in controls))
              next_target=f'{pair[1]}_vs_{pair[2]}'
              next_action='ONE_64_PAIRED_SEED_EXPANSION_ONLY'
          out={
              'schema_version':'kculture-cr073-public-frontier-calibration-v1-summary',
              'purpose':'local_vs_hosted_frontier_calibration_not_candidate_promotion',
              'reference_backend':'kaggle-environments==1.32.7',
              'master_seed':9092031,'paired_seed_count':32,
              'rows':rows,'agent_average_score_rate':avg,
              'interpretation':interpretation,'next_target':next_target,'next_action':next_action,
              'automatic_kaggle_submission':False,
          }
          Path('artifacts/summary').mkdir(parents=True,exist_ok=True)
          Path('artifacts/summary/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          md=['# CR073 public frontier calibration','',f"Interpretation: **{interpretation}**",f"Next action: `{next_action}`",f"Next target: `{next_target}`",'', '| Public | Control | W | L | T | Score | CI95 |','|---|---|---:|---:|---:|---:|---|']
          for r in sorted(rows,key=lambda x:(x['public'],x['control'])):
              md.append(f"| {r['public']} | {r['control']} | {r['wins']} | {r['losses']} | {r['ties']} | {r['score_rate']:.4f} | {r['ci95']} |")
          md += ['', '## Average local score vs Kculture controls','']
          for a in sorted(agents,key=lambda a:avg[a],reverse=True): md.append(f'- {a}: {avg[a]:.4f}')
          Path('artifacts/summary/summary.md').write_text('\n'.join(md)+'\n')
          print('\n'.join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cr073-public-frontier-calibration-v1-summary
          path: artifacts/summary/
          retention-days: 30
          if-no-files-found: error
