name: v38-holdout-hosted-replay-corpus
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v38-holdout-hosted-replay-corpus.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U 'kaggle>=2.2.3' 'kaggle-environments==1.32.7'
      - name: Collect oldest disjoint V37C episodes
        run: |
          python tools/collect_submission_replays_cli_v2.py             --submission v37c:56626986             --output-dir artifacts/v38-holdout             --selection oldest             --max-per-submission 30             --delay-seconds 0.35             --retries 4             --retry-backoff-seconds 1.0
      - name: Assert disjoint from development corpus
        uses: actions/download-artifact@v4
        with:
          name: v38-v37c-hosted-replay-corpus
          path: development
          run-id: 36519927553
          github-token: ${{ github.token }}
      - name: Verify no overlap
        run: |
          python - <<'PY'
          import glob,re,json
          from pathlib import Path
          def ids(root):
              out=set()
              for p in glob.glob(root+"/**/episode-*-replay.json",recursive=True):
                  m=re.search(r'episode-(\d+)-replay',p)
                  if m:out.add(int(m.group(1)))
              return out
          dev=ids("development"); hold=ids("artifacts/v38-holdout")
          overlap=dev&hold
          out={"development":len(dev),"holdout":len(hold),"overlap":sorted(overlap),
               "holdout_min":min(hold) if hold else None,"holdout_max":max(hold) if hold else None}
          Path("artifacts/v38-holdout/disjoint.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("V38_HOLDOUT",json.dumps(out,sort_keys=True))
          if len(hold)!=30 or overlap:raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v38-holdout-hosted-replay-corpus
          path: artifacts/v38-holdout/**
          retention-days: 10
