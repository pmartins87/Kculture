name: cr002b-current-meta-preflight

on:
  push:
    paths:
      - .github/workflows/cr002b-current-meta-preflight.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - id: kaito-sparse-v13
            handle: kaitofukami/103-128-fresh-public-v43-sparse-shop-hybrid/versions/13
            score: 2882.0
          - id: prvsiyan-frontier-v10
            handle: prvsiyan/kaggriculture-frontier-the-soil-remembers-rain/versions/10
            score: 2610.2
          - id: salem-harvest-v4
            handle: salemali7/harvest-kaggriculture/versions/4
            score: 2590.2
          - id: rayk-rank-v23
            handle: raykkretzschmar/kaggriculture-rank-your-agent/versions/23
            score: 2563.4
          - id: kaito-future-v19-v1
            handle: kaitofukami/41-49-future-unseen-v19-replication-to-control/versions/1
            score: 2530.5
          - id: tactical-memory-v1
            handle: web3cainiao/kaggriculture-v21-tactical-memory/versions/1
            score: 2491.7
          - id: boatlee-route-v2
            handle: boatlee/v21-r1-public-state-route-portfolio/versions/2
            score: 2467.9
          - id: andrew-kaggriculture-v11
            handle: andrewsokolovsky/kaggriculture/versions/11
            score: 2441.2
          - id: flex-current-v84
            handle: flexonafft/kaggriculture-adaptive-replay-agent/versions/84
            score: 1961.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install KaggleHub
        run: python -m pip install -U kagglehub
      - name: Verify frozen config and audit tool
        run: |
          test "$(git rev-parse HEAD:configs/competitive_reset_current_meta_v1.json)" = "$(git rev-parse HEAD:configs/competitive_reset_current_meta_v1.json)"
          test "$(git rev-parse HEAD:tools/audit_public_submission_package.py)" = "10db75da51c0654f669b75946d2fa0c4196eae18"
      - name: Audit exact current-meta notebook package
        run: >-
          python tools/audit_public_submission_package.py
          --handle "${{ matrix.handle }}"
          --target-id "${{ matrix.id }}"
          --reported-score "${{ matrix.score }}"
          --output-dir "artifacts/cr002b/${{ matrix.id }}/output"
          --manifest "artifacts/cr002b/${{ matrix.id }}/manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr002b-preflight-${{ matrix.id }}
          path: artifacts/cr002b/${{ matrix.id }}/manifest.json
          if-no-files-found: warn
