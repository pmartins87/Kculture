name: FP001 E2 dedicated strawberry hand runtime

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-principles-economy-v1
    paths:
      - 'candidates/fp001_e2_dedicated_strawberry_hand.py'
      - 'tools/fp001_e2_dedicated_hand_runtime_test.py'
      - '.github/workflows/fp001-e2-dedicated-hand-runtime.yml'
      - 'candidates/fp001_e1_strawberry_hybrid.py'
      - 'candidates/fp001_h10_cow_scale_module.py'
      - 'candidates/fp001_h10_cow_scale_care_wrapper.py'
      - 'requirements.txt'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Kaggriculture environment
        run: pip install -r requirements.txt
      - name: Run paired E2 dedicated STRAWBERRY hand gate
        run: python tools/fp001_e2_dedicated_hand_runtime_test.py
