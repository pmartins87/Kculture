name: hosted-authenticated-forensics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,9,15,21 * * *'
env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require authenticated API
        run: test -n "$KAGGLE_API_TOKEN"
      - run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Resolve current active submissions and collect newest replay windows
        run: |
          mkdir -p artifacts/hosted-authenticated
          python - <<'PY'
          import csv, io, json, subprocess
          from pathlib import Path
          root=Path('artifacts/hosted-authenticated')
          cmd=['kaggle','competitions','submissions','kaggriculture','-v','-q']
          p=subprocess.run(cmd,capture_output=True,text=True)
          (root/'current_submissions_command.json').write_text(json.dumps({'command':cmd,'returncode':p.returncode,'stdout':p.stdout,'stderr':p.stderr},indent=2))
          p.check_returncode()
          rows=list(csv.DictReader(io.StringIO(p.stdout)))
          complete=[r for r in rows if str(r.get('status','')).upper().endswith('COMPLETE')]
          complete.sort(key=lambda r:r['date'],reverse=True)
          active=complete[:2]
          if len(active)!=2: raise SystemExit('Cannot identify two completed active submissions')
          (root/'active_submission_manifest.json').write_text(json.dumps({'rule':'latest two completed submissions by API date','active':active},indent=2))
          cmd=['python','tools/collect_submission_replays_cli_v2.py','--output-dir',str(root/'replays'),'--max-per-submission','32','--selection','newest','--retries','6','--delay-seconds','0.5']
          for rank,r in enumerate(active):cmd+=['--submission',f"active_{rank}_{r['ref']}:{int(r['ref'])}"]
          subprocess.run(cmd,check=True)
          PY
      - name: Record current submission allowance
        if: always()
        run: kaggle competitions submission-limits kaggriculture --json > artifacts/hosted-authenticated/submission-limits.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-authenticated-forensics
          path: artifacts/hosted-authenticated/**
          if-no-files-found: error
          retention-days: 30
