name: cr008-export-adaptive-models
on:
  push:
    paths:
      - 'tools/export_cr007_pure_models.py'
      - '.github/workflows/cr008-export-adaptive-models.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install kagglehub scikit-learn kaggle-environments
      - name: Export frozen adaptive trees
        run: |
          mkdir -p artifacts/cr008
          python tools/export_cr007_pure_models.py --top 20 --output artifacts/cr008/cr007_pure_models.json
      - uses: actions/upload-artifact@v4
        with:
          name: cr008-export-adaptive-models
          path: artifacts/cr008/**
