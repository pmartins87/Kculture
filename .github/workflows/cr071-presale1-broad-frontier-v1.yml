name: cr071-presale1-broad-frontier-v1
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr071-presale1-broad-frontier-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen PRESALE1 corpus
        uses: actions/download-artifact@v4
        with:
          name: cr071-presale1-confirm-packages
          path: artifacts/presale
          run-id: 34315316048
          github-token: ${{ github.token }}
      - name: Download frozen historical frontier
        uses: actions/download-artifact@v4
        with:
          name: historical-reference-league-packages
          path: artifacts/historical
          run-id: 34276243787
          github-token: ${{ github.token }}
      - name: Build broad-frontier corpus and prove fresh-seed separation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/corpus
          cp "$(find artifacts/presale -name 'PARENT_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/PARENT.tar.gz
          cp "$(find artifacts/presale -name 'CR071M_CR053_PRESALE1_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR071M_CR053_PRESALE1.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR053_ROUTE106309334_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR053.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR061_INDAR_TOP10_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR061.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR065.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR068A_RANK_V11_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR068A.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR068B_MATH_V4_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR068B.tar.gz
          cp "$(find artifacts/historical -name 'R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz' -type f -print -quit)" artifacts/corpus/CR070A.tar.gz
          test -s artifacts/corpus/PARENT.tar.gz
          test -s artifacts/corpus/CR071M_CR053_PRESALE1.tar.gz
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from kaggle_exact_runtime import make_seeds
          discovery=set(make_seeds(64,5809072026))
          confirm=set(make_seeds(32,9092026))
          broad=set(make_seeds(32,9092027))
          overlap=(discovery|confirm)&broad
          if overlap:
              raise SystemExit(f'fresh-seed firewall failed: {sorted(overlap)}')
          print('fresh-seed firewall PASS', len(broad), min(broad), max(broad))
          PY
          find artifacts/corpus -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/corpus/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cr071-presale1-broad-frontier-packages
          path: artifacts/corpus/
          retention-days: 30
          if-no-files-found: error

  h2h:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { variant: PARENT, opponent: CR053 }
          - { variant: PARENT, opponent: CR061 }
          - { variant: PARENT, opponent: CR065 }
          - { variant: PARENT, opponent: CR068A }
          - { variant: PARENT, opponent: CR068B }
          - { variant: CR071M_CR053_PRESALE1, opponent: CR053 }
          - { variant: CR071M_CR053_PRESALE1, opponent: CR061 }
          - { variant: CR071M_CR053_PRESALE1, opponent: CR065 }
          - { variant: CR071M_CR053_PRESALE1, opponent: CR068A }
          - { variant: CR071M_CR053_PRESALE1, opponent: CR068B }
          - { variant: CR071M_CR053_PRESALE1, opponent: CR070A }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned Kaggle reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7' numpy
      - name: Compile exact-reference runner
        run: python -m py_compile tools/kaggle_exact_runtime.py tools/kaggle_reference_h2h_v2.py
      - uses: actions/download-artifact@v4
        with:
          name: cr071-presale1-broad-frontier-packages
          path: artifacts/corpus
      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          A="artifacts/corpus/${{ matrix.variant }}.tar.gz"
          B="artifacts/corpus/${{ matrix.opponent }}.tar.gz"
          test -s "$A" && test -s "$B"
          echo "A=$A" >> "$GITHUB_ENV"
          echo "B=$B" >> "$GITHUB_ENV"
      - name: Exact-reference broad frontier — 32 paired seeds / 64 games
        run: |
          mkdir -p artifacts/result
          PYTHONPATH=tools python tools/kaggle_reference_h2h_v2.py \
            --a "$A" --b "$B" \
            --a-id '${{ matrix.variant }}' --b-id '${{ matrix.opponent }}' \
            --seed-count 32 \
            --master-seed 9092027 \
            --output 'artifacts/result/${{ matrix.variant }}_vs_${{ matrix.opponent }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr071-broad-${{ matrix.variant }}-vs-${{ matrix.opponent }}
          path: artifacts/result/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: h2h
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cr071-broad-*
          path: artifacts/results
          merge-multiple: true
      - name: Aggregate broad-frontier W/L and promotion gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('artifacts/results').glob('*.json')):
              d=json.loads(p.read_text())
              m=d['metrics_a_vs_b']
              rows.append({
                  'variant':d['a'],'opponent':d['b'],
                  'wins':m['wins'],'losses':m['losses'],'ties':m['ties'],
                  'games':m['games'],'score_rate':m['score_rate'],
                  'ci95':d.get('paired_seed_uncertainty',{}).get('ci95'),
              })
          by={(r['variant'],r['opponent']):r for r in rows}
          cand='CR071M_CR053_PRESALE1'; parent='PARENT'
          panel=['CR053','CR061','CR065','CR068A','CR068B']
          deltas={o:by[(cand,o)]['score_rate']-by[(parent,o)]['score_rate'] for o in panel}
          candidate_panel=sum(by[(cand,o)]['wins']+0.5*by[(cand,o)]['ties'] for o in panel)/sum(by[(cand,o)]['games'] for o in panel)
          parent_panel=sum(by[(parent,o)]['wins']+0.5*by[(parent,o)]['ties'] for o in panel)/sum(by[(parent,o)]['games'] for o in panel)
          direct=by[(cand,'CR070A')]['score_rate']
          guardrails=['CR061','CR065','CR068A','CR068B']
          no_material_regression=all(deltas[o] >= -0.03125 for o in guardrails)
          cr053_gain=deltas['CR053'] >= 0.10
          panel_gain=candidate_panel > parent_panel
          direct_ok=direct >= 0.46875
          gate=bool(no_material_regression and cr053_gain and panel_gain and direct_ok)
          decision='READY_FOR_HOSTED_PROBE' if gate else 'DO_NOT_SUBMIT_BROAD_GATE_FAILED'
          out={
              'schema_version':'kculture-cr071-presale1-broad-frontier-v1-summary',
              'primary_metric':'seat-balanced W/L / score_rate',
              'money_margin_role':'diagnostic_only',
              'fresh_master_seed':9092027,
              'fresh_seed_count':32,
              'rows':rows,
              'score_rate_delta_candidate_minus_parent':deltas,
              'candidate_panel_score_rate':candidate_panel,
              'parent_panel_score_rate':parent_panel,
              'candidate_vs_cr070a_score_rate':direct,
              'gate_checks':{
                  'cr053_gain_at_least_0.10':cr053_gain,
                  'no_guardrail_regression_below_minus_0.03125':no_material_regression,
                  'candidate_panel_score_above_parent':panel_gain,
                  'candidate_vs_cr070a_at_least_0.46875':direct_ok,
              },
              'promotion_gate_pass':gate,
              'decision':decision,
              'automatic_kaggle_submission':False,
          }
          Path('artifacts/summary').mkdir(parents=True,exist_ok=True)
          Path('artifacts/summary/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          md=['# CR071 PRESALE1 broad-frontier confirmation','',
              f"Candidate panel score: **{candidate_panel:.4f}**",f"Parent panel score: **{parent_panel:.4f}**",f"Candidate vs CR070A: **{direct:.4f}**",'',
              '| Variant | Opponent | W | L | T | Score | CI95 |','|---|---|---:|---:|---:|---:|---|']
          for r in sorted(rows,key=lambda x:(x['variant'],x['opponent'])):
              md.append(f"| {r['variant']} | {r['opponent']} | {r['wins']} | {r['losses']} | {r['ties']} | {r['score_rate']:.4f} | {r['ci95']} |")
          md += ['', '## Candidate minus parent', '']
          for o in panel: md.append(f"- {o}: {deltas[o]:+.4f}")
          md += ['',f"Promotion gate: **{'PASS' if gate else 'FAIL'}**",f"Decision: `{decision}`"]
          Path('artifacts/summary/summary.md').write_text('\n'.join(md)+'\n')
          print('\n'.join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cr071-presale1-broad-frontier-v1-summary
          path: artifacts/summary/
          retention-days: 30
          if-no-files-found: error
