name: cr075-current-rung-fingerprint-v1
'on':
  push:
    branches:
      - fix/kaggle-parity-v1
    paths:
      - '.github/workflows/cr075-current-rung-fingerprint-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kaggle-parity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public dataset client
        run: |
          python -m pip install --upgrade pip
          python -m pip install kagglehub
      - name: Compile CR075
        run: python -m py_compile tools/cr075_current_rung_fingerprint.py
      - name: Fingerprint current replay rungs
        run: |
          python tools/cr075_current_rung_fingerprint.py \
            --dates 2026-09-08 2026-09-09 \
            --top 40 \
            --output artifacts/cr075/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr075-current-rung-fingerprint-v1
          path: |
            artifacts/cr075/summary.json
            artifacts/cr075/summary.md
          retention-days: 30
          if-no-files-found: error
