name: top-ladder-replay-snapshot-auto-once

on:
  push:
    paths:
      - .github/workflows/top-ladder-replay-snapshot-auto-once.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Kaggle token secret
        shell: bash
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo 'KAGGLE_API_TOKEN repository secret is not configured.'
            echo 'Configure it as a GitHub Actions repository secret; never commit or print it.'
            exit 2
          fi
      - name: Install official Kaggle client
        run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Capture current top 20 and recent public replays
        run: |
          python tools/collect_top_ladder_snapshot.py \
            --top 20 \
            --episodes-per-team 3 \
            --output-dir artifacts/top-ladder-snapshot
      - name: Build CR022A behavior atlas
        run: |
          python tools/top_ladder_behavior_atlas.py \
            --snapshot artifacts/top-ladder-snapshot/snapshot.json \
            --output-dir artifacts/top-ladder-atlas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr022a-current-top20-replay-atlas
          path: |
            artifacts/top-ladder-snapshot/**
            artifacts/top-ladder-atlas/**
          if-no-files-found: warn
