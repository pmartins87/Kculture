name: r4d-late-crop-seed-feasibility

on:
  push:
    paths:
      - .github/workflows/r4d-late-crop-seed-feasibility.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify diagnostic identity
        run: |
          test "$(git rev-parse HEAD:tools/inspect_late_crop_seed_feasibility.py)" = "468d72a14c35a9b379963217e6a9b1e127b389c5"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Run seed-feasibility audit
        run: python tools/inspect_late_crop_seed_feasibility.py --output artifacts/kexp025/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp025-late-crop-seed-feasibility
          path: artifacts/kexp025/**
