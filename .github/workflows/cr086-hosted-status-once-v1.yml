name: CR086 hosted status once v1
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr086-hosted-status-once-v1.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TARGET: '56220184'
      BEST_HISTORICAL: '56073870'
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Single read-only hosted checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status
          kaggle competitions submissions kaggriculture -v -q | tee status/submissions.csv
          echo '=== CR086 ==='
          grep -F "${TARGET}," status/submissions.csv || true
          echo '=== CR053 HISTORICAL ==='
          grep -F "${BEST_HISTORICAL}," status/submissions.csv || true
          kaggle competitions episodes "$TARGET" -v -q > status/cr086_episodes.csv || true
          python - <<'PY'
          from pathlib import Path
          p=Path('status/cr086_episodes.csv')
          lines=[x for x in p.read_text(errors='replace').splitlines() if x.strip()] if p.exists() else []
          header=next((i for i,x in enumerate(lines) if ',' in x and 'episode' in x.lower()),None)
          print('cr086_episode_rows=',0 if header is None else max(0,len(lines)-header-1))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr086-hosted-status-once-v1
          path: status/**
          retention-days: 30
