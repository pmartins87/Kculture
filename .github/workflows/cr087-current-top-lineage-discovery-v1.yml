name: CR087 current top-lineage discovery v1
on:
  push:
    branches: [fix/kaggle-parity-v1]
    paths: [.github/workflows/cr087-current-top-lineage-discovery-v1.yml]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/kaggle-parity-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U 'kaggle>=2.2.3' requests
      - name: Freeze current leaderboard and resolve top-10 public submissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery/team_submissions
          kaggle competitions leaderboard kaggriculture --show -v -q > discovery/leaderboard.csv
          python - <<'PY'
          import csv,json,re,subprocess
          from pathlib import Path
          def norm(s): return re.sub(r'[^a-z0-9]','',str(s).lower())
          def rows_from(path):
              lines=[x for x in Path(path).read_text(errors='replace').splitlines() if x.strip()]
              for i,line in enumerate(lines):
                  low=line.lower()
                  if ',' in line and any(k in low for k in ('teamid','teamname','publicscore','submissionid','datesubmitted')):
                      try: return list(csv.DictReader(lines[i:]))
                      except Exception: pass
              return []
          def pick(row,*names):
              m={norm(k):v for k,v in row.items()}
              for n in names:
                  if norm(n) in m: return m[norm(n)]
              return None
          def num(x,default=-1e99):
              try: return float(str(x).strip())
              except: return default
          lb=rows_from('discovery/leaderboard.csv')
          if not lb: raise SystemExit('unable to parse leaderboard CSV')
          ranked=[]
          for idx,r in enumerate(lb,1):
              tid=pick(r,'TeamId','Team ID','team_id'); score=pick(r,'Score'); name=pick(r,'TeamName','Team Name','team_name')
              if tid is None: continue
              try: ti=int(float(tid))
              except: continue
              ranked.append((idx,ti,name,score))
              if len(ranked)>=10: break
          if len(ranked)<5: raise SystemExit(f'parsed only {len(ranked)} leaderboard teams')
          targets=[]
          for rank,tid,name,score in ranked:
              p=Path(f'discovery/team_submissions/{rank:02d}_{tid}.csv')
              cp=subprocess.run(['kaggle','competitions','team-submissions',str(tid),'-v','-q'],capture_output=True,text=True,check=True)
              p.write_text(cp.stdout)
              sr=rows_from(p); choices=[]
              for x in sr:
                  sid=pick(x,'id','submissionId','submission_id'); ps=pick(x,'publicScore','public_score','score')
                  try: si=int(float(sid))
                  except: continue
                  choices.append((num(ps),si,x))
              if not choices: continue
              choices.sort(reverse=True,key=lambda z:(z[0],z[1]))
              ps,sid,_=choices[0]
              targets.append({'rank':rank,'team_id':tid,'team_name':name,'score':num(score,None) if score not in (None,'') else None,'submission_id':sid,'submission_public_score':None if ps < -1e90 else ps})
          if len(targets)<5: raise SystemExit(f'resolved only {len(targets)} top submissions')
          Path('discovery/top_targets.json').write_text(json.dumps(targets,indent=2,sort_keys=True))
          print(json.dumps(targets,indent=2,sort_keys=True))
          PY
      - name: Mine current top action lineage
        run: |
          python tools/cr087_current_top_lineage_miner.py --targets discovery/top_targets.json --output-dir discovery/lineage --episodes-per-submission 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr087-current-top-lineage-discovery-v1
          path: discovery/**
          retention-days: 30
