name: cr070-shape-shop-frontier
'on':
  push:
    paths:
      - '.github/workflows/cr070-shape-shop-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install kagglehub
      - run: python -m py_compile tools/cr070_shape_shop_frontier.py
      - run: python tools/cr070_shape_shop_frontier.py --output-dir artifacts/cr070
      - uses: actions/upload-artifact@v4
        with:
          name: cr070-shape-shop-packages
          path: artifacts/cr070/
          retention-days: 30
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {a: cr053, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, b: cr070a, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: cr065, afile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz, b: cr070a, bfile: R4D_CR070A_TETSU_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: cr053, afile: R4D_CR053_ROUTE106309334_V1.tar.gz, b: cr070b, bfile: R4D_CR070B_INDAR_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
          - {a: cr065, afile: R4D_CR065_FARMING_SCORE_V3_SEATSAFE_V1.tar.gz, b: cr070b, bfile: R4D_CR070B_INDAR_SHAPE_SHOP_SEATSAFE_V1.tar.gz}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: |
          python -m pip install numpy pybind11
          python -m pip install 'git+https://github.com/destbreso/kaggriculture-cppsim@main'
      - uses: actions/download-artifact@v4
        with:
          name: cr070-shape-shop-packages
          path: artifacts/cr070
      - uses: actions/download-artifact@v4
        with:
          name: cr052-cr053-hosted-candidates
          path: artifacts/cr053
          run-id: 34105008373
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cr064-cr066-current-frontier-seatsafe
          path: artifacts/current
          run-id: 34160996911
          github-token: ${{ github.token }}
      - name: Resolve
        run: |
          A=$(find artifacts -name '${{ matrix.afile }}' -print -quit)
          B=$(find artifacts -name '${{ matrix.bfile }}' -print -quit)
          test -n "$A"; test -n "$B"
          echo "A=$A" >> "$GITHUB_ENV"; echo "B=$B" >> "$GITHUB_ENV"
      - name: Common-seed both-seat smoke
        run: |
          mkdir -p artifacts/result
          python tools/cr058_broad_live_agent_league.py --a "$A" --b "$B" --a-id '${{ matrix.a }}' --b-id '${{ matrix.b }}' --output 'artifacts/result/${{ matrix.a }}_vs_${{ matrix.b }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr070-${{ matrix.a }}-vs-${{ matrix.b }}
          path: artifacts/result/*.json
          retention-days: 30
