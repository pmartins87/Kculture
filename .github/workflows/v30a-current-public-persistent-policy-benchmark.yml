name: v30a-current-public-persistent-policy-benchmark

'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v30a-current-public-persistent-policy-benchmark.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      frontier_decision: ${{ steps.read.outputs.frontier_decision }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install acquisition runtime
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Acquire fresh public-policy frontier
        id: frontier
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/v30a-snapshot-result
          python tools/v28b_current_frontier_snapshot.py             --out artifacts/v30a-snapshot-result/V30A_FRONTIER_RESULT.json             --raw artifacts/v30a-snapshot-result/TOP30_RAW.csv             --snapshot-dir artifacts/v30a-snapshot
      - name: Read snapshot gate
        id: read
        if: always()
        run: |
          python - <<'PY'
          import json,os
          p='artifacts/v30a-snapshot-result/V30A_FRONTIER_RESULT.json'
          d='V30A_NO_FRONTIER_RESULT'
          if os.path.exists(p):
              d=json.load(open(p)).get('decision',d)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'frontier_decision={d}\n')
          print('V30A_FRONTIER_GATE',d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30a-snapshot-result
          path: artifacts/v30a-snapshot-result/*
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30a-immutable-public-policy-snapshot
          path: artifacts/v30a-snapshot/**
          retention-days: 30
          if-no-files-found: warn
      - name: Fail invalid snapshot
        if: steps.frontier.outcome != 'success' || steps.read.outputs.frontier_decision != 'V28B_FRONTIER_SNAPSHOT_READY'
        run: exit 2

  shard:
    needs: snapshot
    if: needs.snapshot.outputs.frontier_decision == 'V28B_FRONTIER_SNAPSHOT_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned execution runtime
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' numpy
      - uses: actions/download-artifact@v4
        with:
          name: v30a-immutable-public-policy-snapshot
          path: artifacts/v30a-snapshot
      - name: Run V30A shard
        run: |
          set -euo pipefail
          mkdir -p artifacts/v30a
          for k in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY; do unset "$k" || true; done
          python tools/v30a_public_policy_benchmark_shard.py             --snapshot-dir artifacts/v30a-snapshot             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v30a/V30A_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30a-shard-${{ matrix.shard_index }}
          path: artifacts/v30a/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: [snapshot,shard]
    if: needs.snapshot.outputs.frontier_decision == 'V28B_FRONTIER_SNAPSHOT_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/download-artifact@v4
        with:
          pattern: v30a-shard-*
          path: artifacts/v30a-shards
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: v30a-snapshot-result
          path: artifacts/v30a-snapshot-result
      - name: Aggregate frozen V30A
        run: |
          set -euo pipefail
          mkdir -p artifacts/v30a-final
          python tools/aggregate_v30a_public_policy_benchmark.py             --input-dir artifacts/v30a-shards             --snapshot-result artifacts/v30a-snapshot-result/V30A_FRONTIER_RESULT.json             --out artifacts/v30a-final/V30A_PUBLIC_PERSISTENT_POLICY_BENCHMARK.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30a-current-public-persistent-policy-benchmark
          path: artifacts/v30a-final/*.json
          retention-days: 30
          if-no-files-found: error
