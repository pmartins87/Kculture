name: option-value-ryzen-v1-smoke
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/option-value-ryzen-v1-smoke.yml'
      - 'tools/option_value_dataset_ryzen_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax check
        run: python -m py_compile tools/option_value_dataset_ryzen_v1.py
      - name: Run one-seed one-opponent smoke
        run: |
          rm -rf runs/option_value_v1_smoke
          python tools/option_value_dataset_ryzen_v1.py             --out runs/option_value_v1_smoke             --seed-count 1             --master-seed 26091803             --opponents v47_mirror             --seats 0             --workers 1
          cat runs/option_value_v1_smoke/SUMMARY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-value-ryzen-v1-smoke
          path: runs/option_value_v1_smoke/**
          retention-days: 30
          if-no-files-found: warn
