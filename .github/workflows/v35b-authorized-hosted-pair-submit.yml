name: v37-hosted-shot1-v37c
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v35b-authorized-hosted-pair-submit.yml']

permissions:
  contents: read
  actions: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  COMPETITION: kaggriculture
  EXPECTED_NEWEST_ID: '56619409'
  EXPECTED_OLDER_ID: '56593614'
  DESC: PS_V37_SHOT1_IDLE_HARVEST_895149D9
  EXPECTED_SHA: 895149d9f8f8558873062d6b4ce71e487cb0035ea6891e1a324b1ea9d30c9b34

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/prize-solver-v0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Authenticate Kaggle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U 'kaggle>=2.2.3'
          kaggle competitions list --group entered -v > entered.csv
          grep -qi kaggriculture entered.csv

      - name: Download frozen V37C
        uses: actions/download-artifact@v4
        with:
          name: v37c-idle-harvest
          path: v37c
          run-id: 36370602453
          github-token: ${{ github.token }}

      - name: Verify exact V37C bytes
        shell: bash
        run: |
          set -euo pipefail
          cp v37c/V37C_IDLE_HARVEST.tar.gz V37C_IDLE_HARVEST.tar.gz
          SHA="$(sha256sum V37C_IDLE_HARVEST.tar.gz | awk '{print $1}')"
          echo "V37C_SHA=$SHA" | tee SHA256SUMS.txt
          test "$SHA" = "$EXPECTED_SHA"
          tar -tzf V37C_IDLE_HARVEST.tar.gz | grep -qx 'main.py'

      - name: Binding live slot and quota preflight
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submissions "$COMPETITION" -v -q > before.csv
          kaggle competitions submission-limits "$COMPETITION" --json > limits.json
          python - <<'PY'
          import csv,io,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          txt=Path('before.csv').read_text(encoding='utf-8',errors='replace')
          lines=[x for x in txt.splitlines() if x.strip()]
          rows=[]
          for i in range(len(lines)):
              try: cand=list(csv.DictReader(io.StringIO('\n'.join(lines[i:]))))
              except Exception: continue
              if cand and any(k and 'ref' in k.lower() for k in cand[0]):
                  rows=cand; break
          rows=[{str(k).lower():v for k,v in r.items() if k} for r in rows]
          rows=sorted(rows,key=lambda r:str(r.get('date','')),reverse=True)
          refs=[str(r.get('ref','')) for r in rows[:2]]
          exp=[os.environ['EXPECTED_NEWEST_ID'],os.environ['EXPECTED_OLDER_ID']]
          if refs!=exp: raise SystemExit(f'ABORT_SLOT_DRIFT refs={refs} expected={exp}')
          if any(str(r.get('description',''))==os.environ['DESC'] for r in rows):
              raise SystemExit('ABORT_ALREADY_SUBMITTED')
          lim=json.loads(Path('limits.json').read_text())
          allowed=int(lim.get('numAllowedNow',0))
          if allowed<1: raise SystemExit(f'ABORT_NO_QUOTA allowed={allowed}')
          today=datetime.now(timezone.utc).date().isoformat()
          used=sum(str(r.get('date','')).startswith(today) for r in rows)
          print('V37C_PREFLIGHT',json.dumps({'latest_two':refs,'today_utc':today,'observed_today':used,'numAllowedNow':allowed},sort_keys=True))
          PY

      - name: Submit V37C shot 1
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submit -c "$COMPETITION" -f V37C_IDLE_HARVEST.tar.gz -m "$DESC"

      - name: Verify registration
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            kaggle competitions submissions "$COMPETITION" -v -q > after.csv
            if grep -Fq "$DESC" after.csv; then
              python - <<'PY'
          import csv,io,json,os
          from pathlib import Path
          txt=Path('after.csv').read_text(encoding='utf-8',errors='replace')
          lines=[x for x in txt.splitlines() if x.strip()]
          rows=[]
          for i in range(len(lines)):
              try: cand=list(csv.DictReader(io.StringIO('\n'.join(lines[i:]))))
              except Exception: continue
              if cand and any(k and 'ref' in k.lower() for k in cand[0]):
                  rows=cand; break
          rows=[{str(k).lower():v for k,v in r.items() if k} for r in rows]
          rows=sorted(rows,key=lambda r:str(r.get('date','')),reverse=True)
          target=next(r for r in rows if str(r.get('description',''))==os.environ['DESC'])
          latest=rows[:2]
          out={'decision':'V37C_SHOT1_REGISTERED','submission_id':str(target.get('ref','')),
               'status':str(target.get('status','')),'public_score':str(target.get('publicscore','')),
               'latest_two':[{'ref':str(r.get('ref','')),'description':str(r.get('description','')),
                              'status':str(r.get('status','')),'public_score':str(r.get('publicscore',''))}
                             for r in latest]}
          Path('V37C_HOSTED.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('V37C_HOSTED',json.dumps(out,sort_keys=True))
          PY
              exit 0
            fi
            sleep 5
          done
          exit 93

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v37-hosted-shot1-v37c
          path: |
            entered.csv
            before.csv
            after.csv
            limits.json
            SHA256SUMS.txt
            V37C_HOSTED.json
          retention-days: 10
          if-no-files-found: warn
