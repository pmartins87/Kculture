name: kexp049-worker-value
on:
  push:
    paths:
      - .github/workflows/kexp049-worker-value.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen files
        run: |
          test "$(git rev-parse HEAD:tools/audit_midgame_hire_marginal_value.py)" = "fed7647b378efaba35d1cd4dc2d82bd3fb6998d8"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Run worker value audit
        run: python tools/audit_midgame_hire_marginal_value.py --output artifacts/kexp049/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp049-worker-value
          path: artifacts/kexp049/report.json
