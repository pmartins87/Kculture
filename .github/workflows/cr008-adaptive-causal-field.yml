name: cr008-adaptive-causal-field
on:
  push:
    paths:
      - '.github/workflows/cr008-adaptive-causal-field.yml'
  workflow_dispatch:

jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub scikit-learn
      - name: Fetch frozen R4B physical base
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen CR-008 identities
        run: |
          test "$(git rev-parse HEAD:candidates/cr008_adaptive_frontrun.py)" = "8e1c26202c3101c19668bf61edf2ae51d4329d5d"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:models/cr007_pure_models.json)" = "d4b29e753e2328ac43503f8daa655cc63abdd336"
          test "$(git rev-parse HEAD:configs/cr008_fresh_exploratory_seeds_v1.json)" = "01b29fb4e19cba185b7d99a37ac13ee4715de574"
          echo '6f12e86d0b19c5ba39c2ab4131e186ea14b49f42cc33b33a2ad895fab55783bb  models/cr007_pure_models.json' | sha256sum -c -
      - name: Audit deployed feature parity
        run: |
          mkdir -p artifacts/cr008/feature-parity
          python tools/audit_cr008_feature_parity.py --top 5 --output artifacts/cr008/feature-parity/report.json
      - name: Fetch exact Kaito Sparse V13 package
        run: python tools/fetch_exact_package_main.py --handle kaitofukami/103-128-fresh-public-v43-sparse-shop-hybrid/versions/13 --output artifacts/cr008/opponents/kaito/main.py --receipt artifacts/cr008/opponents/kaito/receipt.json
      - name: Fetch exact Prvsiyan Frontier V10 package
        run: python tools/fetch_exact_package_main.py --handle prvsiyan/kaggriculture-frontier-the-soil-remembers-rain/versions/10 --output artifacts/cr008/opponents/prvsiyan/main.py --receipt artifacts/cr008/opponents/prvsiyan/receipt.json
      - name: Fetch exact Tactical Memory V1 package
        run: python tools/fetch_exact_package_main.py --handle web3cainiao/kaggriculture-v21-tactical-memory/versions/1 --output artifacts/cr008/opponents/tactical/main.py --receipt artifacts/cr008/opponents/tactical/receipt.json
      - name: Fetch exact Andrew V11 package
        run: python tools/fetch_exact_package_main.py --handle andrewsokolovsky/kaggriculture/versions/11 --output artifacts/cr008/opponents/andrew/main.py --receipt artifacts/cr008/opponents/andrew/receipt.json
      - name: Run CR-008 current-meta field
        run: |
          SEEDS=$(python -c 'import json; print(" ".join(map(str,json.load(open("configs/cr008_fresh_exploratory_seeds_v1.json"))["seeds"])))')
          python tools/run_tournament.py \
            --candidate file:candidates/cr008_adaptive_frontrun.py:agent \
            --opponents \
              file:artifacts/cr008/opponents/kaito/main.py:agent \
              file:artifacts/cr008/opponents/prvsiyan/main.py:agent \
              file:artifacts/cr008/opponents/tactical/main.py:agent \
              file:artifacts/cr008/opponents/andrew/main.py:agent \
            --seeds $SEEDS \
            --output-root artifacts/cr008/candidate-field
      - name: Run R4B paired current-meta control
        run: |
          SEEDS=$(python -c 'import json; print(" ".join(map(str,json.load(open("configs/cr008_fresh_exploratory_seeds_v1.json"))["seeds"])))')
          python tools/run_tournament.py \
            --candidate file:candidates/r4b_ablation_market_only.py:agent \
            --opponents \
              file:artifacts/cr008/opponents/kaito/main.py:agent \
              file:artifacts/cr008/opponents/prvsiyan/main.py:agent \
              file:artifacts/cr008/opponents/tactical/main.py:agent \
              file:artifacts/cr008/opponents/andrew/main.py:agent \
            --seeds $SEEDS \
            --output-root artifacts/cr008/base-field
      - name: Direct CR-008 vs R4B diagnostic
        run: |
          SEEDS=$(python -c 'import json; print(" ".join(map(str,json.load(open("configs/cr008_fresh_exploratory_seeds_v1.json"))["seeds"])))')
          python tools/run_tournament.py \
            --candidate file:candidates/cr008_adaptive_frontrun.py:agent \
            --opponents file:candidates/r4b_ablation_market_only.py:agent \
            --seeds $SEEDS \
            --output-root artifacts/cr008/direct-r4b
      - name: Apply frozen paired causal gate
        run: |
          python tools/compare_cr008_paired_field.py \
            --candidate-root artifacts/cr008/candidate-field \
            --base-root artifacts/cr008/base-field \
            --output artifacts/cr008/paired-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr008-adaptive-causal-field
          path: artifacts/cr008/**
