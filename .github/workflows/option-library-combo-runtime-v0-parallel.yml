name: option-library-combo-runtime-v0-parallel
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/option-library-combo-runtime-v0-parallel.yml'
      - 'tools/option_library_combo_runtime_v0_shard.py'
      - 'tools/aggregate_option_library_combo_runtime_v0.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        opponent:
          - v47_mirror
          - ready_stock
          - v48
          - router_2715
          - conditional_memory
          - tactical_memory
          - best_market
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: |
          python -m py_compile tools/option_library_combo_runtime_v0_shard.py
          python -m py_compile tools/aggregate_option_library_combo_runtime_v0.py
      - name: Run shard
        run: |
          mkdir -p artifacts/combo-shard
          python tools/option_library_combo_runtime_v0_shard.py \
            --opponent "${{ matrix.opponent }}" \
            --out "artifacts/combo-shard/OPTION_LIBRARY_COMBO_SHARD_${{ matrix.opponent }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combo-shard-${{ matrix.opponent }}
          path: artifacts/combo-shard/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: combo-shard-*
          path: artifacts/combo-shards
          merge-multiple: true
      - name: Aggregate
        run: |
          mkdir -p artifacts/option-library-combo-v0-parallel
          python tools/aggregate_option_library_combo_runtime_v0.py \
            --input-dir artifacts/combo-shards \
            --out artifacts/option-library-combo-v0-parallel/OPTION_LIBRARY_COMBO_V0_PARALLEL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-library-combo-runtime-v0-parallel
          path: artifacts/option-library-combo-v0-parallel/*.json
          retention-days: 30
          if-no-files-found: warn
