name: all3-v18b-p2-market-controller
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v18b-p2-market-controller.yml'
      - 'tools/all3_v18b_p2_dataset_shard.py'
      - 'tools/all3_v18b_train_market_controller.py'
      - 'docs/strategy/ALL3_V18B_TEMPORAL_MARKET_CONTROLLER_PROTOCOL_2026-09-20.md'
      - 'configs/all3_v14a_hard_contexts.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dataset:
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Syntax
        run: python -m py_compile tools/all3_v18b_p2_dataset_shard.py
      - name: Collect V18B dataset shard
        run: |
          mkdir -p artifacts/v18b-data
          python tools/all3_v18b_p2_dataset_shard.py             --hard-config configs/all3_v14a_hard_contexts.json             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v18b-data/V18B_DATA_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v18b-data-shard-${{ matrix.shard_index }}
          path: artifacts/v18b-data/*.json
          retention-days: 30
          if-no-files-found: warn

  train:
    needs: dataset
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trainer runtime
        run: |
          python -m pip install -U pip
          python -m pip install numpy scikit-learn
      - uses: actions/download-artifact@v4
        with:
          pattern: v18b-data-shard-*
          path: artifacts/v18b-data
          merge-multiple: false
      - name: Download binding V14B atlas
        uses: actions/download-artifact@v4
        with:
          name: all3-v14b-market-phenotype-atlas
          path: artifacts/v14b-source
          run-id: 35526759114
          github-token: ${{ github.token }}
      - name: Syntax
        run: python -m py_compile tools/all3_v18b_train_market_controller.py
      - name: Train source-held-out controller
        run: |
          mkdir -p artifacts/v18b-model
          python tools/all3_v18b_train_market_controller.py             --input-dir artifacts/v18b-data             --v14b artifacts/v14b-source/ALL3_V14B_MARKET_PHENOTYPE_ATLAS.json             --out artifacts/v18b-model/ALL3_V18B_P2_MARKET_CONTROLLER.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v18b-p2-market-controller
          path: artifacts/v18b-model/*.json
          retention-days: 30
          if-no-files-found: warn
