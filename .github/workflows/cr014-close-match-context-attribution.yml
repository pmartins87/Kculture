name: cr014-close-match-context-attribution
on:
  push:
    paths:
      - '.github/workflows/cr014-close-match-context-attribution.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U kagglehub
      - name: Fetch frozen R4B dependencies
        run: python tools/fetch_public_opponents.py
      - name: Verify frozen identities
        run: |
          test "$(git rev-parse HEAD:candidates/cr011_adaptive_early_order.py)" = "c4f1cb79f3c20b8229ab09e00a6878289cf9648d"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
          test "$(git rev-parse HEAD:configs/cr014_close_match_context_pairs_v1.json)" = "9c6fecc4f7d241e66a060aa264020f12631c9b8a"
          test "$(git rev-parse HEAD:tools/cr014_close_match_context_attribution.py)" = "ccb9ac685b985a0885c51d3efbdf5ba2c22a0b2e"
      - name: Fetch exact CR-013 current-meta packages
        run: |
          mkdir -p artifacts/cr014/opponents
          python tools/fetch_exact_package_main.py --handle kaitofukami/103-128-fresh-public-v43-sparse-shop-hybrid/versions/13 --output artifacts/cr014/opponents/kaito_sparse.py --receipt artifacts/cr014/opponents/kaito_sparse.json
          python tools/fetch_exact_package_main.py --handle prvsiyan/kaggriculture-frontier-the-soil-remembers-rain/versions/10 --output artifacts/cr014/opponents/prvsiyan.py --receipt artifacts/cr014/opponents/prvsiyan.json
          python tools/fetch_exact_package_main.py --handle salemali7/harvest-kaggriculture/versions/4 --output artifacts/cr014/opponents/salem.py --receipt artifacts/cr014/opponents/salem.json
          python tools/fetch_exact_package_main.py --handle raykkretzschmar/kaggriculture-rank-your-agent/versions/23 --output artifacts/cr014/opponents/rayk.py --receipt artifacts/cr014/opponents/rayk.json
          python tools/fetch_exact_package_main.py --handle kaitofukami/41-49-future-unseen-v19-replication-to-control/versions/1 --output artifacts/cr014/opponents/kaito_future.py --receipt artifacts/cr014/opponents/kaito_future.json
          python tools/fetch_exact_package_main.py --handle web3cainiao/kaggriculture-v21-tactical-memory/versions/1 --output artifacts/cr014/opponents/tactical.py --receipt artifacts/cr014/opponents/tactical.json
          python tools/fetch_exact_package_main.py --handle boatlee/v21-r1-public-state-route-portfolio/versions/2 --output artifacts/cr014/opponents/boatlee.py --receipt artifacts/cr014/opponents/boatlee.json
          python tools/fetch_exact_package_main.py --handle andrewsokolovsky/kaggriculture/versions/11 --output artifacts/cr014/opponents/andrew.py --receipt artifacts/cr014/opponents/andrew.json
          python tools/fetch_exact_package_main.py --handle tetsutani/read-the-town-build-the-farm-kaggriculture/versions/2 --output artifacts/cr014/opponents/tetsu.py --receipt artifacts/cr014/opponents/tetsu.json
      - name: Attribute near-boundary context
        run: |
          python tools/cr014_close_match_context_attribution.py \
            --opponent-dir artifacts/cr014/opponents \
            --output artifacts/cr014/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr014-close-match-context-attribution
          path: artifacts/cr014/**
