name: v38-live-status-20260929
'on':
  push:
    branches: [research/prize-solver-v0]
    paths: ['.github/workflows/v38-live-status-20260929.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read only current Kaggle state
        run: |
          set -euo pipefail
          python -m pip install -U 'kaggle>=2.2.3'
          kaggle competitions submissions kaggriculture -v -q | tee submissions.csv
          kaggle competitions submission-limits kaggriculture --json | tee limits.json
      - uses: actions/upload-artifact@v4
        with:
          name: v38-live-status-20260929
          path: |
            submissions.csv
            limits.json
          retention-days: 3
