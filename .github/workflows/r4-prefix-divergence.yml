name: r4-prefix-divergence

on:
  push:
    branches: [main]
    paths:
      - "tools/compare_agent_prefix.py"
      - "configs/public_opponents.json"
      - ".github/workflows/r4-prefix-divergence.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen environment
        run: python -m pip install -r requirements.txt

      - name: Fetch hash-pinned public agents
        run: python tools/fetch_public_opponents.py

      - name: Compare shared prefixes
        run: >-
          python tools/compare_agent_prefix.py
          --agent-a file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --agent-b file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --seed-partition development
          --limit-seeds 4
          --output artifacts/r4_prefix_cok_vs_seyamalam.json

      - name: Preserve prefix evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4-prefix-divergence
          path: artifacts/r4_prefix_cok_vs_seyamalam.json
