name: all3-v22a-fresh-current-frontier

'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v22a-fresh-current-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy

      - name: Syntax
        run: python -m py_compile tools/all3_v22a_fresh_current_frontier.py

      - name: Run V22A fresh frontier refresh
        run: |
          mkdir -p artifacts/v22a
          python tools/all3_v22a_fresh_current_frontier.py             --out artifacts/v22a/ALL3_V22A_FRESH_CURRENT_FRONTIER.json             --raw artifacts/v22a/kernels_score_desc_current.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v22a-fresh-current-frontier
          path: artifacts/v22a/**
          retention-days: 30
          if-no-files-found: warn
