name: v22b-rank11-current-source-sensitivity

'on':
  push:
    branches: [research/prize-solver-v0]
    paths:
      - '.github/workflows/v22b-rank11-current-source-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"
      - name: Install pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - name: Run NON-BINDING current-source sensitivity
        run: |
          python tools/run_v22b_rank11_current_source_sensitivity.py \
            --hard-config configs/all3_v22b_hard_contexts.json \
            --out artifacts/v22b-r11-sensitivity/V22B_RANK11_CURRENT_SOURCE_SENSITIVITY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22b-rank11-current-source-sensitivity
          path: artifacts/v22b-r11-sensitivity/*.json
          retention-days: 30
          if-no-files-found: warn
