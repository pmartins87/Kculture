name: all3-v13a-current-top30-drift
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/all3-v13a-current-top30-drift.yml'
      - 'tools/all3_v13a_current_top30_drift.py'
      - 'data/programme_teacher/2026-09-18/PROGRAMME_CORPUS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"
      - name: Install Kaggle CLI
        run: python -m pip install -U 'kaggle>=2.2.3'
      - name: Syntax
        run: python -m py_compile tools/all3_v13a_current_top30_drift.py
      - name: Run V13A current frontier drift census
        run: |
          mkdir -p artifacts/v13a
          python tools/all3_v13a_current_top30_drift.py             --out artifacts/v13a/ALL3_V13A_CURRENT_TOP30_DRIFT.json             --raw artifacts/v13a/kernels_score_desc_current.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all3-v13a-current-top30-drift
          path: artifacts/v13a/**
          retention-days: 30
          if-no-files-found: warn
