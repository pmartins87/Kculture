name: v28d-record-result
'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/v28d-record-result.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0
      - name: Record canonical result
        run: python tools/record_v28d_result.py
      - name: Commit canonical result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md ROADMAP.md HANDOFF.md data/programme_teacher/2026-09-18/OPTION_LIBRARY_V0.json
          git diff --cached --quiet || git commit -m 'Record binding V28D result in canonical sources'
          git push origin HEAD:research/prize-solver-v0
