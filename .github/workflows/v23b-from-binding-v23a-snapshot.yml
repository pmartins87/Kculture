name: v23b-from-binding-v23a-snapshot

# DORMANT TEMPLATE.
# Activate only if binding V23 workflow 35627972979 produces a valid
# V23A_IMMUTABLE_HARD_POPULATION_READY snapshot/config but the integrated
# V23B jobs fail for workflow/runtime mechanics. This must reuse the exact
# binding V23A artifacts; it must not reacquire any Kaggle source.

'on':
  push:
    branches: [research/prize-solver-v0]
    paths:
      - '.github/workflows/v23b-from-binding-v23a-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install complete pinned runtime
        run: |
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35627972979
          name: all3-v23a-immutable-source-snapshot
          path: artifacts/v23a-snapshot
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35627972979
          name: all3-v23-config
          path: artifacts/v23-config
      - name: Run exact V23B shard from binding snapshot only
        run: |
          mkdir -p artifacts/v23b
          python tools/all3_v23b_immutable_snapshot_shard.py \
            --hard-config artifacts/v23-config/V23B_HARD_CONFIG.json \
            --snapshot-dir artifacts/v23a-snapshot \
            --shard-index ${{ matrix.shard_index }} \
            --num-shards 4 \
            --out artifacts/v23b/V23B_SHARD_${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v23b-fallback-shard-${{ matrix.shard_index }}
          path: artifacts/v23b/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v23b-fallback-shard-*
          path: artifacts/v23b-shards
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35627972979
          name: all3-v23-config
          path: artifacts/v23-config
      - name: Aggregate and route
        run: |
          mkdir -p artifacts/v23b-final artifacts/v23b-route
          python tools/aggregate_all3_v23b_immutable_snapshot.py \
            --input-dir artifacts/v23b-shards \
            --hard-config artifacts/v23-config/V23B_HARD_CONFIG.json \
            --out artifacts/v23b-final/ALL3_V23B_IMMUTABLE_SNAPSHOT_DOMAIN_UPPER_BOUND.json
          python tools/route_v23b_outcome.py \
            --aggregate artifacts/v23b-final/ALL3_V23B_IMMUTABLE_SNAPSHOT_DOMAIN_UPPER_BOUND.json \
            --cluster-map artifacts/v23-config/V23_FUNCTIONAL_CLUSTERS.json \
            --out artifacts/v23b-route/ALL3_V23B_OUTCOME_ROUTE.json
      - uses: actions/upload-artifact@v4
        with:
          name: all3-v23b-fallback-domain-upper-bound
          path: |
            artifacts/v23b-final/*.json
            artifacts/v23b-route/*.json
          retention-days: 30
          if-no-files-found: error
