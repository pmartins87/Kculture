          --opponents file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --seed-partition development
          --output-root artifacts/atlas/candidate-vs-seyamalam
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-candidate-vs-seyamalam
          path: artifacts/atlas/candidate-vs-seyamalam/**/tournament.json

