name: r4-development-failure-atlas

on:
  push:
    paths:
      - ".github/workflows/r4-development-failure-atlas.yml"
  workflow_dispatch:

jobs:
  candidate-vs-r4a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_public_opponents.py
      - name: Verify frozen validated candidate blob
        run: test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - run: >-
          python tools/run_tournament.py
          --candidate file:candidates/r4b_ablation_market_only.py:agent
          --opponents file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --seed-partition development
          --output-root artifacts/atlas/candidate-vs-r4a
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-candidate-vs-r4a
          path: artifacts/atlas/candidate-vs-r4a/**/tournament.json

  candidate-vs-seyamalam:
