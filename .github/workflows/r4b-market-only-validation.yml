name: r4b-market-only-validation

on:
  push:
    branches: [main]
    paths:
      - "candidates/r4b_ablation_market_only.py"
      - "configs/r4b_market_only_candidate.json"
      - "experiments/KEXP-20260825-007-r4b-market-only-validation/**"
      - ".github/workflows/r4b-market-only-validation.yml"
  workflow_dispatch:

jobs:
  control-r4a-vs-seyamalam:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_public_opponents.py
      - name: Verify frozen candidate blob is present unchanged
        run: test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: R4A validation control versus Seyamalam V21
        run: >-
          python tools/run_tournament.py
          --candidate file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --opponents file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --seed-partition validation
          --output-root artifacts/validation/control-r4a-vs-seyamalam
      - uses: actions/upload-artifact@v4
        with:
          name: r4b-validation-control-r4a-vs-seyamalam
          path: artifacts/validation/control-r4a-vs-seyamalam/**/tournament.json

  candidate-vs-seyamalam:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_public_opponents.py
      - name: Verify frozen candidate blob
        run: test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Frozen market-only candidate versus Seyamalam V21
        run: >-
          python tools/run_tournament.py
          --candidate file:candidates/r4b_ablation_market_only.py:agent
          --opponents file:artifacts/public_opponents/seyamalam_v21_8b8c421.py:agent
          --seed-partition validation
          --output-root artifacts/validation/candidate-vs-seyamalam
      - uses: actions/upload-artifact@v4
        with:
          name: r4b-validation-candidate-vs-seyamalam
          path: artifacts/validation/candidate-vs-seyamalam/**/tournament.json

  candidate-vs-r4a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_public_opponents.py
      - name: Verify frozen candidate blob
        run: test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Frozen market-only candidate versus frozen R4A
        run: >-
          python tools/run_tournament.py
          --candidate file:candidates/r4b_ablation_market_only.py:agent
          --opponents file:artifacts/public_opponents/cok_v8_779caae.py:agent
          --seed-partition validation
          --output-root artifacts/validation/candidate-vs-r4a
      - uses: actions/upload-artifact@v4
        with:
          name: r4b-validation-candidate-vs-r4a
          path: artifacts/validation/candidate-vs-r4a/**/tournament.json
