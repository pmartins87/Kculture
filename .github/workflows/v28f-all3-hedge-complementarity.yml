name: v28f-all3-hedge-complementarity

'on':
  push:
    branches:
      - research/prize-solver-v0
    paths:
      - '.github/workflows/v28f-all3-hedge-complementarity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    outputs:
      frontier_decision: ${{ steps.read.outputs.frontier_decision }}
      prep_pass: ${{ steps.read.outputs.prep_pass }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact research runtime
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' 'kaggle>=2.2.3' numpy

      - name: Download preserved exact CR053 package pair
        uses: actions/download-artifact@v4
        with:
          name: cr052-cr053-hosted-candidates
          path: artifacts/v28f-cr053
          run-id: 34105008373
          github-token: ${{ github.token }}

      - name: Rebuild exact CR029 deterministic package
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python tools/build_cr029_recent_top_submission.py             --authorization CR029_FULL_RECENT_TOP_PASS__BUILD_PACKAGE

      - name: Acquire and freeze fresh current frontier
        id: frontier
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/v28f-snapshot-result
          python tools/v28b_current_frontier_snapshot.py             --out artifacts/v28f-snapshot-result/V28F_FRONTIER_RESULT.json             --raw artifacts/v28f-snapshot-result/TOP30_RAW.csv             --snapshot-dir artifacts/v28f-snapshot

      - name: Prepare exact hedge candidates
        id: prep
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/v28f_prepare_hedge_candidates.py             --snapshot-dir artifacts/v28f-snapshot             --cr053-root artifacts/v28f-cr053             --cr029-root artifacts/submissions/cr029_full_recent_top_v1             --out artifacts/v28f-snapshot-result/V28F_CANDIDATE_PREP.json

      - name: Read snapshot gates
        id: read
        if: always()
        run: |
          python - <<'PY'
          import json,os
          f='artifacts/v28f-snapshot-result/V28F_FRONTIER_RESULT.json'
          p='artifacts/v28f-snapshot-result/V28F_CANDIDATE_PREP.json'
          fd='V28F_NO_FRONTIER_RESULT'
          pp=False
          if os.path.exists(f):
              fd=json.load(open(f)).get('decision',fd)
          if os.path.exists(p):
              pp=bool(json.load(open(p)).get('mechanical_pass'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"frontier_decision={fd}\n")
              out.write(f"prep_pass={'true' if pp else 'false'}\n")
          print("V28F_SNAPSHOT_GATES",json.dumps({"frontier_decision":fd,"prep_pass":pp},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28f-snapshot-result
          path: artifacts/v28f-snapshot-result/*
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28f-immutable-snapshot
          path: artifacts/v28f-snapshot/**
          retention-days: 14
          if-no-files-found: warn

      - name: Fail invalid snapshot or candidate prep
        if: steps.frontier.outcome != 'success' || steps.prep.outcome != 'success' || steps.read.outputs.frontier_decision != 'V28B_FRONTIER_SNAPSHOT_READY' || steps.read.outputs.prep_pass != 'true'
        run: exit 2

  shard:
    needs: snapshot
    if: needs.snapshot.outputs.frontier_decision == 'V28B_FRONTIER_SNAPSHOT_READY' && needs.snapshot.outputs.prep_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned execution runtime
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'kaggle-environments==1.32.7' 'kagglehub>=0.3.12' numpy

      - uses: actions/download-artifact@v4
        with:
          name: v28f-immutable-snapshot
          path: artifacts/v28f-snapshot

      - name: Run V28F benchmark shard
        run: |
          set -euo pipefail
          mkdir -p artifacts/v28f
          python tools/v28f_hedge_benchmark_shard.py             --snapshot-dir artifacts/v28f-snapshot             --shard-index ${{ matrix.shard_index }}             --num-shards 4             --out artifacts/v28f/V28F_SHARD_${{ matrix.shard_index }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28f-shard-${{ matrix.shard_index }}
          path: artifacts/v28f/*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: [snapshot,shard]
    if: needs.snapshot.outputs.frontier_decision == 'V28B_FRONTIER_SNAPSHOT_READY' && needs.snapshot.outputs.prep_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prize-solver-v0

      - uses: actions/download-artifact@v4
        with:
          pattern: v28f-shard-*
          path: artifacts/v28f-shards
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          name: v28f-snapshot-result
          path: artifacts/v28f-snapshot-result

      - name: Aggregate frozen V28F selector
        run: |
          set -euo pipefail
          mkdir -p artifacts/v28f-final
          python tools/aggregate_v28f_hedge_benchmark.py             --input-dir artifacts/v28f-shards             --snapshot-result artifacts/v28f-snapshot-result/V28F_FRONTIER_RESULT.json             --candidate-prep artifacts/v28f-snapshot-result/V28F_CANDIDATE_PREP.json             --out artifacts/v28f-final/V28F_ALL3_HEDGE_COMPLEMENTARITY.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28f-all3-hedge-complementarity
          path: artifacts/v28f-final/*.json
          retention-days: 30
          if-no-files-found: error
