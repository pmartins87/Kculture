name: r4d-late-carrot-seed-ledger

on:
  push:
    paths:
      - .github/workflows/r4d-late-carrot-seed-ledger.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify identities
        run: |
          test "$(git rev-parse HEAD:tools/inspect_late_carrot_seed_ledger.py)" = "4a602abc7db509e0e4903e2896565403a9dd5530"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Run exact seed ledger audit V3
        run: python tools/inspect_late_carrot_seed_ledger.py --output artifacts/kexp026/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp026-v3-late-carrot-seed-ledger
          path: artifacts/kexp026/**
