name: kexp037-exploratory-direct

on:
  push:
    paths:
      - .github/workflows/kexp037-exploratory-direct.yml
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch frozen base
        run: python tools/fetch_public_opponents.py
      - name: Verify identities
        run: |
          test "$(git rev-parse HEAD:tools/run_exploratory_live_meta_direct.py)" = "c0a72eb7bc58319920748ffb6aece1aa3610dbbf"
          test "$(git rev-parse HEAD:candidates/r4d_early_terminal_noninput_sell.py)" = "222e9c1de9bab043780af4a1f10bf8cd2f0c210f"
          test "$(git rev-parse HEAD:candidates/r4b_ablation_market_only.py)" = "e564125f0c4a1711fd3ea065dc1cb27d4a62ce37"
      - name: Run exploratory direct screen
        run: python tools/run_exploratory_live_meta_direct.py --candidate file:candidates/r4d_early_terminal_noninput_sell.py:agent --opponent file:candidates/r4b_ablation_market_only.py:agent --output artifacts/kexp037-exploratory/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kexp037-exploratory-direct
          path: artifacts/kexp037-exploratory/report.json
